ust register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. Part of the county is in Bannau Brycheiniog (Brecon Beacons) National Park, where the park authority handles planning.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, confirmed unchanged for 2026/27 at Full Council on 5 Mar 2026. It applies to furnished homes where nobody lives or the owner has a main home elsewhere. Useful for holiday lets: the council also made a local exception so a property moving from business rates to council tax is free of the second-home premium for 12 months (standard council tax is still payable). Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). In 2025/26, 387 homes were liable for the premium and 273 were billed after exceptions.", ["https://www.monmouthshire.gov.uk/council-tax-premiums-for-long-term-empty-properties-and-second-homes/", "https://democracy.monmouthshire.gov.uk/documents/s44679/3.%2020260305%20Council%20-%20Council%20Tax%20Resolution%20and%20Budget%20report%202026-27%20Final.pdf"]]]}, {"n": "Vale of Glamorgan", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/vale-of-glamorgan", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. The council's Nov 2025 housing market paper on second and holiday homes found their numbers low and did not propose a local planning policy for them.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, reaffirmed by Cabinet on 18 Dec 2025 and set by Council on 9 Mar 2026 for 2026/27. It applies to furnished homes that are not anyone's sole or main residence. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). The Vale also lists Class 7 (job-related homes). Apply for an exception through the council's online Council Tax Enquiry form and upload evidence. The council gives no discount on empty homes, and long-term empty homes pay a 100% to 200% premium depending on how long they have been empty.", ["https://www.valeofglamorgan.gov.uk/en/our_council/council_tax/Council-Tax.aspx", "https://www.valeofglamorgan.gov.uk/Documents/_Committee%20Reports/Cabinet/2025/25-12-18/Premiums-Long-Term-Empty-Properties-and-Second-Homes.pdf", "https://www.valeofglamorgan.gov.uk/Documents/Our%20Council/Council%20Tax%20&%20Benefits/2026-27/EN-Council-Tax-Explanatory-Notes-20262027.pdf", "https://valeofglamorgan.oc2.uk/docfiles/63/BP10C%20LHMA%20Second%20and%20Holiday%20Homes.pdf"]]]}, {"n": "Wrexham", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/wrexham", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 50% on top of the standard charge (so 150% in total), the rate Wrexham has charged since 1 Apr 2017 and still in its 2026/27 tax base. That is lower than most Welsh councils that charge a premium. Long-term empty homes pay far more: 200% premium (300% bill) from 1 Apr 2025, or 250% (350% bill) once empty for 4 years or more. A second home is a furnished home that is not anyone's sole or main residence. Exceptions include homes marketed for sale or let (one year only), annexes, armed forces homes, occupied caravan pitches and boat moorings, seasonal homes where year-round occupation is not allowed (for example by a planning condition), and job-related homes. The 2026/27 tax base counted 71 homes paying the second-home premium.", ["https://www.wrexham.gov.uk/service/empty-and-second-home-premium", "https://www.wrexham.gov.uk/sites/default/files/2025-12/cofi4525-setting-the-council-tax-base-2026-27.pdf"]]]}, {"n": "Flintshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/flintshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2023 (Council decision 13 Dec 2022), kept for 2026/27 when Council set the tax on 24 Feb 2026. It applies to substantially furnished homes that are not anyone's sole or main residence, and Flintshire gives no discount on second homes. Long-term empty homes pay a 100% premium after one year, rising from Apr 2026 to 150% after 3 years, 200% after 5 years and 300% after 10 years. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Class 7 (job-related homes) and Classes 1 to 4 (marketed for sale or let for up to a year, annexes, armed forces) also apply.", ["https://www.flintshire.gov.uk/en/Resident/Council-Tax-and-Benefits-and-Grants/Council-Tax.aspx", "https://committeemeetings.flintshire.gov.uk/ieDecisionDetails.aspx?AIId=32855&LLL=0", "https://committeemeetings.flintshire.gov.uk/ieDecisionDetails.aspx?AIId=26211&LLL=0"]]]}, {"n": "Bridgend", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/bridgend", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 200% on top of the standard charge (so a bill of 300%, triple the normal amount) from 1 Apr 2026. Council decided on 20 Sep 2023 to start a 100% premium on second homes from 1 Apr 2024 and raise it to 200% after two years, which makes Bridgend one of the highest-charging councils in Wales. It applies to substantially furnished homes that are not anyone's sole or main home. Long-term empty homes (empty and unfurnished for a year) have paid a premium since 1 Apr 2023, also rising after two years. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition prevents year-round or main-residence use, or limits the home to holiday letting) and Class 7 (job-related homes). Claim an exception by emailing premiums@bridgend.gov.uk. The council collected about £161,000 from the second-home premium in 2025/26. A 2022 planning report found no obvious local concentration of second homes or short-term lets, but noted the Porthcawl Waterfront redevelopment could justify limits later.", ["https://www.bridgend.gov.uk/residents/council-tax/council-tax-premiums-for-long-term-empty-properties-and-second-homes/", "https://democratic.bridgend.gov.uk/documents/s37465/COSC27Jan26ResponsestoRecommendationsandRequests.docx.pdf", "https://democratic.bridgend.gov.uk/documents/s29127/UCO%20GPDO%20report%20appxs.pdf"]]]}, {"n": "Newport", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/newport", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, still charged in 2026/27. The council says this can include short-term holiday lets that pay council tax rather than business rates. Long-term empty homes (empty and unfurnished for a year or more) have paid a 100% premium since 1 Apr 2024, and Newport gives no discount on empty unfurnished homes. Exceptions: Class 1 (marketed for sale, one year only), Class 2 (marketed for a let of at least 6 months, one year only; holiday lets and Airbnb short lets do not count), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition restricts occupancy for at least 28 days a year, limits the home to holiday letting, or prevents main-residence use) and Class 7 (job-related homes provided by an employer). Your bill shows if the premium applies.", ["https://www.newport.gov.uk/council-tax/council-tax-premiums", "https://www.newport.gov.uk/sites/default/files/media/media-documents/Council-tax-and-non-domestic-rates-2026-27.pdf"]]]}, {"n": "Neath Port Talbot", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/neath-port-talbot", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, still charged in 2026/27 (2026/27 tax base report). Long-term empty homes (empty and unfurnished for a year) pay the same 100% premium. Holiday-let owners should know about local exception D, added from 1 Apr 2026: if a self-catering property is moved off the business rates list onto council tax because it no longer meets the letting criteria, the council can waive the premium for 6 months from the date it was moved, giving time to appeal to the Valuation Office or decide what to do with the property (the move is usually backdated, which otherwise means a large backdated premium). Apply by calling the Council Tax Team on 01639 686188, option 2. Local exception C gives 6 months without the premium when a home is left empty after a parent or step-parent dies. National exceptions: Class 1 and 2 (marketed for sale, or for a let of at least 6 months, one year only; holiday lets and Airbnb short lets do not count), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition restricts occupancy for at least 28 days a year, limits the home to holiday letting, or prevents main-residence use) and Class 7 (job-related homes).", ["https://www.npt.gov.uk/council-tax/premiums-for-empty-properties-and-second-homes/", "https://democracy.npt.gov.uk/documents/s112460/SCMDPR190326-Council%20Tax%20Premium%20Exceptions%20NEW.pdf", "https://democracy.npt.gov.uk/documents/s109751/Urgent%20-%20Council%20Tax%20Base%202026-27.pdf"]]]}, {"n": "Rhondda Cynon Taf", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/rhondda-cynon-taf", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. In a 2023 Freedom of Information reply the council said there are no specific local restrictions on short-term lets beyond the national rules.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets", "https://www.whatdotheyknow.com/request/planning_requirements_for_short_317"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, agreed by the council in January 2023 and still shown in the council's current council tax guide. It applies to homes that are not anyone's sole or main residence and are substantially furnished. Long-term empty homes (empty and unfurnished for a year) have paid a premium since 1 Apr 2023: from 1 Apr 2025 that is 100% after 1 to 3 years and 200% after more than 3 years. Exceptions: Class 1 and 2 (marketed for sale, or for a let of at least 6 months, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition prevents year-round or main-residence use, or limits the home to holiday letting) and Class 7 (job-related homes). Apply for an exception through the council's premiums page. The council says the number of second homes paying the premium rose from 491 on 1 Apr 2023 to 647 by 31 Mar 2024.", ["https://www.rctcbc.gov.uk/EN/Resident/CouncilTax/CouncilTaxPremiums.aspx", "https://www.rctcbc.gov.uk/en/resident/counciltax/relateddocuments/counciltaxbooklet.pdf"]]]}, {"n": "Caerphilly", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/caerphilly", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control on second homes or short-term lets found (checked 25 Oct 2026). The council's three Article 4 directions (Bute Town and Rhymney Town in Rhymney, and Pontywaun Garden Suburbs in Crosskeys) protect the look of conservation areas, such as windows, roofs and front walls, and do not cover changes of use. Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets", "https://www.caerphilly.gov.uk/services/planning-and-building-control/conservation-of-the-built-environment/article-4-direction"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, agreed by Cabinet on 20 Mar 2024 and full Council on 27 Mar 2024, and still charged in 2026/27 (the council's 2026/27 return to the Welsh Government shows 175 second homes paying the 100% premium). It applies to homes that are not anyone's sole or main residence and are substantially furnished. Long-term empty homes (empty and unfurnished) pay nothing extra until they have been empty for 2 years: then 100%, rising to 200% after 3 years and 300% after 5 years. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (seasonal homes where year-round occupation is prohibited) and Class 7 (job-related homes). The council lists no local exception for holiday lets moving from business rates to council tax (checked 25 Oct 2026). To claim an exception, email premiums@caerphilly.gov.uk with evidence, such as an estate agent's agreement and listing link, or a planning reference number for annexes or homes with planning restrictions.", ["https://beta.caerphilly.gov.uk/council-tax-premiums", "https://www.southwalesargus.co.uk/news/24216271.caerphilly-council-order-tax-premiums-empty-properties/", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx"]]]}, {"n": "Torfaen", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/torfaen", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. No council tax second-home premium: Torfaen is one of only two Welsh councils not charging one in 2026/27 (Welsh Government council tax dwellings return: 0 homes on any premium in Torfaen), and it does not charge a long-term empty premium either. The council says it is considering premiums on second homes and long-term empty homes, is reviewing how many properties would be affected, and that any decision would need public consultation and councillors' approval. Its stated approach for now is to help owners bring empty homes back into use rather than charge a premium. A council's first decision to charge a second-home premium must be made at least a year before the financial year it starts, so check the council's page before buying. Second homes and empty homes get no council tax discount, so a furnished holiday let on council tax pays the standard bill (2026/27 bill notes).", ["https://www.torfaen.gov.uk/en/council-tax-benefits-and-money/council-tax/council-tax-premiums-for-long-term-empty-properties-and-second-homes", "https://www.torfaen.gov.uk/asset-library/en/council-tax/council-tax-explanatory-notes.pdf", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx", "https://www.whatdotheyknow.com/request/freedom_of_information_request_c_1809"]]]}, {"n": "Blaenau Gwent", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/blaenau-gwent", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: UNVERIFIED for 2026/27, because the sources disagree. The council's premiums page says a 100% second-home premium (so a double bill) starts on 1 Apr 2026 for homes that are nobody's sole or main residence and are substantially furnished. But the council's own 2026/27 return to the Welsh Government shows no second homes paying a premium, and GOV.WALES says only 20 of the 22 Welsh councils charge one in 2026/27. Ask the council (Premiums@blaenau-gwent.gov.uk, 01495 363900) which applies before you budget. Second homes and holiday homes get no council tax discount. Long-term empty homes (empty and unfurnished for over 12 months) have paid a premium since 1 Apr 2025: 100% after 1 to 2 years, 200% after 2 to 3 years and 300% after more than 3 years, ignoring any time empty before 1 Apr 2024. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited) and Class 7 (job-related homes), plus local exceptions for long-term empty homes only (new buyers for up to 12 months, awaiting an empty-property grant or loan, complex legal issues, awaiting planning permission, and some mixed-use buildings). Apply with the council's premium exception form.", ["https://blaenau-gwent.gov.uk/en/resident/council-tax/council-tax-premium-for-long-term-empty-property", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx", "https://www.blaenau-gwent.gov.uk/resident/council-tax/council-tax-exemptions/"]]]}, {"n": "Merthyr Tydfil", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/merthyr-tydfil", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, kept for 2025/26 (full Council, 6 Nov 2024) and for 2026/27 (full Council, 11 Feb 2026, as reported by Nation.Cymru). The council's 2026/27 return to the Welsh Government shows 171 second homes paying the 100% premium. It applies to homes that are substantially furnished and are not the owner's or occupier's sole or main residence. Long-term empty homes: exempt for the first 6 months after becoming unfurnished, then the full charge, then a premium once empty for over a year: 100% (1 to 5 years), 150% (5 to 10 years) and 200% (over 10 years). Exceptions: Classes 1 to 7 (marketed for sale or let, one year only; annexes; armed forces; occupied caravan pitches and boat moorings; a planning condition stops year-round occupation or limits the home to holiday use; job-related homes), plus local Class 8 (new owners bringing a property back into use, and mixed-use buildings) and, from 1 Apr 2025, Class 9 (ongoing renovation, up to 6 months). Contact revenues@merthyr.gov.uk or 01685 725000. Band D for 2026/27 is £2,591.47 (£2,625.36 in Trelewis and Bedlinog).", ["https://www.merthyr.gov.uk/resident/council-tax/council-tax-premiums/", "https://nation.cymru/news/council-to-continue-charging-higher-council-tax-on-second-homes/", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx", "https://www.merthyr.gov.uk/resident/council-tax/council-tax-bands-and-charges/"]]]}, {"n": "Torridge", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/torridge", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Torridge has Article 4 directions in some conservation areas, but these control building alterations, not holiday-let use. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council agreed in principle on 5 Sep 2022 to charge a 100% second homes premium, and voted on 22 Jan 2024 to bring it in, so from 1 Apr 2025 homes that are substantially furnished and nobody's main home pay 200% council tax (no premium was charged before). The council updated its Empty Homes and Second Home Premium Policy in 2025 to follow the national exceptions. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Empty and unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If the use of your property changes, the council asks for evidence, and you must tell it about a change in circumstances within 21 days or risk a £70 penalty. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.torridge.gov.uk/article/19942/Empty-and-Exempt-Properties", "https://www.torridge.gov.uk/article/22102/Change-to-Council-Tax-Charge-for-Second-Homeowners-from-1st-April-2025", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Lindsey", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-lindsey", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. East Lindsey's Article 4 directions cover changes to the appearance of homes in conservation areas (windows, doors, porches, roofs), not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.e-lindsey.gov.uk/article/6141/Article-4-Directions-and-Local-Development-Orders"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Council approved a 100% premium on second homes and furnished homes not used as anyone's main home on 28 Feb 2024, so from 1 Apr 2025 the charge is 200%. The council published notice in the local press in Mar 2024 and wrote to owners it thought were affected in Nov and Dec 2024. The premium is added automatically to your bill, which you can still pay in 10 or 12 instalments. Permanent exceptions it lists: armed forces accommodation, annexes to a main home, job-related homes, caravan pitches and boat moorings, and homes where a planning restriction prevents occupation. Up to 12 months: marketed for sale, marketed for let, probate granted in the last 12 months, and major repairs or structural alterations. Claim using the council's second home/furnished property review form, with evidence. Empty and unfurnished homes pay a premium once empty for 2 years: 100% (2 years), 200% (5 years) and 300% (10 years). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.e-lindsey.gov.uk/article/27747/Council-Tax-Additional-Charges", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Cotswold", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cotswold", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 25 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. Cotswold has Article 4 directions in several villages (including Bibury, Bourton-on-the-Water, Chipping Campden, Mickleton and South Cerney) and on some individual sites. They remove permitted development rights for things like house alterations and some land uses, not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.cotswold.gov.uk/planning-and-building/planning-policy/article-3-and-4-directions/"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council voted unanimously on 20 Mar 2024 to charge an extra 100% premium on second homes (furnished, nobody's main home), so from 1 Apr 2025 the bill is 200% (the council gave the required one year's notice). The council says the exceptions are part of its adopted policy. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). A general second home that can be used all year round with no planning restriction pays the premium. The council's second homes page does not give a claim form for exceptions, so contact its council tax team with evidence. Empty and unfurnished homes have paid a premium since 1 Apr 2024 once empty for 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If you think your property is a holiday let rather than a second home, the council says you keep paying council tax until the Valuation Office Agency moves it to the business rates list. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.cotswold.gov.uk/council-tax-and-benefits/second-homes/", "https://news.cotswold.gov.uk/news/council-clamps-down-on-empty-and-second-homes-to-help-tackle-housing-crisis", "https://www.cotswold.gov.uk/council-tax-and-benefits/council-tax-discounts-and-exemptions/reductions-for-empty-properties/council-tax-on-long-term-empty-properties/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 25 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. The national planning data register lists no Article 4 directions for East Devon. In a June 2023 report on the government's short-let consultation, council officers said the council did not have robust evidence on where short-term lets cause problems, which an Article 4 direction would need.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://democracy.eastdevon.gov.uk/documents/s20327/Response%20to%20government%20consultation%20on%20Short%20Term%20Lets%20V4.pdf"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 21 Feb 2024 Full Council approved Cabinet's recommendation (31 Jan 2024) to charge a 100% premium on homes that are unoccupied but substantially furnished, so second and holiday homes pay 200% council tax from 1 Apr 2025. The council agreed to ringfence its share of the extra money for housing and to review this in 2029. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). For the 12-month sale and letting exceptions, the council uses the date the home was first marketed, not the latest. Apply online for a premium exception with evidence (for example the sale or letting listing and the date first marketed, proof that it is an annexe, or the planning reference for a planning restriction). The council may visit to check, and you must tell it about any change within 21 days. Empty and unfurnished homes have paid a premium since 1 Apr 2024 once empty for 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (more than 10 years). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://eastdevon.gov.uk/council-tax/council-tax-discounts-and-exemptions-information/secondholiday-homes/", "https://democracy.eastdevon.gov.uk/documents/g2215/Printed%20minutes%2021st-Feb-2024%2018.00%20Council.pdf", "https://eastdevon.gov.uk/council-tax/apply-for-or-cancel-a-premium-exception/", "https://eastdevon.gov.uk/council-tax/council-tax-discounts-and-exemptions-information/empty-property-discounts/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Torbay", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/torbay", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. The national planning data register lists two Article 4 directions for Torbay, in the Churston (1998) and Polsham (2002) conservation areas. They cover building works in those areas, not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=344"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council confirmed on 8 Dec 2022 that it intended to charge a premium on second homes, and on 5 Dec 2024 adopted a 100% premium from 1 Apr 2025, so homes that are furnished and nobody's main home pay 200%. The 2026/27 council tax base still includes the premium. Torbay has no extra local exceptions, only the national ones. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). For Class L the council asks for a copy of the planning condition or the planning reference. Instead of extra exceptions, the council can give a discretionary reduction for exceptional personal circumstances; a June 2026 review report said only a couple of people had applied and none had been granted, and recommended keeping the premiums as they are. Empty and unfurnished homes pay a 100% premium after 1 year (since 1 Apr 2024), 200% after 5 years and 300% after 10 years. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief. The same review said 16 homes that would have paid the premium moved to business rates in the past year, and that the Valuation Office Agency asks for significant evidence of lettings first.", ["https://www.torbay.gov.uk/council-tax/reducing-your-bill/second-home/", "https://www.torbay.gov.uk/DemocraticServices/documents/b49548/Item+11+Council+Tax+Base+202526+Thursday+05-Dec-2024+17.30+Council.pdf?T=9", "https://www.torbay.gov.uk/council-tax/reducing-your-bill/prescribed/", "https://www.torbay.gov.uk/DemocraticServices/documents/s170335/Review%20of%20Council%20Tax%20Premiums%20for%20Long%20Term%20Empty%20and%20Second%20Homes.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Brighton & Hove", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/brighton-and-hove", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). The council says you might need planning permission to use part of your home or a whole property as a short-term holiday let, depending on how much the use changes, and asks you to check with its planning applications team (01273 292222, planning.applications@brighton-hove.gov.uk). The city-wide Article 4 direction covers changing a house into a small HMO, not short lets. A council task and finish group on short lets reported in 2025; a March 2026 update says ideas such as zones where short lets are allowed or restricted are being looked at for City Plan 2041, with a visitor accommodation study commissioned. Nothing new applies yet.", ["https://www.brighton-hove.gov.uk/planning/planning-policy/short-term-holiday-lets", "https://www.brighton-hove.gov.uk/planning/planning-applications/planning-permission-houses-multiple-occupation", "https://democracy.brighton-hove.gov.uk/documents/s213803/Update%20on%20Short%20Term%20Lets%20report%20recommendations.pdf"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 1 Feb 2024 Full Council approved a 100% premium on empty furnished homes (second homes) from 1 Apr 2025, so a second home or furnished let with nobody living there pays 200%, from the day it becomes empty. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If you think an exception applies, send evidence to the council tax team. Serviced accommodation: the council's 2026/27 budget papers proposed making serviced accommodation (furnished homes let for short to medium stays with hotel-like services) an exception to the premium from 1 Apr 2026, for Budget Council on 26 Feb 2026. UNVERIFIED: we could not open the meeting minutes to confirm the final vote, so ask the council tax team before relying on it. Empty and unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (over 10 years). The council no longer gives discounts for homes that are uninhabitable or undergoing work. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.brighton-hove.gov.uk/council-tax/council-tax-information/council-tax-empty-properties", "https://democracy.brighton-hove.gov.uk/mgAi.aspx?ID=99158", "https://democracy.brighton-hove.gov.uk/documents/s212886/Appendix%208%20-%20Second%20Homes%20Premium%20Serviced%20Accommodation%20Exception.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Bath and North East Somerset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/bath-and-north-east-somerset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). The council's Article 4 directions cover things like turning offices into homes in Bath, demolishing walls, estate agents' boards, houses in multiple occupation (HMOs) in Bath and some protected land, not holiday-let use. The national planning data register has no Article 4 data published for the council. A 2018 council scrutiny report on short-term lets said London's 90-night rule has no effect in Bath & North East Somerset, and that most short lets in Bath (3 or fewer rooms) stay in the C3 dwellinghouse use class, so are not a material change of use; larger ones can be, depending on the facts. Much of Bath is a World Heritage Site and conservation area, so check before altering a building.", ["https://www.bathnes.gov.uk/policy-and-documents-library/article-4-directions", "https://democracy.bathnes.gov.uk/documents/s52473/Short%20Term%20Lets.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=38"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet. Bath & North East Somerset is part of the West of England Combined Authority, whose Mayor will get this power. On 10 Sep 2026 the Combined Authority said people and businesses will be able to have their say in the coming months before plans are finalised. No rate or start date has been set.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities", "https://www.westofengland-ca.gov.uk/news/visitor-levy-moves-step-closer-for-west/"]], ["Fees and council tax", "No short-let fees. Council tax: on 30 Nov 2023 Full Council unanimously resolved (minute 56) to increase council tax on all second homes by 100% from 1 Apr 2025, so a furnished home that is nobody's main home pays 200%. The council's page (checked 26 Oct 2026) says it still charges the premium and that it shows on your annual bill. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council adds that the 12-month sale or letting exception runs from the date the home was first advertised, can be used only once, and cannot apply if the home was first put on the market before 1 Apr 2024. Claim an exception online with the council's second home premium exception claim form; if the home is actually someone's main home, tell the council about a change of circumstances. The council may ask for evidence and a visiting officer may check. Empty and unfurnished homes: at the same meeting the council agreed to charge the empty homes premium after 1 year from 1 Apr 2024 (minute 55). Rates are 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and they continue when the home changes owner. Empty-home exceptions include major repairs or structural work (Class M, up to 12 months). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.bathnes.gov.uk/second-homes-and-periodically-occupied-properties", "https://democracy.bathnes.gov.uk/documents/g6221/Public%20minutes%2030th-Nov2023%2018.30%20Council.pdf?T=11", "https://www.bathnes.gov.uk/form/second-home-premium-exception", "https://www.bathnes.gov.uk/emptyproperties", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "New Forest", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/new-forest", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Much of the district is in the New Forest National Park, where the National Park Authority handles planning. Check before converting a home or outbuilding. The national planning data register lists 10 Article 4 directions for New Forest District Council and 26 for the National Park Authority. They cover things like gates and fences, building works, temporary uses and (since 2021 and 2023, across the National Park) temporary campsites, not holiday lets in houses. The National Park Authority's draft Local Plan (Regulation 19, August 2026) proposes that all net new open-market homes in the Park carry a principal residence condition so they cannot be second homes. It is not yet adopted and would not apply to existing homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=229", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=401", "https://www.newforestnpa.gov.uk/wp-content/uploads/2026/08/Regulation-19-Submission-draft-New-Forest-National-Park-Local-Plan-August-2026.pdf"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council agreed in principle on 12 Dec 2022 and, on 26 Feb 2024, approved the formal determination to charge a 100% premium on furnished homes that are nobody's permanent residence from 1 Apr 2025, so second homes pay 200%. The 2026/27 council tax base (Cabinet 3 Dec 2025) still includes it, for about 1,210 homes. Most of the extra money goes to Hampshire County Council (about 70%), with about 9% to the district council. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). A Dec 2024 review recommended no extra local exceptions, and the council's page says it has no discretion to reduce, delay or waive the premium beyond the listed exceptions. To claim the sale or letting exception, email counciltax@nfdc.gov.uk with the date first advertised, the agent and online listing link, evidence the price or rent is a fair market value, the energy performance certificate and any other steps you are taking. Empty and unfurnished homes: since 1 Apr 2025 the premium starts after 1 year (it was 2 years before): 100% after 1 year, 200% after 5 years and 300% after 10 years. Empty-home exceptions include major repairs or structural alterations (up to 12 months; send dates, details of the works and photos). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.newforest.gov.uk/article/3500/Council-Tax-premium-for-properties-that-are-unoccupied-and-furnished", "https://www.newforest.gov.uk/article/3915/Council-Tax-premium-for-properties-that-are-unoccupied-and-unfurnished", "https://democracy.newforest.gov.uk/documents/g7810/Public%20minutes%2026th-Feb-2024%2018.30%20Council.pdf?T=11", "https://democracy.newforest.gov.uk/documents/s35057/Report%20and%20Appendices%20-%20Setting%20the%20Tax%20Base.pdf", "https://democracy.newforest.gov.uk/ieDecisionDetails.aspx?Id=1250", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "West Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/west-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the borough is in Dartmoor National Park. Check before converting a home or outbuilding. The national planning data register has no Article 4 directions published for West Devon Borough Council or Dartmoor National Park Authority (checked 26 Oct 2026). Outside the National Park, the Plymouth and South West Devon Joint Local Plan (adopted by West Devon on 26 Mar 2019, five-year review 2024) has no principal residence or holiday-let policy. Dartmoor National Park Authority handles planning inside the National Park. Its Local Plan (adopted December 2021, Policy 5.5) only allows new short-stay holiday accommodation in villages, hamlets and open countryside through conversion of suitable buildings close to tourist services, and puts conditions on new holiday lets so they are used for holidays only (not as anyone's main home) and the owner keeps a register of guests' names and home addresses. The Dartmoor plan chose not to require principal residence conditions on new homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.westdevon.gov.uk/your-council/council-plans-policies-and-reports/policies/planning-policies/plymouth-and-south-west", "https://www.dartmoor.gov.uk/__data/assets/pdf_file/0034/193759/Dartmoor-Local-Plan-20182036.pdf.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=359", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=400"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 20 Feb 2024 the council resolved to charge a 100% premium on furnished homes that are nobody's sole or main residence from 1 Apr 2025, so second homes pay 200%. Public notice was given on 2 Mar 2024, and the premium is added to the bill automatically. The council's exceptions page (checked 26 Oct 2026) refers to exceptions for the 2026/27 financial year, so the premium is still charged. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). West Devon also has local discretionary exceptions, reviewed every year: homes with an agricultural occupancy condition; homes with an over-55s age restriction that are on the market (an extra 6 months on top of the 12-month sale or letting exception); homes only reachable through business premises; and, for second homes only, overnight staff accommodation for a retail, hospitality or leisure business, homes used to care for a close relative, charity accommodation and homes required by an employment contract. Apply with the council's online second home exception form; for the sale or letting exception send a copy of your estate or letting agent contract and a valid energy performance certificate (EPC). Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), even if the owner changes. Homes needing major work to be habitable can get a 50% discount for up to 12 months. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.westdevon.gov.uk/council-tax/empty-properties-and-second-homes", "https://www.westdevon.gov.uk/council-tax/exceptions-council-tax-premiums", "https://www.westdevon.gov.uk/news/2024/borough-council-offers-financial-support-package", "https://www.westdevon.gov.uk/council-tax/reductions-discounts-and-exemptions/empty-homes-council-tax-reduction", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Teignbridge", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/teignbridge", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Dartmoor National Park. Check before converting a home or outbuilding. The national planning data register has no Article 4 directions published for Teignbridge District Council or Dartmoor National Park Authority (checked 26 Oct 2026). Outside the National Park, the Teignbridge Local Plan 2020-2040 (adopted by Full Council on 19 May 2026) requires all new-build homes in Bishopsteignton, Dawlish, Shaldon, Stokeinteignhead and Teignmouth to be occupied as a primary residence, secured by a legally enforceable mechanism such as a planning condition, so they cannot be used as second homes or short-term holiday lets. It does not apply to existing homes. The plan says there are over 1,600 known second homes and self-catering units in Teignbridge. Dartmoor National Park Authority handles planning inside the National Park. Its Local Plan (adopted December 2021, Policy 5.5) only allows new short-stay holiday accommodation in villages, hamlets and open countryside through conversion of suitable buildings close to tourist services, and puts conditions on new holiday lets so they are used for holidays only (not as anyone's main home) and the owner keeps a register of guests' names and home addresses. The Dartmoor plan chose not to require principal residence conditions on new homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.teignbridge.gov.uk/media/zuvl4sho/teignbridge-local-plan-2020-2040-low-res-2.pdf", "https://democracy.teignbridge.gov.uk/ieIssueDetails.aspx?IId=16628&Opt=3", "https://www.dartmoor.gov.uk/__data/assets/pdf_file/0034/193759/Dartmoor-Local-Plan-20182036.pdf.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=336", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=400"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 27 Feb 2024 Full Council unanimously resolved to charge a 100% premium on homes that are unoccupied but substantially furnished from 1 Apr 2025, so second homes (including homes with a planning restriction on occupation, unless an exception applies) pay 200%. The council's page (updated 6 Oct 2026) still says the premium applies, and a Sep 2026 scrutiny review found premiums were charged on about 81.7% of the 891 furnished empty homes at 30 Jun 2026, with more charged after 1 Apr 2026 as 12-month exceptions ran out. The council said it will bring a report to Full Council to review and reaffirm the decision. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Teignbridge has no extra local exceptions. Apply for an exception online with your council tax reference; to show a home is someone's main home the council may ask for utility bills, driving licence, vehicle or home insurance documents. If you struggle to pay, you can ask for a discretionary reduction (section 13A) or a payment arrangement. Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). The 50% discount for homes needing major repairs ended on 31 Mar 2026, but the national major-works exception (Class M, up to 12 months) still stops the premium. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.teignbridge.gov.uk/council-tax/reduce-your-council-tax/council-tax-discounts/empty-property-premiums/", "https://www.teignbridge.gov.uk/council-tax/reduce-your-council-tax/council-tax-discounts/exceptions-to-empty-or-second-home-premiums/", "https://democracy.teignbridge.gov.uk/ieIssueDetails.aspx?IId=14121&Opt=3", "https://democracy.teignbridge.gov.uk/documents/s25958/Review%20of%20Council%20Tax%20premiums%20and%20discount%20changes%20for%20ONS%2015.9.26.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}]},T=true,N=document.getElementById('ck-n'),Cs=document.getElementById('ck-c'),O=document.getElementById('ck-out');
