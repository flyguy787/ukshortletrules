s, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief. The same review said 16 homes that would have paid the premium moved to business rates in the past year, and that the Valuation Office Agency asks for significant evidence of lettings first.", ["https://www.torbay.gov.uk/council-tax/reducing-your-bill/second-home/", "https://www.torbay.gov.uk/DemocraticServices/documents/b49548/Item+11+Council+Tax+Base+202526+Thursday+05-Dec-2024+17.30+Council.pdf?T=9", "https://www.torbay.gov.uk/council-tax/reducing-your-bill/prescribed/", "https://www.torbay.gov.uk/DemocraticServices/documents/s170335/Review%20of%20Council%20Tax%20Premiums%20for%20Long%20Term%20Empty%20and%20Second%20Homes.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Brighton & Hove", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/brighton-and-hove", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). The council says you might need planning permission to use part of your home or a whole property as a short-term holiday let, depending on how much the use changes, and asks you to check with its planning applications team (01273 292222, planning.applications@brighton-hove.gov.uk). The city-wide Article 4 direction covers changing a house into a small HMO, not short lets. A council task and finish group on short lets reported in 2025; a March 2026 update says ideas such as zones where short lets are allowed or restricted are being looked at for City Plan 2041, with a visitor accommodation study commissioned. Nothing new applies yet.", ["https://www.brighton-hove.gov.uk/planning/planning-policy/short-term-holiday-lets", "https://www.brighton-hove.gov.uk/planning/planning-applications/planning-permission-houses-multiple-occupation", "https://democracy.brighton-hove.gov.uk/documents/s213803/Update%20on%20Short%20Term%20Lets%20report%20recommendations.pdf"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 1 Feb 2024 Full Council approved a 100% premium on empty furnished homes (second homes) from 1 Apr 2025, so a second home or furnished let with nobody living there pays 200%, from the day it becomes empty. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If you think an exception applies, send evidence to the council tax team. Serviced accommodation: since 1 Apr 2026, serviced accommodation (furnished homes let for short to medium stays with hotel-like services) is an exception to the premium. Budget Council approved this on 26 Feb 2026 as part of the 2026/27 budget (recommendation 2.8, carried 33 to 13 with 1 abstention, official minutes, checked 28 Oct 2026). Ask the council tax team whether your let counts as serviced accommodation. Empty and unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (over 10 years). The council no longer gives discounts for homes that are uninhabitable or undergoing work. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.brighton-hove.gov.uk/council-tax/council-tax-information/council-tax-empty-properties", "https://democracy.brighton-hove.gov.uk/mgAi.aspx?ID=99158", "https://democracy.brighton-hove.gov.uk/documents/s212886/Appendix%208%20-%20Second%20Homes%20Premium%20Serviced%20Accommodation%20Exception.pdf", "https://democracy.brighton-hove.gov.uk/documents/s214038/Minutes%2026.02.2026%20Budget.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Bath and North East Somerset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/bath-and-north-east-somerset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). The council's Article 4 directions cover things like turning offices into homes in Bath, demolishing walls, estate agents' boards, houses in multiple occupation (HMOs) in Bath and some protected land, not holiday-let use. The national planning data register has no Article 4 data published for the council. A 2018 council scrutiny report on short-term lets said London's 90-night rule has no effect in Bath & North East Somerset, and that most short lets in Bath (3 or fewer rooms) stay in the C3 dwellinghouse use class, so are not a material change of use; larger ones can be, depending on the facts. Much of Bath is a World Heritage Site and conservation area, so check before altering a building.", ["https://www.bathnes.gov.uk/policy-and-documents-library/article-4-directions", "https://democracy.bathnes.gov.uk/documents/s52473/Short%20Term%20Lets.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=38"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet. Bath & North East Somerset is part of the West of England Combined Authority, whose Mayor will get this power. On 10 Sep 2026 the Combined Authority said people and businesses will be able to have their say in the coming months before plans are finalised. No rate or start date has been set.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.westofengland-ca.gov.uk/news/visitor-levy-moves-step-closer-for-west/"]], ["Fees and council tax", "No short-let fees. Council tax: on 30 Nov 2023 Full Council unanimously resolved (minute 56) to increase council tax on all second homes by 100% from 1 Apr 2025, so a furnished home that is nobody's main home pays 200%. The council's page (checked 26 Oct 2026) says it still charges the premium and that it shows on your annual bill. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council adds that the 12-month sale or letting exception runs from the date the home was first advertised, can be used only once, and cannot apply if the home was first put on the market before 1 Apr 2024. Claim an exception online with the council's second home premium exception claim form; if the home is actually someone's main home, tell the council about a change of circumstances. The council may ask for evidence and a visiting officer may check. Empty and unfurnished homes: at the same meeting the council agreed to charge the empty homes premium after 1 year from 1 Apr 2024 (minute 55). Rates are 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and they continue when the home changes owner. Empty-home exceptions include major repairs or structural work (Class M, up to 12 months). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.bathnes.gov.uk/second-homes-and-periodically-occupied-properties", "https://democracy.bathnes.gov.uk/documents/g6221/Public%20minutes%2030th-Nov2023%2018.30%20Council.pdf?T=11", "https://www.bathnes.gov.uk/form/second-home-premium-exception", "https://www.bathnes.gov.uk/emptyproperties", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "New Forest", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/new-forest", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Much of the district is in the New Forest National Park, where the National Park Authority handles planning. Check before converting a home or outbuilding. The national planning data register lists 10 Article 4 directions for New Forest District Council and 26 for the National Park Authority. They cover things like gates and fences, building works, temporary uses and (since 2021 and 2023, across the National Park) temporary campsites, not holiday lets in houses. The National Park Authority's draft Local Plan (Regulation 19, August 2026) proposes that all net new open-market homes in the Park carry a principal residence condition so they cannot be second homes. It is not yet adopted and would not apply to existing homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=229", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=401", "https://www.newforestnpa.gov.uk/wp-content/uploads/2026/08/Regulation-19-Submission-draft-New-Forest-National-Park-Local-Plan-August-2026.pdf"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council agreed in principle on 12 Dec 2022 and, on 26 Feb 2024, approved the formal determination to charge a 100% premium on furnished homes that are nobody's permanent residence from 1 Apr 2025, so second homes pay 200%. The 2026/27 council tax base (Cabinet 3 Dec 2025) still includes it, for about 1,210 homes. Most of the extra money goes to Hampshire County Council (about 70%), with about 9% to the district council. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). A Dec 2024 review recommended no extra local exceptions, and the council's page says it has no discretion to reduce, delay or waive the premium beyond the listed exceptions. To claim the sale or letting exception, email counciltax@nfdc.gov.uk with the date first advertised, the agent and online listing link, evidence the price or rent is a fair market value, the energy performance certificate and any other steps you are taking. Empty and unfurnished homes: since 1 Apr 2025 the premium starts after 1 year (it was 2 years before): 100% after 1 year, 200% after 5 years and 300% after 10 years. Empty-home exceptions include major repairs or structural alterations (up to 12 months; send dates, details of the works and photos). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.newforest.gov.uk/article/3500/Council-Tax-premium-for-properties-that-are-unoccupied-and-furnished", "https://www.newforest.gov.uk/article/3915/Council-Tax-premium-for-properties-that-are-unoccupied-and-unfurnished", "https://democracy.newforest.gov.uk/documents/g7810/Public%20minutes%2026th-Feb-2024%2018.30%20Council.pdf?T=11", "https://democracy.newforest.gov.uk/documents/s35057/Report%20and%20Appendices%20-%20Setting%20the%20Tax%20Base.pdf", "https://democracy.newforest.gov.uk/ieDecisionDetails.aspx?Id=1250", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "West Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/west-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the borough is in Dartmoor National Park. Check before converting a home or outbuilding. The national planning data register has no Article 4 directions published for West Devon Borough Council or Dartmoor National Park Authority (checked 26 Oct 2026). Outside the National Park, the Plymouth and South West Devon Joint Local Plan (adopted by West Devon on 26 Mar 2019, five-year review 2024) has no principal residence or holiday-let policy. Dartmoor National Park Authority handles planning inside the National Park. Its Local Plan (adopted December 2021, Policy 5.5) only allows new short-stay holiday accommodation in villages, hamlets and open countryside through conversion of suitable buildings close to tourist services, and puts conditions on new holiday lets so they are used for holidays only (not as anyone's main home) and the owner keeps a register of guests' names and home addresses. The Dartmoor plan chose not to require principal residence conditions on new homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.westdevon.gov.uk/your-council/council-plans-policies-and-reports/policies/planning-policies/plymouth-and-south-west", "https://www.dartmoor.gov.uk/__data/assets/pdf_file/0034/193759/Dartmoor-Local-Plan-20182036.pdf.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=359", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=400"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 20 Feb 2024 the council resolved to charge a 100% premium on furnished homes that are nobody's sole or main residence from 1 Apr 2025, so second homes pay 200%. Public notice was given on 2 Mar 2024, and the premium is added to the bill automatically. The council's exceptions page (checked 26 Oct 2026) refers to exceptions for the 2026/27 financial year, so the premium is still charged. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). West Devon also has local discretionary exceptions, reviewed every year: homes with an agricultural occupancy condition; homes with an over-55s age restriction that are on the market (an extra 6 months on top of the 12-month sale or letting exception); homes only reachable through business premises; and, for second homes only, overnight staff accommodation for a retail, hospitality or leisure business, homes used to care for a close relative, charity accommodation and homes required by an employment contract. Apply with the council's online second home exception form; for the sale or letting exception send a copy of your estate or letting agent contract and a valid energy performance certificate (EPC). Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), even if the owner changes. Homes needing major work to be habitable can get a 50% discount for up to 12 months. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.westdevon.gov.uk/council-tax/empty-properties-and-second-homes", "https://www.westdevon.gov.uk/council-tax/exceptions-council-tax-premiums", "https://www.westdevon.gov.uk/news/2024/borough-council-offers-financial-support-package", "https://www.westdevon.gov.uk/council-tax/reductions-discounts-and-exemptions/empty-homes-council-tax-reduction", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Teignbridge", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/teignbridge", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Dartmoor National Park. Check before converting a home or outbuilding. The national planning data register has no Article 4 directions published for Teignbridge District Council or Dartmoor National Park Authority (checked 26 Oct 2026). Outside the National Park, the Teignbridge Local Plan 2020-2040 (adopted by Full Council on 19 May 2026) requires all new-build homes in Bishopsteignton, Dawlish, Shaldon, Stokeinteignhead and Teignmouth to be occupied as a primary residence, secured by a legally enforceable mechanism such as a planning condition, so they cannot be used as second homes or short-term holiday lets. It does not apply to existing homes. The plan says there are over 1,600 known second homes and self-catering units in Teignbridge. Dartmoor National Park Authority handles planning inside the National Park. Its Local Plan (adopted December 2021, Policy 5.5) only allows new short-stay holiday accommodation in villages, hamlets and open countryside through conversion of suitable buildings close to tourist services, and puts conditions on new holiday lets so they are used for holidays only (not as anyone's main home) and the owner keeps a register of guests' names and home addresses. The Dartmoor plan chose not to require principal residence conditions on new homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.teignbridge.gov.uk/media/zuvl4sho/teignbridge-local-plan-2020-2040-low-res-2.pdf", "https://democracy.teignbridge.gov.uk/ieIssueDetails.aspx?IId=16628&Opt=3", "https://www.dartmoor.gov.uk/__data/assets/pdf_file/0034/193759/Dartmoor-Local-Plan-20182036.pdf.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=336", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=400"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 27 Feb 2024 Full Council unanimously resolved to charge a 100% premium on homes that are unoccupied but substantially furnished from 1 Apr 2025, so second homes (including homes with a planning restriction on occupation, unless an exception applies) pay 200%. The council's page (updated 6 Oct 2026) still says the premium applies, and a Sep 2026 scrutiny review found premiums were charged on about 81.7% of the 891 furnished empty homes at 30 Jun 2026, with more charged after 1 Apr 2026 as 12-month exceptions ran out. The council said it will bring a report to Full Council to review and reaffirm the decision. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Teignbridge has no extra local exceptions. Apply for an exception online with your council tax reference; to show a home is someone's main home the council may ask for utility bills, driving licence, vehicle or home insurance documents. If you struggle to pay, you can ask for a discretionary reduction (section 13A) or a payment arrangement. Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). The 50% discount for homes needing major repairs ended on 31 Mar 2026, but the national major-works exception (Class M, up to 12 months) still stops the premium. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.teignbridge.gov.uk/council-tax/reduce-your-council-tax/council-tax-discounts/empty-property-premiums/", "https://www.teignbridge.gov.uk/council-tax/reduce-your-council-tax/council-tax-discounts/exceptions-to-empty-or-second-home-premiums/", "https://democracy.teignbridge.gov.uk/ieIssueDetails.aspx?IId=14121&Opt=3", "https://democracy.teignbridge.gov.uk/documents/s25958/Review%20of%20Council%20Tax%20premiums%20and%20discount%20changes%20for%20ONS%2015.9.26.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "City of York", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/city-of-york", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety. City of York Council publishes guidance for owners of holiday lets covering planning, safety, business rates and council tax, managing guests (parking and noise), and waste. For tailored advice contact its Public Protection team (01904 551525, public.protection@york.gov.uk).", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets", "https://www.york.gov.uk/business-rates/guidance-owners-holiday-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). York's Article 4 directions cover East Mount Road, Heslington, houses in multiple occupation (HMOs), the Punch Bowl pub and 79 Fulford Road, not holiday-let use. The council says you may need planning permission to use a property as a holiday let and should get planning advice before taking any bookings; if you need permission and do not have it, it may take enforcement action and ask you to stop letting. New draft planning guidance on short-term holiday lets (dated June 2026) went to the council's Planning Policy and Local Plan Advisory Group on 13 Oct 2026; it still needs approval at an Executive Member Decision Session before it is published, so it is not yet in force. The draft says the council will decide case by case whether a holiday let is a material change of use; that new or converted outbuildings (garages, sheds, pods, extensions) used as short lets will normally need planning permission; and that it will look at guest turnover, noise, late-night activity, use of gardens and balconies, parking and bin storage. It warns that a management plan will not on its own overcome concerns about noise or disturbance. It does not add new policy: it applies the York Local Plan (adopted February 2025) and lessons from appeal decisions.", ["https://www.york.gov.uk/business-rates/guidance-owners-holiday-lets/2", "https://www.york.gov.uk/planning-advice-guidance/article-4-directions-york", "https://democracy.york.gov.uk/documents/s195913/04c%20Annex%20C%20Short-term%20Holiday%20Lets%20Draft%20Planning%20Guidance%20June%202026.pdf", "https://democracy.york.gov.uk/documents/s195910/04%20PPLPAG%20Report%20Non%20statutory%20guidance.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=395"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet. York and North Yorkshire are covered by the York and North Yorkshire Combined Authority, which has an elected mayor, so any levy here would be set for the whole area, not council by council. An independent report by York St John University, presented to the Combined Authority's Overview and Scrutiny Committee on 16 Jun 2026, estimated that £1 to £2 a night could raise about £26m to £52m a year, said the earliest start was likely 2027-28 and recommended a feasibility study and talks with accommodation providers before any decision. The full report (Sep 2026) preferred a flat £1 a night to a percentage, with possible exemptions for low-cost stays, and on 6 Oct 2026 the mayor said he would not bring in a levy unless it also covered Airbnb-style lets and holiday lets (both as reported by BBC News). No decision has been made and no scheme has been consulted on (searched 26 Oct 2026).", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://yorknorthyorks-ca.moderngov.co.uk/documents/b541/Item%208%20-%20Visitor%20Levy%20Policy%20Report%20-%20Executive%20Summary%2016th-Jun-2026%2010.30%20Overview%20and%20Scrutiny%20.pdf?T=9", "https://www.bbc.co.uk/news/articles/cn9w1p542g5o", "https://www.bbc.co.uk/news/articles/cq9vzngkxw29o"]], ["Fees and council tax", "No short-let fees. Council tax: after a council motion in Dec 2022, Full Council approved on 22 Feb 2024 (on the Executive's recommendation) a 100% increase in council tax on second homes from 1 Apr 2025. The council's page says that since then a home that is furnished but nobody's main home pays double council tax. It says the premium does not apply to homes with an occupancy restriction that stops them being lived in at certain times of year, long-term furnished lets to a tenant as their main home, caravan pitches and boat moorings, or where you must live elsewhere for your job. For a time-limited period it also does not apply where probate has been granted (a year), you live in armed forces accommodation, the home is actively marketed for sale or to let (a year from first marketing), or an annex is used as part of the main home. Send proof to secondhomes@york.gov.uk (or call 01904 551558). Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): 100% (more than 1 year), 200% (more than 5 years) and 300% (more than 10 years), counting time empty under previous owners. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.york.gov.uk/council-tax/second-homes-additional-premium", "https://democracy.york.gov.uk/documents/s174710/Minutes%20Public%20Pack%2022022024%20Council.pdf", "https://www.york.gov.uk/council-tax-discounts/property-discounts-exemptions", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Derbyshire Dales", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/derbyshire-dales", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in the Peak District National Park, where the National Park Authority handles planning. Check before converting a home or outbuilding. The national planning data register lists no Article 4 directions for Derbyshire Dales District Council, and 26 for the Peak District National Park Authority on individual sites (farms, quarries, land uses and building works), none on holiday lets in houses (checked 26 Oct 2026). Inside the National Park, Development Management Policy DMR3 (adopted May 2019) says that outside the settlements named in its Core Strategy, new self-catering accommodation, where acceptable, is restricted to holiday use; the Authority's planning reports describe this as holiday accommodation for no more than 28 days a year by any one person. Inside those settlements, a holiday occupancy condition is only used where a converted building has too little living space or is too close to neighbours to be a permanent home. The Authority's draft Local Plan (Preferred Approach, September 2025) proposes a primary residence clause on all new housing, including holiday accommodation converted to housing, citing AirDNA figures of 7,035 short-let listings in the Peak District area in August 2025. It is not adopted and would not apply to existing homes.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://democracy.peakdistrict.gov.uk/mgAi.aspx?ID=10805", "https://democracy.peakdistrict.gov.uk/documents/s48183/0522-0598_Hartington%20Cottages%20FJ.pdf", "https://democracy.peakdistrict.gov.uk/documents/s61882/Appendix%201%20-%20Local%20Plan%20Preferred%20Approach%20FINAL%2016%20Sept%202025.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=106", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=405"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council announced on 4 Mar 2024 that it had approved a 100% second homes premium from 1 Apr 2025, and its annual budget meeting on 3 Mar 2025 unanimously confirmed it, so a furnished home that is nobody's main home pays double council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Derbyshire Dales adds local exceptions from 1 Apr 2025: armed forces members whose main home near their work is not provided by their employer, and age-restricted homes being actively marketed for sale or rent (up to a further 12 months after the national exception ends). From 1 Apr 2026, rural huts in council tax band A with no water or energy supply and no waste collection are also excepted. The premium ends if the home becomes your main home, is sold, or is let to someone as their main home; tell the revenues team (01629 818222), which may arrange a visit. Empty and unfurnished homes pay a premium after 2 years: 100% (2 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and the 2-year period does not restart when the owner changes. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.derbyshiredales.gov.uk/council-tax/council-tax-premiums", "https://www.derbyshiredales.gov.uk/your-council/news-and-social-media/latest-news/100-council-tax-premium-on-second-homes", "https://www.derbyshiredales.gov.uk/your-council/news-and-social-media/latest-news/our-share-of-council-tax-to-rise-by-2-99-per-cent", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Bournemouth, Christchurch and Poole", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/bournemouth-christchurch-and-poole", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety. On 12 May 2026 Full Council unanimously backed a motion on short-term lets (minute 111): the council will look at how environmental health, planning enforcement, anti-social behaviour and licensing powers can tackle nuisance from short lets, map short-term lets, promote reporting routes for residents, start preparing for the national register, and ask to join any government pilot on regulating short lets. None of this creates a local licence or registration scheme yet.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets", "https://democracy.bcpcouncil.gov.uk/documents/s67987/Minutes%2024032026%20Council.pdf"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets (searched 26 Oct 2026). BCP's Article 4 directions on houses in multiple occupation (all of the Bournemouth area since December 2011, and Talbot Village in Poole since 1 May 2013) cover changing a house into a small HMO, not holiday lets, and the national planning data register lists none for the council. Whether letting a whole home is a material change of use is decided case by case. The motion Full Council passed on 12 May 2026 asks officers to investigate whether homes let for more than 90 nights a year are a material change of use, to gather evidence that could support an Article 4 direction in future, and to use the new Local Plan to set policies on short-term lets. Nothing has been decided: the new BCP Local Plan is at an early stage (the council's timetable shows consultation on a proposed plan from September 2027 and indicative adoption in April 2029). In the Bournemouth area, the Tourist Accommodation Supplementary Planning Document (adopted April 2016 by the former Bournemouth Borough Council) aims to keep existing tourist accommodation and says new self-catering or serviced holiday flats are acceptable where the holiday use is secured by condition or legal agreement. Check with the planning team before converting a home or outbuilding.", ["https://www.bcpcouncil.gov.uk/planning-and-building-control/planning-policy/houses-in-multiple-occupation", "https://democracy.bcpcouncil.gov.uk/documents/s67987/Minutes%2024032026%20Council.pdf", "https://www.bcpcouncil.gov.uk/planning-and-building-control/planning-policy/bcp-local-plan/local-plan-timetable", "https://www.bcpcouncil.gov.uk/documents/planning-and-building-control/tourist-accommodation-spd.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=54", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet. In Bournemouth, Christchurch and Poole, larger hotels in a proposed Accommodation Business Improvement District voted for a charge of £2 per room per night (ballot result published by the council on 14 May 2024), but the government declared the ballot void in January 2025 after some eligible businesses did not get ballot papers, so no charge is collected (as reported by the Bournemouth Echo). It would not have applied to typical holiday lets anyway. In December 2025 the council said BCP is not in a strategic mayoral authority area and asked the government to let areas like it use the new overnight visitor levy; in June 2026 the government said it had consulted on this and would respond in due course (as reported by BBC News).", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.bcpcouncil.gov.uk/news-hub/news-articles/accommodation-business-improvement-district-abid-results", "https://www.bournemouthecho.co.uk/news/24865105.hoteliers-tourist-tax-ballot-declared-void/", "https://www.bcpcouncil.gov.uk/news-hub/news-articles/councillors-call-for-government-to-allow-visitor-levy-in-bcp", "https://www.bbc.co.uk/news/articles/cvgz2k9n5neo"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council on 9 Jan 2024 (59 votes to 3, with 3 abstentions) approved the formal determination, following its decision on 12 Jul 2022 to charge a second homes premium. The council's page says the premium was introduced from 1 Apr 2025, so a furnished home that is nobody's main home pays 200% council tax. There is no discount for a furnished home that is not your main home or is between lets, unless it is needed for your job. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). BCP's operational guidance lists only these national exceptions, with no extra local ones. You must send evidence, for example listings on sales or letting websites with the date marketing started; the marketing exception applies only once per taxpayer, and the council expects to be told of changes within 21 days. In cases of exceptional hardship you can apply for a discretionary reduction (section 13A). Empty and unfurnished homes pay a premium after 1 year (since 1 Apr 2024): the bill is 200% after 1 year, 300% after 5 years and 400% after 10 years. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief. The Valuation Office Agency, not the council, decides whether a let moves to business rates.", ["https://www.bcpcouncil.gov.uk/council-tax/council-tax-explained/council-tax-charges-for-unoccupied-but-furnished-or-unfurnished-properties", "https://www.bcpcouncil.gov.uk/Assets/Council-Tax/Council-Tax-empty-homes-and-second-homes-premium.pdf", "https://democracy.bcpcouncil.gov.uk/documents/g5385/Printed%20minutes%2009th-Jan-2024%2019.00%20Council.pdf?T=1", "https://democracy.bcpcouncil.gov.uk/documents/s46564/Appendix%20B%20Determination.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Isles of Scilly", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/isles-of-scilly", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday-let use (searched 26 Oct 2026). The national planning data register lists four Article 4 directions for the Council of the Isles of Scilly (1975, 1988, 1995 and 1998); they remove permitted development rights for house extensions and alterations, temporary uses of land, agricultural works, swimming pools, temporary buildings, and roof, window, door and painting changes in the Conservation Area, so many works to a holiday let need planning permission even where they would not elsewhere. The whole of the islands is a Conservation Area and a National Landscape (AONB). The Isles of Scilly Local Plan 2015-2030 (adopted 25 Mar 2021) is strict on holiday lets: Policy WC5 says converting a property for tourism must not lose homes that would otherwise be available for permanent occupation unless there are wider public benefits, and an informal bed and breakfast or extra holiday letting accommodation within the curtilage of a home will not be permitted unless a certificate of lawful use as a C1 guesthouse has been obtained; Policy LC8 says a replacement dwelling, extension or alteration must not include any self-contained holiday letting accommodation unless this is already lawful; Policy LC1 says any open-market homes allowed to fund affordable housing will be conditioned as principal residence homes; and Policy LC2 says all new affordable homes must be occupied as the principal residence of someone with a local housing need. The council has used section 106 agreements to restrict who can occupy new homes since at least the 1990s, so check the title of any property for an occupancy restriction. A Local Plan review is under way (timetable approved by Full Council on 26 Feb 2026). Talk to the planning team (planning@scilly.gov.uk) before letting or converting a property.", ["https://scilly.gov.uk/planning/planning-policy/local-plan-2015-2030", "https://scilly.gov.uk/sites/default/files/planning-apps/Adopted%20Local%20Plan%202015-2030%20Building%20a%20Strong%20Working%20Community.pdf", "https://scilly.gov.uk/sites/default/files/planning-apps/Adopted%20Local%20Plan%202015-2030%20Building%20a%20Strong%20Living%20Community_2.pdf", "https://scilly.gov.uk/planning/planning-policy/local-plan-2015-2030/specific-local-need", "https://scilly.gov.uk/planning/planning-policy/local-plan-2015-2030/local-plan-review-timetable-lds", "https://scilly.gov.uk/planning-development/do-i-need-planning-permission", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=178"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 22 Feb 2024 Full Council approved a budget that included bringing in premiums for empty homes and second homes, and the council's Empty Homes and Second Homes Premium Policy 2026-27 confirms a 100% premium on second homes from 1 Apr 2025, so a furnished home that is nobody's main home pays double council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council adds a local exception for staff accommodation: no premium where a local employer owns or rents the home for its staff, or where someone employed by an island business rents it and keeps their main home elsewhere in the UK. Second homes of people who must live elsewhere for their job may get a 50% discount. To claim an exception contact revenues@scilly.gov.uk or 0300 1234 105 (option 1) with evidence; hardship linked to a protected characteristic can be considered for a discretionary reduction (section 13A), and appeals go to the Valuation Tribunal. Empty and unfurnished homes pay a 100% premium after 12 months (from 1 Apr 2025), and may get a 50% discount for up to six months first. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://scilly.gov.uk/council-democracy/council-finances/council-tax", "https://scilly.gov.uk/sites/default/files/document/council/IoS%20Empty%20Homes%20and%20Second%20Homes%20Premium%20Policy%202026.pdf", "https://www.scilly.gov.uk/news/council-approves-balanced-budget-2024-25", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Canterbury", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/canterbury", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 2 Nov 2026). Canterbury's Article 4 direction covers changing a house into a small HMO (3 to 6 unrelated sharers) in mapped areas, not holiday lets, and the national planning data register lists no Article 4 directions for the council. Whether letting a whole home as a holiday let is a material change of use is decided case by case, so check with the planning team first. Proposed, not in force: the draft Canterbury District Local Plan (Regulation 19 version, March 2026) includes Policy DS10, which says a change of use from a home to a short-term holiday let will be supported only where there is no unacceptable harm to neighbours' living conditions, parking would not exceed what the street can take, bins and shared facilities are workable, and it would not lead to an overconcentration of short-term holiday lets in the area. The draft also says the council will use planning conditions to keep new self-catering and bed and breakfast accommodation in the countryside in holiday use. The draft plan still has to go through independent examination before it can be adopted, and we have not confirmed whether it has been submitted yet.", ["https://www.canterbury.gov.uk/housing/houses-multiple-occupation-hmo/change-use-property-hmo", "https://haveyoursay.canterbury.gov.uk/43579/widgets/147107/documents/103308", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=75", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council first approved a second homes premium on 4 Jan 2024 to start on 1 Apr 2025 (public notice of 13 Feb 2025). Since 1 Apr 2025 a 100% premium applies to a furnished home with no resident, so it pays 200% council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Canterbury's pages list these national exceptions, with no extra local ones, and ask owners to tell the council if a home is now a main home, unfurnished, or meets an exception. Empty and unfurnished homes (decided 9 Jan 2025, from 1 Apr 2025): a 100% premium after 1 year, 200% after 5 years and 300% after 10 years; a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.canterbury.gov.uk/council-tax/furnished-second-homes-review", "https://www.canterbury.gov.uk/council-tax/paying-your-council-tax/your-2025-council-tax-bill-explained", "https://www.canterbury.gov.uk/sites/default/files/2025-02/Public%20notice%20about%20empty%20property%20premium%20and%20second%20homes.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Thanet", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/thanet", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 2 Nov 2026). Thanet's published Article 4 directions cover listed properties in the Ramsgate, Ramsgate Marina extension and Pegwell conservation areas (porches, windows, doors, painting and similar small changes), and the national planning data register lists none for the council. Whether letting a whole home as a holiday let needs permission is decided case by case. In October 2021 Full Council chose not to debate a motion on the growth of holiday rental properties, saying it wanted to gather accurate data first; no holiday-let policy has followed. The Thanet Local Plan was adopted on 9 Jul 2020. Work on a new Local Plan has started: a scoping consultation ran from 24 Aug to 9 Oct 2026, so any new holiday-let policy is still years away.", ["https://www.thanet.gov.uk/info-pages/conservation-area/", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=341", "https://www.thanet.gov.uk/response-to-motion-on-holiday-rental-properties/", "https://www.thanet.gov.uk/info-pages/local-plan-updates/", "https://www.thanet.gov.uk/info-pages/consultation-on-new-local-plan/", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council decided on 11 Jan 2024 to charge a 100% second homes premium from 1 Apr 2025, and Full Council has approved continuing it for 2026/27. A furnished home that is nobody's main home pays 200% council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Thanet's own guidance notes the 12-month exception for homes marketed to let excludes holiday let accommodation. Empty and unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.thanet.gov.uk/info-pages/your-council-tax-bill-explained/", "https://democracy.thanet.gov.uk/documents/s96473/Annex%201%20-%20Council%20report%20Statutory%20Resolution%202026_27.pdf", "https://www.thanet.gov.uk/info-pages/secondhomereview/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Folkestone and Hythe", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/folkestone-and-hythe", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 2 Nov 2026). The council's only Article 4 directions are two for land at Longage Hill, Lyminge (No. 1 of 2023, confirmed 3 Jun 2024; No. 2 of 2023, confirmed 10 Dec 2024), made for visual amenity; the national planning data register lists none for the council. Whether letting a whole home as a holiday let is a material change of use is decided case by case, and the council says it will not answer queries on whether permission is needed, so use its guidance and interactive map or get pre-application advice. The adopted development plan is the Core Strategy Review (adopted 30 Mar 2022), the Places and Policies Local Plan (adopted 16 Sep 2020) and the St Mary in the Marsh Neighbourhood Plan (2019); none has a policy aimed at short-term letting of existing homes that we found.", ["https://www.folkestone-hythe.gov.uk/planning/article-4-directions-longage-hill", "https://www.folkestone-hythe.gov.uk/planning-application-process/planning-permission-required", "https://www.folkestone-hythe.gov.uk/planning-policy/adopted-development-plan", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=293", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 a 100% premium is added to the full council tax on a furnished home with no resident, so it pays 200%. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council lists these national exceptions and asks for evidence (contact revenues.benefits@folkestone-hythe.gov.uk); the premium ends if the home becomes someone's main home, and the council may visit to check. Empty and unfurnished homes get no discount and pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more); a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.folkestone-hythe.gov.uk/council-tax/second-home-premium", "https://www.folkestone-hythe.gov.uk/council-tax/empty-home-premium", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Rother", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/rother", "sec": [["Licensing or registration", "No licensing or compulsory local registration scheme. Rother has run a voluntary registration scheme for short-term holiday lets since 2019 (asking for gas and electrical safety certificates), but the council's June 2025 report says only eight properties had registered. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://rother.moderngov.co.uk/documents/s12981/Recommendations%20of%20the%20Airbnb%20Task%20and%20Finish%20Group.pdf", "https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 2 Nov 2026). The national planning data register lists 61 Article 4 directions for Rother, mostly site-specific (farmland and plots from the 1950s onwards), conservation-area directions for Rye (2007) and Winchelsea (2009), and an HMO direction for Bexhill (2011); none covers holiday lets. The council's June 2025 report says using a home as a holiday let or second home does not usually need planning permission, but buildings with permission for holiday use are usually conditioned so they cannot be lived in as a home. Proposed, not in force: the Rother Local Plan 2025-2042 Proposed Submission Version is out for formal consultation from 12 Oct to 24 Nov 2026. Its Policy HOU11 would make new homes allowed in the countryside under criterion (g) principal-residence only, so they could not become second homes or holiday lets, and the text supporting Policy ECO7 says that in Camber, Rye, Rye Foreign and Icklesham, proposals that lose homes to holiday accommodation are not supported (where planning permission is needed). The council plans to submit the plan for examination by the end of 2026, with examination expected in 2027.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=269", "https://rother.moderngov.co.uk/documents/s12981/Recommendations%20of%20the%20Airbnb%20Task%20and%20Finish%20Group.pdf", "https://www.rother.gov.uk/planning-and-building-control/planning-policy/emerging-local-plan/local-plan-review/", "https://rdcpublic.blob.core.windows.net/website-uploads/2026/10/COMBINED-Full-Regulation-19-Local-Plan-Part-1-Policies.pdf", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet. On 16 Jun 2025 Rother's Cabinet considered the Airbnb Task and Finish Group's report on Camber, Rye and Winchelsea and said it wants to research a tourist levy (using data from the national registration scheme once it exists), work with government on that scheme, and look at ring-fencing second homes premium income for the areas affected. No levy has been proposed.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.rother.gov.uk/news/highlights-from-cabinet-monday-16th-june/", "https://rother.moderngov.co.uk/documents/s12981/Recommendations%20of%20the%20Airbnb%20Task%20and%20Finish%20Group.pdf"]], ["Fees and council tax", "No short-let fees. Council tax: on 26 Feb 2024 the council approved a 100% second homes premium from 1 Apr 2025, payable on top of normal council tax on a furnished home that is nobody's sole or main home, so it pays 200%. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). To claim an exception email revenuesandbenefits@rother.gov.uk with evidence. Empty and unfurnished homes (agreed 26 Feb 2024, from 1 Apr 2024): a 100% premium after 1 year, 200% after 5 years and 300% after 10 years; a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.rother.gov.uk/council-tax/council-tax-second-homes/", "https://www.rother.gov.uk/council-tax/empty-properties/", "https://www.rother.gov.uk/strategies-policies-and-plans/income-protection-initiatives/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Chichester", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/chichester", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets that we found (checked 2 Nov 2026); the national planning data register lists no Article 4 directions for Chichester District Council, so use the council's own maps to check a property. Part of the district is in the South Downs National Park, where the National Park Authority handles planning. Whether letting a whole home as a holiday let is a material change of use is decided case by case. The Chichester Local Plan 2021-2039, adopted by Full Council on 19 Aug 2025 for the area outside the National Park, has no district-wide principal-residence or holiday-let policy that we found. In West Wittering parish, the West Wittering Neighbourhood Plan 2019-2029 (made 28 Nov 2023, after a referendum on 22 Nov 2023) Policy WW5 says new open-market homes, other than replacement dwellings, will only be supported with a planning condition or legal agreement limiting them to use as a principal residence, and new unrestricted second homes will not be supported. Check the title and planning history of any new-build in the parish.", ["https://www.chichester.gov.uk/article/40159/Council-adopts-new-Chichester-Local-Plan", "https://www.chichester.gov.uk/article/39977/West-Wittering-Neighbourhood-Plan", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=80", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council decided in March 2024 to charge a 100% premium from 1 Apr 2025 on all homes that are substantially furnished and not anyone's main home (second and holiday homes), so they pay 200% council tax; the 2026/27 bill guidance confirms the 100% rate. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council's exceptions page lists these 8 national classes, with no extra local ones; apply with evidence. You cannot appeal the premium rate, only whether your property is in the right class (to the council first, then the Valuation Tribunal). There is no discount for second homes or empty homes. Empty and unfurnished homes pay a premium after 1 year (from 1 Apr 2025): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.chichester.gov.uk/counciltaxsecondhomes", "https://www.chichester.gov.uk/article/39643/Apply-for-a-second-home-premium-exception", "https://www.chichester.gov.uk/yourcounciltaxbill", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "King's Lynn and West Norfolk", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/kings-lynn-and-west-norfolk", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 2 Nov 2026). The national planning data register lists 12 older Article 4 directions for the borough (1952 to 1997), on sites such as the coastal areas at Heacham and Snettisham, Holme next the Sea, Old Hunstanton and the King's Lynn and New Houghton conservation areas; none is about holiday lets. Whether letting a whole home as a holiday let is a material change of use is decided case by case. The King's Lynn and West Norfolk Local Plan 2021-2040 (adopted 27 Mar 2025) Policy LP09 says new holiday accommodation permitted in the open countryside will get occupancy conditions: holiday use only, made available to rent as commercial holiday lets, no more than 28 days per let, never anyone's sole or main residence, and a lettings register kept for the council to inspect. Several neighbourhood plans go further. The Heacham Neighbourhood Plan (made 2022) Policy 4 says new open-market homes, other than replacement dwellings, must be restricted to use as a principal residence, and new unrestricted second homes will not be supported. The Burnham Market Neighbourhood Plan 2022-2036 (made 26 Sep 2023, after 80.1% backed it at referendum) Policy 3 requires new homes to be the occupants' sole or main residence, secured by condition and a section 106 agreement, and says changing a home to a furnished holiday let will not be supported where planning permission is needed. 25 neighbourhood plans were in force in the borough by November 2025, so check the one for your parish.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=186", "https://www.west-norfolk.gov.uk/download/downloads/id/9462/local_plan_adoption_statement_-_march_2025.pdf", "https://www.west-norfolk.gov.uk/download/downloads/id/9318/kings_lynn_and_west_norfolk_local_plan_2021-2040_full_council_-_march_2025.pdf", "https://www.west-norfolk.gov.uk/info/20127/neighbourhood_plans/117/completed_plans", "https://www.west-norfolk.gov.uk/download/downloads/id/7197/made_heacham_neighbourhood_development_plan.pdf", "https://www.west-norfolk.gov.uk/info/20127/neighbourhood_plans/1037/burnham_market_neighbourhood_plan", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council agreed in January 2024 to charge a 100% second homes premium from 1 Apr 2025, re-approved it in January 2025 and again in July 2025 for 2026/27, and reviews it each year. A furnished home that is nobody's main home pays double council tax; the council says there are more than 3,000 second homes in West Norfolk (about 1 in 20 homes). Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council adds local exceptions: a planning condition that stops the home being anyone's sole or main residence also counts (as well as holiday-only and 28-day conditions), and a furnished home let on an assured shorthold tenancy to people living there as their main home is excepted for the days it is empty between lets. There is no right of appeal against the decision to charge the premium. Empty and unfurnished homes pay an extra 100% after 1 year (200% bill), 200% after 5 years (300% bill) and 300% after 10 years (400% bill); an uninhabitable home under major repair may get a 25% discount for up to 12 months. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.west-norfolk.gov.uk/info/20118/discounts_exemptions_and_premiums/1136/council_tax_premium_for_second_homes", "https://www.west-norfolk.gov.uk/premiumexceptions", "https://www.west-norfolk.gov.uk/info/20118/discounts_exemptions_and_premiums/77/empty_properties", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Great Yarmouth", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/great-yarmouth", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets that we found (checked 3 Nov 2026); the national planning data register lists no Article 4 directions for Great Yarmouth Borough Council, so check the council's own records for a specific property. Whether letting a whole home as a holiday let is a material change of use is decided case by case. The Broads Authority, not the borough council, handles planning in the Broads part of the
