<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Short-let licence checker | UK Short-Let Rules</title><meta name="robots" content="noindex"><link rel="canonical" href="https://ukshortletrules.co.uk/checker"><style>body{margin:0;padding:.8rem;font:15px/1.5 system-ui,sans-serif;color:#1d2433;background:#fff}h1{font-size:1.1rem;margin:0 0 .5rem}h2{font-size:1.05rem;margin:.8rem 0 .3rem}h3{font-size:1rem}h4{font-size:.95rem}a{color:#155a8a}:focus-visible{outline:3px solid #f2a541;outline-offset:2px}h1{color:#123c5a}.ck-more a{display:inline-block;background:#f2a541;color:#1b2533;padding:.5rem .9rem;border-radius:8px;text-decoration:none}.small{font-size:.8rem;color:#556}.ckw label{font-weight:600}footer{margin-top:.8rem;font-size:.8rem;color:#556}</style><style>.ckw{display:grid;gap:.4rem;max-width:28rem}.ckw select{padding:.6rem;font-size:1rem;width:100%}.ck-res h4{margin:.8rem 0 .2rem}.ck-res p{margin:.2rem 0}.ck-more a{font-weight:700}</style></head><body><main><h1>Do I need a licence or registration for my short let?</h1><form class="ckw" onsubmit="return false"><label for="ck-n">Nation</label><select id="ck-n"><option value="">Choose a nation</option></select><label for="ck-c">Council (optional)</label><select id="ck-c" disabled><option value="">All of the nation</option></select></form><div id="ck-out" aria-live="polite"></div><script>(function(){var D={"nations": [{"id": "scotland", "name": "Scotland", "h": "Yes: you need a licence.", "s": "Every short-term let in Scotland needs a licence from the council before you take bookings or guests.", "url": "https://ukshortletrules.co.uk/scotland", "rules": [{"t": "Licensing", "st": "In force", "x": "All short-term lets (secondary letting, home letting, home sharing) need a licence from the local council before taking bookings or receiving guests. Operating without a licence is a criminal offence (Edinburgh notes fines up to £2,500).", "src": ["https://www.gov.scot/publications/short-term-lets/", "https://www.edinburgh.gov.uk/licences-permits/licences-permits-applications/10"]}, {"t": "Planning / control areas", "st": "In force", "x": "Two control areas: the whole City of Edinburgh (since 5 Sep 2022) and Badenoch & Strathspey ward, Highland (since 4 Mar 2024). In these areas, using a whole dwelling that isn't your main home as a short-term let very likely needs planning permission. Licence applications there may need planning permission granted or applied for (mandatory condition 13). Proposed control areas are not in force until the council publishes a designation notice, at least 28 days before the start date. Argyll and Bute is consulting (21 Sep to 15 Nov 2026) on a proposed control area covering Mull and Iona; Coll and Tiree; Islay, Jura and Colonsay; and Oban, Lorn and the Inner Isles. The council extended this by two weeks after correcting figures in its consultation materials (2 Oct 2026). Not in force. Highland Council has agreed to submit further proposed control areas to Scottish Ministers (council news, Sep 2026). Reported to cover Inverness City and a wider rural area; details UNVERIFIED because the council website was offline when we checked on 22 Oct 2026. Not in force.", "src": ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.gov.scot/publications/short-term-lets/", "https://www.argyll-bute.gov.uk/my-community/community-planning/consultations/consultation/proposed-short-term-let-control-area", "https://www.argyll-bute.gov.uk/news/2026/oct/council-apologises-error-short-term-let-consultation", "https://www.highland.gov.uk/news/article/17496/highland-council-agrees-to-submit-short-term-let-control-area-proposals-to-scottish-ministers"]}, {"t": "Visitor levy", "st": "Council-by-council", "x": "Edinburgh: 5% of the accommodation cost, first 5 consecutive nights, stays from 24 Jul 2026, quarterly returns via visitorlevy.scot. First returns (stays 24 Jul to 30 Sep 2026) are due 1 to 30 Oct 2026, with payment by 13 Nov 2026. Glasgow: 5% from 25 Jan 2027, whole stay, liable on bookings made from 1 Apr 2026. Highland: consultation on £5 per room per night (opened 7 Sep 2026, closes 30 Nov 2026); council decision due 10 Dec 2026, then an 18-month lead-in. Aberdeen: 7% from 1 Apr 2027, whole stay, bookings made from 1 Oct 2026. Stirling: 3% from 14 Jun 2027, bookings made from 1 Jan 2027. West Dunbartonshire: 5% from 1 Jul 2027, bookings made from 1 Oct 2026. Dundee: consultation 31 Aug to 27 Nov 2026 on two options, £5 per room per night or 5% of the nightly room rate, both capped at 7 nights; earliest start 2028/29. Moray: consultation on whether to have a levy at all, to 31 Oct 2026 (no draft scheme yet). East Lothian: consulted on a draft 5% scheme (26 Jun to 18 Sep 2026); a council meeting on 27 Oct 2026 is asked to approve an independent review before any decision. Argyll and Bute: consultation on a flat rate per room per night closed 5 Oct 2026, no decision yet.", "src": ["https://www.edinburgh.gov.uk/visitorlevyinformation", "https://www.glasgow.gov.uk/article/14800/Accommodation-providers", "https://www.highland.gov.uk/news/article/17462/highland-council-opens-statutory-public-consultation-on-a-tiered-fixed-amount-visitor-levy-proposal", "https://www.visitscotland.org/tourism-events-industry/visitor-levy", "https://www.argyll-bute.gov.uk/visitor-levy", "https://www.dundeecity.gov.uk/consultations-and-surveys/visitor-levy-have-your-say", "https://newsroom.moray.gov.uk/news/council-consults-on-visitor-levy-for-moray", "https://www.eastlothian.gov.uk/news/2026/council-asked-approve-independent-review-visitor-levy-plans", "https://www.highland.gov.uk/news/article/17504/highland-council-invites-public-to-visitor-levy-consultation-webinars"]}]}, {"id": "england", "name": "England", "h": "No licence or registration yet.", "s": "England has no licensing or registration scheme in force. A national register is expected to begin in March 2027 (GOV.UK). In London, letting a whole home for more than 90 nights a year needs planning permission.", "url": "https://ukshortletrules.co.uk/england", "rules": [{"t": "Registration scheme", "st": "Not yet in force", "x": "A mandatory national registration scheme is coming under s.228 of the Levelling-up and Regeneration Act 2023. GOV.UK (updated 2 Oct 2026) now says it is expected to begin in March 2027. No regulations, portal or fee have been published yet.", "src": ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]}, {"t": "London 90-night rule", "st": "In force", "x": "In Greater London, a whole home can be short-let for up to 90 nights per calendar year without planning permission. Going over that needs permission (Deregulation Act 2015, s.44).", "src": ["https://www.legislation.gov.uk/ukpga/2015/20/section/44"]}, {"t": "Business rates vs council tax", "st": "In force", "x": "To be rated as a business, the let must have been available for at least 140 nights and actually let for at least 70 nights in the last 12 months, and you must intend to make it available for 140 nights in the next 12. From 24 Jul 2026 there are easements for owners of 5+ lets on the same property, and for lets sharing land with another business.", "src": ["https://www.gov.uk/guidance/apply-for-business-rates-for-a-self-catering-property-in-england"]}, {"t": "Overnight Visitor Levy", "st": "Announced, not yet law", "x": "On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders will get the power to introduce an Overnight Visitor Levy, charged as a percentage of the accommodation cost (not a flat fee). Local leaders choose whether to use it and can offer exemptions (e.g. campsites). Accommodation providers would pay it to the authority. A bill will be introduced in due course; no levy applies yet.", "src": ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]}]}, {"id": "wales", "name": "Wales", "h": "Yes: you must register (free). No licence yet.", "s": "If you take bookings of 31 nights or fewer, you must register with the Welsh Revenue Authority by 31 March 2027. A licensing scheme is legislated but not in force.", "url": "https://ukshortletrules.co.uk/wales", "rules": [{"t": "Registration (WRA)", "st": "In force", "x": "From 1 Oct 2026, anyone taking bookings of 31 nights or less must register with the Welsh Revenue Authority by 31 Mar 2027. Registration is free and applies even where no levy exists.", "src": ["https://www.gov.wales/registering-visitor-accommodation-overview"]}, {"t": "Licensing", "st": "Legislated, not in force", "x": "A licensing scheme for self-contained self-catering lets has Royal Assent. Its legal default commencement is March 2030, with consultation on regulations first.", "src": ["https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]}, {"t": "Visitor levy", "st": "Council-by-council", "x": "£1.30 per person per night (75p for hostels, dorms and tent pitches). The earliest start is 1 Apr 2027. Cardiff starts 1 Apr 2027. Councils must give 12 months' notice. Isle of Anglesey decided on 24 Sep 2026 not to introduce a levy at present, and Conwy deferred any decision the same day. Gwynedd says it has not decided yet. GOV.WALES lists Cardiff as the only council charging the levy and no councils currently consulting.", "src": ["https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview", "https://www.gov.wales/visitor-levy-wales", "https://www.gov.wales/visitor-levy-accommodation-providers-steps/check", "https://www.anglesey.gov.wales/en/newsroom/news/anglesey-will-not-introduce-visitor-levy-at-present", "https://www.conwy.gov.uk/en/Spotlight/Press-Releases/Conwy-County-Borough-Council-Defers-Decision-on-Visitor-Levy.aspx", "https://www.gwynedd.llyw.cymru/en-gb/businesses/tourism/tourism-levy-and-registration-of-visitor-accommodation"]}]}, {"id": "northern-ireland", "name": "Northern Ireland", "h": "Yes: you need a Tourism NI certificate.", "s": "All visitor accommodation in Northern Ireland needs a current Tourism NI certificate after an inspection.", "url": "https://ukshortletrules.co.uk/northern-ireland", "rules": [{"t": "Certification", "st": "In force", "x": "Under the Tourism (NI) Order 1992, all visitor accommodation needs a current Tourism NI certificate after an inspection. Certificates last 4 years. Star grading is voluntary.", "src": ["https://www.tourismni.com/business-guidance/sector/accommodation/accommodation-getting-started/self-catering/overview/", "https://www.legislation.gov.uk/nisi/1992/235/contents/made"]}, {"t": "Rates", "st": "In force", "x": "Self-contained self-catering available commercially for 140 days or more a year is non-domestic (rateable).", "src": ["https://www.finance-ni.gov.uk/articles/self-catering-holiday-establishment-non-domestic-valuation-practice-notes"]}]}], "councils": [{"n": "City of Edinburgh", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/city-of-edinburgh", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist.", ["https://www.gov.scot/publications/short-term-lets/"]], ["Planning", "Yes: the whole city has been a short-term let control area since 5 Sep 2022. Using a whole dwelling that isn't your main home as a short-term let very likely needs planning permission.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "5% of the accommodation cost, first 5 consecutive nights, stays from 24 Jul 2026. Quarterly returns via visitorlevy.scot. First returns (stays 24 Jul to 30 Sep 2026) are due 1 to 30 Oct 2026, with payment by 13 Nov 2026. Providers keep 2%.", ["https://www.edinburgh.gov.uk/visitorlevyinformation"]], ["Fees and council tax", "2026/27 fees (council fee schedule, valid 2026/27). Secondary letting, by maximum occupancy, 1-year new or renewal: £653 (1 to 3), £1,089 (4 to 5), £2,481 (6 to 10), £3,872 (11 to 15), £5,264 (16 to 20), £5,869 (21 and over); 3-year renewal: £1,053 / £1,489 / £2,881 / £4,272 / £5,664 / £6,869. Home letting, or home sharing and home letting: £120 per occupant (new, 1 year) or £360 per occupant (renewal, 3 years). Home sharing only: £120. Temporary licence or temporary exemption: £250 (1 to 5), £350 (6 to 10), £600 (11 and over); £120 for home sharing. Provisional licence 20% and confirmation 80% of the full fee. Fees are non-refundable. Operating without a licence can mean a fine of up to £2,500.", ["https://www.edinburgh.gov.uk/downloads/file/23569/civic-licence-fees", "https://www.edinburgh.gov.uk/licences-permits/licences-permits-applications/10"]]]}, {"n": "Glasgow City", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/glasgow-city", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist.", ["https://www.gov.scot/publications/short-term-lets/"]], ["Planning", "No control area in force.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "5% from 25 Jan 2027 on the whole stay; liable on bookings made from 1 Apr 2026.", ["https://www.glasgow.gov.uk/article/14800/Accommodation-providers"]], ["Fees and council tax", "Licence fees: not summarised here, check the council.", []]]}, {"n": "Highland", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/highland", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist.", ["https://www.gov.scot/publications/short-term-lets/"]], ["Planning", "Badenoch & Strathspey ward is a control area (since 4 Mar 2024). Rest of Highland: none in force. The council has agreed to submit further proposed control areas to Scottish Ministers (council news, Sep 2026); reported to cover Inverness City and a wider rural area. Details UNVERIFIED (the council website was offline when we checked on 22 Oct 2026).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.highland.gov.uk/news/article/17496/highland-council-agrees-to-submit-short-term-let-control-area-proposals-to-scottish-ministers"]], ["Visitor levy", "Proposed only: consultation on a £5 per room per night levy opened 7 Sep 2026 and closes 30 Nov 2026; council decision due 10 Dec 2026, then an 18-month lead-in.", ["https://www.highland.gov.uk/news/article/17462/highland-council-opens-statutory-public-consultation-on-a-tiered-fixed-amount-visitor-levy-proposal", "https://www.highland.gov.uk/news/article/17504/highland-council-invites-public-to-visitor-levy-consultation-webinars"]], ["Fees and council tax", "New or full-licence renewal, by guests (not counting children under 2). Home sharing or home letting: £320 (1 to 2 guests), £390 (3 to 6), £460 (7 to 9), £530 (10 or more). Secondary letting: £400 / £470 / £540 / £610. Temporary licence 50% of the full fee; variation or change in circumstance £120; duplicate licence £20. The council may charge for an inspection after a breach of conditions or a complaint. The council's fees page was last modified 14 Aug 2025 (read 26 Oct 2026), so check for a 2026/27 update.", ["https://www.highland.gov.uk/short-term-lets/apply-short-term-let-licence/6"]]]}, {"n": "Perth & Kinross", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/perth-and-kinross", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Public register at pkc.gov.uk/article/22511.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.pkc.gov.uk/article/22511"]], ["Planning", "Proposed, not in force: Highland Perthshire and the northern part of Eastern Perthshire, agreed 17 Jun 2026 and sent to Scottish Ministers. The council page (last modified 2 Jul 2026) still says it awaits their response. Planning press reports Ministers approved it on 12 Oct 2026: UNVERIFIED. Either way, it only takes effect after the council publishes a designation notice with at least 28 days' notice and a start date. Flats already need planning permission to become a short-term let.", ["https://consult.pkc.gov.uk/communities/proposal-of-short-term-let-control-area/", "https://www.pkc.gov.uk/article/25569/Short-term-Let-Control-Area"]], ["Visitor levy", "Draft scheme with fixed-rate options under statutory consultation from 19 Aug to Wed 11 Nov 2026. No decision yet; Council decides after considering responses. Reported rate of £4 per room per night: UNVERIFIED (not stated on the council page).", ["https://www.pkc.gov.uk/article/24551/Perth-and-Kinross-Visitor-Levy"]], ["Fees and council tax", "3-year licence, new or renewal (Policy Statement, 10 Mar 2025). Secondary letting: £350 (1–2 guests), £530 (3–6), £900 (7–10), £1,600 (11+). Home letting/sharing: £175 / £265 / £450 / £800. Variation or transfer £75.", ["https://www.pkc.gov.uk/media/50153/Short-term-Lets-Policy-Statement/pdf/Short-term_Lets_Licensing_Policy_Statement_-_10_MARCH_2025.pdf?m=1741781506817"]]]}, {"n": "Aberdeen City", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/aberdeen-city", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online: Aberdeen City Council application (one application per property). The council does not grant temporary licences or temporary exemptions.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.aberdeencity.gov.uk/Council-Services/housing/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). The council says that if the let is a whole dwelling that is not your main home, you may need planning permission as well as a licence, so check before applying.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.aberdeencity.gov.uk/Council-Services/housing/short-term-lets"]], ["Visitor levy", "Approved: 7% of the accommodation cost on the whole stay, for stays from 1 Apr 2027. Applies to bookings made from 1 Oct 2026 for those stays. Approved by the council's Finance & Resources Committee on 6 Aug 2025 under the Visitor Levy (Scotland) Act 2024.", ["https://www.aberdeencity.gov.uk/Council-Services/business-and-investment/introducing-the-aberdeen-visitor-levy", "https://www.visitscotland.org/tourism-events-industry/visitor-levy"]], ["Fees and council tax", "Same fee for first-time applications and renewals, effective from 1 Jan 2026. Home sharing and/or home letting: £470.40 (1–2 guests), £705.60 (3–4), £940.80 (5–6), £1254.40 (7–8), £1668.80 (9–12), £3337.60 (13+). Secondary letting: £492.80 / £739.20 / £985.60 / £1310.40 / £1752.80 / £3505.60.", ["https://www.aberdeencity.gov.uk/Council-Services/housing/short-term-lets/information/short-term-let-fees"]]]}, {"n": "Dundee City", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/dundee-city", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through MyDundee via the council's short-term lets licensing page.", ["https://www.gov.scot/publications/short-term-lets/"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "Not approved. The council's formal visitor levy consultation runs from 31 Aug to 27 Nov 2026 on two options: a flat £5 per room per night, or 5% of the nightly room price, both capped at 7 nights. If approved, the earliest start is 2028/29 (at least 18 months' notice).", ["https://www.dundeecity.gov.uk/consultations-and-surveys/visitor-levy-have-your-say", "https://www.dundeecity.gov.uk/news/article?article_ref=5123"]], ["Fees and council tax", "Not shown: the council's website was unavailable when we checked on 21 Oct 2026, so we could not confirm its current fee table. Check the council's licensing page.", []]]}, {"n": "Fife", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/fife", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply and pay online on fife.gov.uk. Fife says processing can take up to 9 months, a full licence usually lasts up to 3 years, and operating without one can mean a fine of up to £2,500 and a one-year ban from applying.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.fife.gov.uk/housing/private-rented-sector/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Fife Council consulted on the principle of designating control areas (16 Jun to 8 Sep 2025). Any designation would need Scottish Ministers' approval. Reports that the council has since chosen St Andrews and the East Neuk for a control area: UNVERIFIED.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://haveyoursay.fife.gov.uk/place/short-term-lets/"]], ["Visitor levy", "No scheme approved. Fife ran early engagement surveys (latest closed 31 Jan 2026, adding a flat-rate option). Any draft scheme would need a formal consultation, then at least 18 months before it starts, so the council says 2028 is the earliest. Reports of an Oct 2026 decision to move to formal consultation: UNVERIFIED.", ["https://haveyoursay.fife.gov.uk/place/update-fife-visitor-levy-early-engagement-survey/", "https://www.fife.gov.uk/news/2025/fife-council-agrees-to-consult-on-a-visitor-levy-for-the-kingdom"]], ["Fees and council tax", "Not summarised here: the fee table page on fife.gov.uk blocked our check. See the fee structure linked from the council's short-term let page.", ["https://www.fife.gov.uk/housing/private-rented-sector/short-term-lets"]]]}, {"n": "Argyll and Bute", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/argyll-and-bute", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply or renew online via the council. The council does not consider temporary exemptions or temporary licences. Public register of licences on argyll-bute.gov.uk.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.argyll-bute.gov.uk/licences/short-term-lets-licence"]], ["Planning", "Proposed, not in force: consultation from 21 Sep to 15 Nov 2026 on a control area covering Mull and Iona; Coll and Tiree; Islay, Jura and Colonsay; and Oban, Lorn and the Inner Isles. No control area is designated yet. The council says outside a control area you don't need proof of planning permission to get a licence, but you must make sure any needed permission is in place; inside a control area, a new change of use of a dwelling to a secondary let would always need planning permission. New buildings, pods and converted garages or sheds for short-term letting will generally need planning permission.", ["https://www.argyll-bute.gov.uk/my-community/community-planning/consultations/consultation/proposed-short-term-let-control-area", "https://www.argyll-bute.gov.uk/business-and-licensing/law-and-licensing/planning-advice-short-term-lets"]], ["Visitor levy", "Not approved. The council consulted on a revised draft scheme with a flat rate per room per night (allowed by the Visitor Levy (Amendment) (Scotland) Act 2026). The consultation closed 5 Oct 2026; findings go to a future council meeting. Proposed amount: not stated on the council page.", ["https://www.argyll-bute.gov.uk/visitor-levy"]], ["Fees and council tax", "3-year licence, same fee for new and renewal applications. Home sharing or home letting: £285.30 (up to 4 guests), £398.95 (5 to 8), £627.40 (9 to 12), £799.15 (13 to 20), £1,027.65 (21 and over). Secondary letting: £398.95 / £570.60 / £855.95 / £1,141.30 / £1,426.60. Guest capacity includes children under 10. Transfer £97.20, variation £97.20.", ["https://www.argyll-bute.gov.uk/licences/short-term-lets-licence"]]]}, {"n": "Stirling", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/stirling", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Stirling Council application steps: email or post the forms to the Private Rented Housing team, then pay once you get a reference number.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.stirling.gov.uk/business-and-licences/licensing/short-term-let-licensing/apply-for-a-short-term-let-licence/"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Check planning permission before you apply. If the property is in Loch Lomond & The Trossachs National Park, the park authority is the planning authority; you may also need a building warrant for alterations.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.stirling.gov.uk/business-and-licences/licensing/short-term-let-licensing/apply-for-a-short-term-let-licence/"]], ["Visitor levy", "Approved: 3% (charged before VAT) on paid overnight stays from 14 Jun 2027, for bookings made on or after 1 Jan 2027. Applies all year across the whole council area. Exemptions (Stirling residents on the council tax register, nights beyond the first 7, some disability benefits, carers) are handled by refund to the visitor after the stay. Providers keep 3% of the levy collected.", ["https://www.stirling.gov.uk/about-the-council/stirling-visitor-levy-scheme/details-about-stirlings-visitor-levy-scheme/", "https://www.stirling.gov.uk/about-the-council/stirling-visitor-levy-scheme/information-for-accommodation-providers/"]], ["Fees and council tax", "As published on the council page (which says these apply 1 Apr 2025 to 31 Mar 2026 and are reviewed each year; 2026-27 figures not shown there). 3-year licence, first-time: home letting and/or sharing £113 (4 people or fewer) / £283 (5 or more); secondary letting £283 / £453. Renewal: £85 / £227 and £227 / £397. Temporary licence or exemption (up to 6 weeks): £91 / £170 and £142 / £227.", ["https://www.stirling.gov.uk/business-and-licences/licensing/short-term-let-licensing/apply-for-a-short-term-let-licence/"]]]}, {"n": "West Dunbartonshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/west-dunbartonshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online for grant or renewal; upload a 1:50 layout plan, gas and electrical certificates and the fire safety checklist with the application.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.west-dunbarton.gov.uk/business/licences-permits-and-permissions/short-term-lets/short-term-let-licences"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Applications are sent to the council's planning department, or to the Loch Lomond & The Trossachs National Park planning authority where appropriate. Include planning permission or a certificate of lawfulness where applicable.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.west-dunbarton.gov.uk/business/licences-permits-and-permissions/short-term-lets/short-term-let-licences"]], ["Visitor levy", "Approved: 5% (before VAT) on the whole stay, for stays from 1 Jul 2027. Applies to bookings made (and paid for in part or full) from 1 Oct 2026. Providers keep 1.5%.", ["https://www.west-dunbarton.gov.uk/business/visitor-levy", "https://www.visitscotland.org/tourism-events-industry/visitor-levy"]], ["Fees and council tax", "Grant and renewal application £929.00. Provisional £697.00, confirmation £232.00, transfer £61.00, Environmental Health inspection £60.00. Fees from 1 Apr 2026.", ["https://www.west-dunbarton.gov.uk/business/licences-permits-and-permissions/short-term-lets/short-term-let-licences", "https://www.west-dunbarton.gov.uk/media/kv1p452v/annual-charges-and-licence-fees-2026-27doc.pdf"]]]}, {"n": "Greater London (all boroughs)", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/greater-london-all-boroughs", "sec": [["Licensing or registration", "No licensing or registration scheme in force in England.", []], ["Planning", "90 nights per calendar year cap on letting a whole home short-term without planning permission. Count your nights with the free counter.", ["https://www.legislation.gov.uk/ukpga/2015/20/section/44"]], ["Visitor levy", "No visitor levy.", []], ["Fees and council tax", "None.", []]]}, {"n": "Cornwall", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cornwall", "sec": [["Licensing or registration", "No licensing or registration scheme in force in England.", []], ["Planning", "None listed.", []], ["Visitor levy", "No visitor levy. Council tax: 100% second-home premium from 1 Apr 2025, with exceptions (e.g. holiday-only planning conditions).", ["https://www.cornwall.gov.uk/council-tax/second-homes/"]], ["Fees and council tax", "None.", []]]}, {"n": "Gwynedd", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/gwynedd", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "Article 4 direction (C3 to C5/C6) was quashed and is not in force; the Court of Appeal refused appeal on 6 Feb 2026.", ["https://www.gwynedd.llyw.cymru/en-gb/planning-building-control-and-listed-buildings/planning/article-4-direction"]], ["Visitor levy", "No levy. The council consulted from 20 May to Jul 2026 and says (page updated 1 Oct 2026) it has not made a decision. Any Gwynedd levy could start no earlier than Oct 2027. GOV.WALES lists Cardiff as the only council charging.", ["https://www.gwynedd.llyw.cymru/en-gb/businesses/tourism/tourism-levy-and-registration-of-visitor-accommodation", "https://www.gov.wales/visitor-levy-accommodation-providers-steps/check"]], ["Fees and council tax", "WRA registration is free.", []]]}, {"n": "Cardiff", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/cardiff", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction listed.", []], ["Visitor levy", "Visitor levy for new bookings for stays from 1 Apr 2027: £1.30 per person per night (75p for shared hostel/dorm rooms and tent pitches).", ["https://www.gov.wales/visitor-levy-wales"]], ["Fees and council tax", "WRA registration is free.", []]]}, {"n": "Pembrokeshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/pembrokeshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No control area or Article 4 direction listed here.", []], ["Visitor levy", "No levy listed here. Check the gov.wales list of councils charging the levy.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 125% from 1 Apr 2026, on top of the standard charge (150% in 2025-26, 200% in 2024-25). Exceptions apply. The 2027-28 premium was due to be decided by full Council on 15 Oct 2026, taking effect 1 Apr 2027; local press reports 125% was kept: UNVERIFIED (not yet on the council's premium page).", ["https://www.pembrokeshire.gov.uk/council-tax-discounts/second-homes", "https://newsroom.pembrokeshire.gov.uk/news/council-tax-premiums-for-2027-28-have-your-say"]]]}, {"n": "Isle of Anglesey", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/isle-of-anglesey", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found on the council's site (checked 23 Oct 2026).", []], ["Visitor levy", "No levy. Full Council decided on 24 Sep 2026 not to introduce a visitor levy at present, citing pressures on tourism businesses, an economic impact assessment and a consultation with more than 2,000 responses. GOV.WALES lists Cardiff as the only council charging.", ["https://www.anglesey.gov.wales/en/newsroom/news/anglesey-will-not-introduce-visitor-levy-at-present", "https://www.gov.wales/visitor-levy-accommodation-providers-steps/check"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so 200% in total). The Executive's 2026-27 budget proposal confirmed it is maintained at 100%; the council's second-homes page still shows older wording. Final adoption by full Council on 5 Mar 2026: UNVERIFIED. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition).", ["https://www.anglesey.gov.wales/en/Residents/Council-tax/Second-homes-and-long-term-empty-homes.aspx", "https://democracy.anglesey.gov.uk/ieDecisionDetails.aspx?ID=3960&LLL=0"]]]}, {"n": "Conwy", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/conwy", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found on the council's site (checked 23 Oct 2026).", []], ["Visitor levy", "No levy yet. Full Council on 24 Sep 2026 deferred any decision until more evidence and practical experience from levies elsewhere in Wales are available. Its consultation ran 20 May to 17 Jul 2026. Any Welsh levy needs 12 months' notice before it starts.", ["https://www.conwy.gov.uk/en/Spotlight/Press-Releases/Conwy-County-Borough-Council-Defers-Decision-on-Visitor-Levy.aspx", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 150% on top of the standard charge (250% in total), retained for 2026-27 and 2027-28 (decided 23 Oct 2025). No discount for second homes or holiday homes. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition).", ["https://www.conwy.gov.uk/en/Resident/Council-Tax/Council-Tax-Premium-Update.aspx"]]]}, {"n": "Ceredigion", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/ceredigion", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found on the council's site (checked 23 Oct 2026).", []], ["Visitor levy", "No levy. We found no council decision or consultation; the council's 2026-27 medium term financial strategy says it has not yet set a formal position on whether to consider charging the levy, and GOV.WALES does not list Ceredigion among councils charging or consulting. Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.ceredigion.gov.uk/media/yqinbr4n/medium-term-financial-strategy-2026-27-to-2030-31.pdf", "https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 150% on top of the standard charge (250% in total) from 1 Apr 2025 (100% from 1 Apr 2024). The council says this covers second homes and self-catering units that fail the criteria for business rates. No discount for second homes. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Ceredigion also lists annexes used as part of the main home and homes being marketed for sale or let (up to 12 months).", ["https://www.ceredigion.gov.uk/resident/council-tax/premiums/", "https://www.ceredigion.gov.uk/media/3qtie2yh/council-tax-booklet-2026-2027.pdf"]]]}, {"n": "Powys", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/powys", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found on the council's site (checked 23 Oct 2026). In the Brecon Beacons (Bannau Brycheiniog) National Park, the park authority handles planning.", []], ["Visitor levy", "No levy at this stage. Full Council voted 29 to 19 on 9 Oct 2025 not to implement a levy for now and to run an engagement exercise. That survey closed 30 Sep 2026 and results go to Cabinet and full Council. The council says any decision would be for the administration elected in May 2027, a formal consultation would be needed, and 2028 is the earliest a levy could start.", ["https://powys.moderngov.co.uk/documents/g8971/Printed%20minutes%2009th-Oct-2025%2010.30%20County%20Council.pdf?T=1", "https://www.haveyoursaypowys.wales/visitor-levy"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 75% on top of the standard charge (175% in total), effective since 1 Apr 2023 and unchanged for 2026-27. The council's 2026-27 tax base report notes 235 extra self-catering units moved from business rates into council tax after failing the Welsh 252/182-day letting test. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition).", ["https://en.powys.gov.uk/article/3079/Council-Tax-Premiums", "https://powys.moderngov.co.uk/documents/s99886/Cabinet%20report%20-Council%20Tax%20Base%202026-27.pdf"]]]}, {"n": "East Lothian", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/east-lothian", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through the East Lothian Council short-term lets page (licensing team: stl@eastlothian.gov.uk, 01620 827664). Applications are advertised by a site notice; anyone can comment within 21 days. The council publishes a public register of licences.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.eastlothian.gov.uk/business-and-licensing/licensing/accommodation-licensing/short-term-lets-licensing"]], ["Planning", "No control area: the council says it has not designated any, but will review this over time. You still need to check whether your property needs planning permission (Planning: environment@eastlothian.gov.uk, 01620 827216). If you apply without needed planning permission or a Certificate of Lawful Use or Development, the council will refuse to consider the application; you then have three months to apply for planning permission or a certificate, and the licence fee is not refunded if it is not granted.", ["https://www.eastlothian.gov.uk/business-and-licensing/licensing/accommodation-licensing/short-term-lets-licensing", "https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "Not approved. The council consulted on a draft scheme from 26 Jun to 18 Sep 2026: a 5% levy on accommodation charges, all year, with no cap on chargeable nights. The consultation had 530 responses. A report to the full council meeting on 27 Oct 2026 asks councillors to approve an independent review of the economic, social and community effects (including the option of no levy) before further recommendations on whether, and in what form, a levy should go ahead.", ["https://www.eastlothian.gov.uk/news/2026/council-asked-approve-independent-review-visitor-levy-plans"]], ["Fees and council tax", "Licensing Fees 2026/27 booklet, 3-year licence, new or renewal: £1,154 (1 to 5 occupants), £1,171 (6 to 10), £1,189 (11 to 20), £1,205 (21 to 30), £1,223 (31 to 40), £1,240 (41 to 50), £1,275 (51 to 60). Provisional licence £291 up front, with the balance of the full fee due on completion. Temporary licence £291 (up to 6 weeks). Variation or transfer £97, duplicate £33. The provisional licence fee only applies where the accommodation is under construction, not refurbishment. Fees are not refunded if an application is refused or withdrawn.", ["https://www.eastlothian.gov.uk/sites/default/files/downloads/Fees_booklet_2025.docx", "https://www.eastlothian.gov.uk/business-and-licensing/licensing/accommodation-licensing/short-term-lets-licensing"]]]}, {"n": "Moray", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/moray", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Email the application to licensing@moray.gov.uk (or post it to the Licensing Team, Council Offices, High Street, Elgin IV30 1BX) and pay the full fee at the same time; the council will not process it until everything is in. Moray does not grant temporary exemptions; it may grant a temporary licence of up to six weeks. Each property needs its own licence.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.moray.gov.uk/law-and-licensing/licences-permits-and-permissions/property-licences/short-term-lets-licence/"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Moray says you must check whether you need planning permission (or a certificate of lawfulness) before applying for a licence, and if you do, apply for it first. Provisional licences need the relevant planning certificate.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.moray.gov.uk/law-and-licensing/licences-permits-and-permissions/property-licences/short-term-lets-licence/"]], ["Visitor levy", "No decision. Consultation on whether Moray should introduce a visitor levy at all opened 2 Sep 2026 and runs to 31 Oct 2026. If the council goes ahead, a draft scheme would get a further public consultation before any final decision.", ["https://newsroom.moray.gov.uk/news/council-consults-on-visitor-levy-for-moray"]], ["Fees and council tax", "From 1 Apr 2026: licence or renewal £540 (same for new and existing operators); temporary licence £540; provisional licence £220; confirmation of a provisional licence £320; transfer £309; variation £30; copy of licence £24; inspection £220. Planning, Building Standards and Environmental Health charge separately. Fees are not refunded if an application is refused.", ["https://www.moray.gov.uk/law-and-licensing/licences-permits-and-permissions/property-licences/property-licence-fees/", "https://www.moray.gov.uk/law-and-licensing/licensing-and-licences/licence-fees/"]]]}, {"n": "Scottish Borders", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/scottish-borders", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply or renew through Scottish Borders Council (urgent questions: stllicensing@scotborders.gov.uk). The council says unlicensed letting is enforced by Police Scotland.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.scotborders.gov.uk/licensing/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No visitor levy proposed. Scottish Borders is not on VisitScotland's list of councils that have introduced, are consulting on, or are engaging on a levy (checked 22 Oct 2026).", ["https://www.visitscotland.org/tourism-events-industry/visitor-levy"]], ["Fees and council tax", "New and renewal, usually a 3-year licence: £417 (1 to 3 guests), £465 (4 to 6), £537 (7 or more). Variation or change in circumstances £104, duplicate licence £50. The council may charge for inspections after a breach of conditions or a complaint.", ["https://www.scotborders.gov.uk/licensing/short-term-lets/3"]]]}, {"n": "Aberdeenshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/aberdeenshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply or renew online through Aberdeenshire Council (questions: stl@aberdeenshire.gov.uk). You need one licence per separately bookable self-contained unit; a group of yurts or lodges on the same land can get a multi-unit licence. The council says a garden cabin, a self-contained extension or a converted steading, barn or garage with its own access needs a secondary letting licence. You must display a public notice outside the property; objections can be made within 28 days. Documents to send: EICR (within 5 years), PAT certificate and gas safety certificate (both within 12 months), EPC (secondary lets), and evidence of buildings insurance plus public or property owners liability cover of at least £2m. The council will not process incomplete applications and has up to 9 months to decide. A renewal must be in before the expiry date, or you become a new host and pay the higher fee.", ["https://www.gov.scot/publications/short-term-lets/", "https://aberdeenshire.gov.uk/licensing/licences-and-permits/short-term-let-licensing/", "https://www.aberdeenshire.gov.uk/licensing/licences-and-permits/stl-apply-or-renew"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No scheme proposed yet. The council ran an initial survey from 24 Jun to 22 Jul 2025 (767 responses, 65% not supportive) and said a formal consultation would follow; we found no formal consultation published as of 22 Oct 2026. VisitScotland lists Aberdeenshire as early engagement only.", ["https://engage.aberdeenshire.gov.uk/you-said-we-did/news_feed/aberdeenshire-visitor-levy", "https://www.visitscotland.org/tourism-events-industry/visitor-levy"]], ["Fees and council tax", "Applies until 31 Mar 2027, by maximum guests. New home sharing or letting: £364 (1 to 2), £481.50 (3 to 4), £610 (5 to 9), £727.75 (10 to 15), £909.75 (16+). New secondary letting, and provisional licences for new builds or conversions: £481.50, £642, £813.50, £909.75, £1,006. Renewal home sharing or letting: £331.75, £433.50, £545.75, £652.75, £824. Renewal secondary letting: £433.50, £578, £738.50, £824, £920.25. Duplicate licence £53.50. Variation £107 and transfer £150 (the council page dates these to 31 Mar 2026). Fees are non-refundable.", ["https://www.aberdeenshire.gov.uk/licensing/licences-and-permits/stl-apply-or-renew", "https://www.aberdeenshire.gov.uk/licensing/licences-and-permits/stl-transfers-and-variations"]]]}, {"n": "Dumfries and Galloway", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/dumfries-and-galloway", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through Dumfries and Galloway Council (shorttermlets@dumgal.gov.uk). Send a floor plan showing room sizes and bedroom occupancy, stairs or lifts, the use of each room, fire escape routes, any accessible rooms, smoke and heat detectors, and CO detectors if there is an open-flue appliance. Applications go on the public register and anyone can object during the 21-day notice period. Renewals are every 3 years and the council sends a reminder 3 months before expiry. The council says operating without a licence is a criminal offence, with a fine of up to £2,500 and a one-year ban from applying.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.dumfriesandgalloway.gov.uk/housing/landlords/property-licensing/short-term-lets/apply-short-term-let-licence", "https://www.dumfriesandgalloway.gov.uk/housing/landlords/property-licensing/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy: plans dropped. After early engagement (29 Sep to 21 Nov 2025), the council's economy and infrastructure committee voted 10 to 8 on 9 Jun 2026 to stop all work on a visitor levy, with no formal consultation. Any future proposal would have to start again. (VisitScotland's list still showed Dumfries and Galloway under early engagement when we checked on 22 Oct 2026.)", ["https://www.bbc.co.uk/news/articles/c621mp15zpno", "https://www.dumfriesandgalloway.gov.uk/visitorlevy"]], ["Fees and council tax", "3-year licence, by maximum guests. Home sharing and home letting: £324 (up to 6), £361 (7 to 12), £413 (13+). Secondary letting: £357, £397, £454. The council says new, renewal and provisional applications currently cost the same. From 1 Apr 2026: confirming a provisional licence £79, transfer £79. Fees are non-refundable.", ["https://www.dumfriesandgalloway.gov.uk/housing/landlords/property-licensing/short-term-lets/apply-short-term-let-licence"]]]}, {"n": "North Yorkshire", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/north-yorkshire", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found on the council site (checked 23 Oct 2026). Whether letting a whole home counts as a material change of use is decided case by case by the planning authority; inside the Yorkshire Dales or North York Moors National Parks, the park authority handles planning. Check before converting a home or outbuilding.", []], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: a 100% premium applies to second homes (furnished, nobody's main home), so the bill is 200% of normal, from 1 Apr 2025. The council decided this on 21 Feb 2024 and its 2026-27 council tax resolution kept it unchanged. Second homes with a planning restriction of at least 28 days (Class A) get no discount and no premium. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.northyorks.gov.uk/council-tax/council-tax-second-homes", "https://edemocracy.northyorks.gov.uk/documents/s63758/Council%20Tax%20Resolution%20Report.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Northumberland", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/northumberland", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found on the council site (checked 23 Oct 2026). Planning is decided case by case; inside Northumberland National Park, the park authority handles planning. Some local neighbourhood plans may have their own housing policies, so check the plan for your parish before buying or converting.", []], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025, second homes (furnished, nobody's main home) pay a 100% premium, so 200% council tax. Full Council approved it on 21 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council says you may need to send evidence for an exception, and the 12-month marketing exceptions run from the date you first marketed the home, even if you took it off the market (contact counciltax@northumberland.gov.uk, 0345 600 6400). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it pays business rates instead, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.northumberland.gov.uk/council-tax/empty-and-second-homes-premiums", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Westmorland and Furness", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/westmorland-and-furness", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found on the council site (checked 23 Oct 2026). Planning is decided case by case; inside the Lake District or Yorkshire Dales National Parks, the park authority handles planning. Check before converting a home or outbuilding.", []], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 22 Feb 2024 the council decided to charge a 100% premium on furnished second homes (nobody's main home), so the bill is 200% of normal, starting 1 Apr 2025. It also applies to homes owned by businesses. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council also has discretionary local exceptions, set out in its Council Tax Premium Exceptions Policy 2025 to 2026, and separate forms for the former Barrow, Eden and South Lakeland areas. A home you put up for sale is free of the premium for 12 months from when it was first marketed, not from 1 Apr 2025. The council says the Valuation Office, not the council, decides whether a holiday let moves to business rates, and you keep paying council tax as a second home until it does. If it moves, you need to arrange a trade waste collection. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.westmorlandandfurness.gov.uk/council-tax/second-homes-and-empty-homes/council-tax-second-homes", "https://www.westmorlandandfurness.gov.uk/news/2024/westmorland-and-furness-council-protects-front-line-services-tough-financial-times-0", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Cumberland", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cumberland", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found on the council site (checked 23 Oct 2026). Planning is decided case by case; inside the Lake District National Park, the park authority handles planning. Check before converting a home or outbuilding.", []], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 6 Mar 2024 the council adopted a 100% premium on furnished homes that are nobody's main home, so 200% council tax is payable from 1 Apr 2025 (before then, second homes paid 100%). Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). You must apply for an exception, and apply in the area where the second home is. For the marketing exception, the same owner can only use the sale exception once, and the letting exception again only after the home has been let for at least six months in a row. A job-related second home may get a 50% discount. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.cumberland.gov.uk/council-tax/empty-properties-and-second-homes/second-homes-and-how-apply-exception-council-tax-second-home-premium", "https://www.cumberland.gov.uk/news/2025/council-agrees-budget-investing-communities-and-services", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "North Norfolk", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/north-norfolk", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in the Broads, where the Broads Authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025, a 100% premium applies to second homes (furnished, nobody's main home), so owners pay double. The council decided this on 22 Nov 2023 and confirmed it at Full Council in Jan and Feb 2025. The council says holiday lets that are not on the business rates list (because they don't meet the holiday let criteria) pay council tax as a second home and may pay the premium; holiday lets on the business rates list do not. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.north-norfolk.gov.uk/tasks/council-tax/council-tax-premium-for-second-homes", "https://modgov.north-norfolk.gov.uk/mgAi.aspx?ID=13114", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Dorset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/dorset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Dorset Council agreed at its Feb 2024 budget meeting to charge a 100% premium on second homes (furnished, nobody's only or main home) from 1 Apr 2025, so 200% council tax. The premium applies from day one; there is no minimum period as a second home. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply for an exception with evidence to secondhomes@dorsetcouncil.gov.uk and keep paying your bill while it is considered. The council also considers hardship reductions under s13A. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.dorsetcouncil.gov.uk/w/council-tax/second-homes", "https://www.dorsetcouncil.gov.uk/w/your-bill-explained-2025-26", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "South Hams", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/south-hams", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Dartmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: a 100% premium is added automatically to second homes from 1 Apr 2025 (public notice given 2 Mar 2024), so 200% council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). South Hams also set local discretionary exceptions for 2025-26 (for example agricultural occupancy conditions, and staff accommodation used to run a business); apply with evidence through the council's online form. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.southhams.gov.uk/council-tax/empty-properties-and-second-homes", "https://www.southhams.gov.uk/sites/default/files/2025-02/SH%20Guidance%20on%20discretionary%20exceptions%20to%20Council%20Tax%20premiums.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "North Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/north-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Exmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council decided on 17 Jan 2024 to charge a 100% second homes premium (twice the standard rate) from 1 Apr 2025, including furnished homes with a planning restriction on occupation unless an exception applies. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). You can apply for an exception online through the council. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.northdevon.gov.uk/council-tax/charges-for-second-homes-and-empty-properties", "https://www.northdevon.gov.uk/sites/default/files/2025-03/North%20Devon%20Council%20Tax%20empty%20homes%20and%20second%20homes%20premiums%20policy%202025.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Isle of Wight", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/isle-of-wight", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council adopted the power in Feb 2024 and charges a 100% premium on furnished second homes from 1 Apr 2025 (200% in total). Exceptions (
