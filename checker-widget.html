nd 300% (10 years or more), and a change of owner does not remove it. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.staffsmoorlands.gov.uk/article/6836/Empty-property-premium", "https://democracy.staffsmoorlands.gov.uk/documents/s44780/SMDC+Report+for+Business+Rates+Reliefs+and+Council+Tax+Reduction+and+Premiums+Jan+2025+11022025+.pdf", "https://democracy.staffsmoorlands.gov.uk/documents/s44817/Appendix%20B.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Exeter", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/exeter", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists 16 for Exeter City Council, covering named sites (including telecommunications and demolition directions) and Houses in Multiple Occupation (a city direction that ended on 23 Dec 2024, replaced by the 2023 Article 4 Direction for change of use from C3 dwellinghouses to C4 HMOs in force from 23 Dec 2024), none about holiday lets (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Core Strategy (adopted 21 Feb 2012) and the Exeter Local Plan First Review (2005). Local Plan First Review Policy TM2 permits small hotels, guest houses and self-catering accommodation in residential areas where amenity is protected and facilities are for staying guests unless amenity can still be maintained; Policy TM1 steers larger hotel development to the City Centre and Quayside. The council is preparing the Exeter Plan (2021-2041) to replace both; until it is adopted the current Local Plan stays in force.", ["https://exeter.gov.uk/planning-services/current-policy/current-local-plan/", "https://exeter.gov.uk/planning-services/current-policy/current-local-plan/core-strategy/", "https://exeter.gov.uk/media/qs2gedn5/tourism.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=136", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Exeter charges a 100% premium on second homes (furnished properties that are nobody's main home), so the bill doubles. The council's Council Tax Premiums page (last updated 7 Oct 2026) says so, and its Empty Homes and Second Homes Premium Policy 2024-25 confirms the maximum 100% premium. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply online with the council's premium exception form; exceptions will not be considered without an application. If you are contractually required to live elsewhere for your job you may be eligible for a 50% discount (provide your employment contract via the council's online enquiry form). Empty and substantially unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (more than 10 years); a change of owner does not restart the empty period. Empty-home exceptions also include major repairs or structural alterations (up to 12 months). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://exeter.gov.uk/council-tax/how-much-is-my-council-tax/council-tax-premiums/", "https://exeter.gov.uk/council-tax/how-much-is-my-council-tax/council-tax-premiums/premium-exceptions/", "https://exeter.gov.uk/council-tax/how-much-is-my-council-tax/council-tax-premiums/apply-for-a-premium-exception/", "https://committees.exeter.gov.uk/documents/s93520/Exeter%20Council%20Tax%20Empty%20Homes%20Second%20Homes%20Premiums%20Policy.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Malvern Hills", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/malvern-hills", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Malvern Hills District Council (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the South Worcestershire Development Plan Review (SWDPR), which came into effect on 26 Mar 2026 and replaced the 2016 South Worcestershire Development Plan. It is a joint plan with Worcester City and Wychavon. Policy SWDPR 45 (Visitor Accommodation) permits new visitor accommodation, including self-catering and holiday lets, within Development Boundaries where the type and scale fit and neighbouring amenity is protected; outside Development Boundaries it is limited to farm or rural-business diversification, ancillary accommodation to a pub or similar, extensions to an established hotel or venue, reuse of a substantial redundant building, or sites adjoining a Development Boundary and physically related to visitor accommodation inside it. The Malvern Hills National Landscape (formerly AONB) is protected under Policy SWDPR 31; it is not a National Park and Malvern Hills District Council remains the planning authority.", ["https://www.malvernhills.gov.uk/planning/planning-policy", "https://www.swdevelopmentplan.org/filelink/fileman-files/SWDPR%20Adopted%20Plan%2026%20March%202026/FINAL%20SWDPR%20March%202026.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=209", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Malvern Hills charges a 100% premium on second homes (furnished properties that are no one's sole or main residence), so the bill doubles. The council's Discounts, premiums and exemptions page says elected members voted to use the Levelling-up and Regeneration Act powers under sections 11C and 11D. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council's page lists those exception classes (E to L) and says to email with your account number and the class you want to claim. If your second home is job-related you may be eligible for a 50% discount (Classes A to C: tied accommodation required by your employment contract, a minister of religion's residence, or Ministry of Defence accommodation). Empty and substantially unfurnished homes: the same page still describes a 200% charge after more than 2 years (the older empty-homes premium wording) and does not set out a 1-year empty premium or the 5-year / 10-year tiers on that page. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.malvernhills.gov.uk/council-tax/discounts-and-exemptions", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Mid Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/mid-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Mid Devon District Council (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Mid Devon Local Plan Review 2013-2033 (adopted 29 Jul 2020). Policy DM22 (Tourism and leisure development) supports new or expanded tourism, visitor or leisure facilities within or adjacent to defined settlements; elsewhere the countryside location must be justified, environmental and traffic impacts minimised, character respected, existing buildings converted or replaced where appropriate, and unmet need shown. The council's tourism/holiday-lets validation checklist asks for a business case (demand, competitors, financial forecast). A small part of the district lies in Dartmoor National Park, where the National Park Authority handles planning and the Mid Devon Local Plan does not apply; most of Mid Devon is outside the park.", ["https://www.middevon.gov.uk/residents/planning-policy/adopted-local-plan-and-policies-maps/", "https://www.middevon.gov.uk/media/354365/local-plan-review-2013-2033-adopted-11112022-accessible.pdf", "https://www.middevon.gov.uk/residents/planning/validation-checklist-part-3-local-requirements-1/tourismholiday-lets/", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=211", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Mid Devon charges a 100% premium on second homes (substantially furnished dwellings that are not anyone's sole or main residence), so the bill doubles. The council's second homes page and its Empty Homes and Second Homes Premiums Policy say so, and the Tax Base Report 2025-26 records that Full Council agreed it on 21 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council's page summarises annexes, job-related accommodation and occupied caravan pitches / boat moorings, plus 12-month exceptions for sale or let, probate and seasonal homes with occupancy restrictions. Hardship can be considered under section 13A(1)(c). Empty and substantially unfurnished homes pay a premium after 1 year since 1 Apr 2024: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.middevon.gov.uk/residents/council-tax/council-tax-second-homes-changes-to-second-homes/", "https://www.middevon.gov.uk/residents/council-tax/council-tax-empty-property-premiums/", "https://www.middevon.gov.uk/media/355908/mid-devon-council-tax-empty-homes-second-homes-premiums-policy.pdf", "https://democracy.middevon.gov.uk/documents/s31854/Tax+Base+Report+2025-26+FINAL.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Ribble Valley", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/ribble-valley", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Ribble Valley Borough Council (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Core Strategy (adopted 16 Dec 2014). Key Statement EC3 (Visitor Economy) encourages proposals that strengthen the visitor economy, including new accommodation and tourism facilities through conversion of existing buildings or associated with existing attractions. Policy DMB3 (Recreation and Tourism Development) permits development that extends the range of tourism and visitor facilities where it is well related to a settlement or existing buildings (or needed with a countryside attraction), does not harm character or amenities, relates well to the highway and public transport where possible, has enough parking and landscaping, and takes nature conservation into account; in the Forest of Bowland Area of Outstanding Natural Beauty (now the Forest of Bowland National Landscape) proposals must also show a high standard of design and must not introduce built development into an area largely devoid of structures other than agriculture or forestry. Policy DMH3 says removing a condition that restricts occupation to tourism, visitor or holiday use will be refused unless the unit would meet an identified local or affordable housing need. Much of the borough lies in the Forest of Bowland National Landscape; it is not a National Park and Ribble Valley Borough Council remains the planning authority. The borough does not extend into Yorkshire Dales National Park.", ["https://www.ribblevalley.gov.uk/adopted-core-strategy/adopted-core-strategy-1", "https://www.ribblevalley.gov.uk/downloads/file/2331/adopted-ribble-valley-core-strategy-december-2014", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=265", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Ribble Valley does not charge a second homes premium. Unoccupied furnished homes that are nobody's main home get a 10% discount (the council's discounts page and its 2026-27 council tax leaflet both say so); a job-related second home can get a 50% discount instead. Policy and Finance Committee on 11 Nov 2025 agreed with the Budget Working Group's recommendation not to bring in the new second homes or empty homes premiums under the Levelling-up and Regeneration Act for 2026/27, and to keep the powers under review (the same recommendation was made for 2025/26). Empty and substantially unfurnished homes get a 100% discount for the first 6 months (up to 12 months if they need or are undergoing major repair or renovation); after that a full charge applies, and a change of owner does not restart the 6-month discount. Annexes occupied by a relative of the council-tax payer of the main dwelling can get a 50% discount. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.ribblevalley.gov.uk/council-tax/council-tax-discounts", "https://www.ribblevalley.gov.uk/downloads/file/4971/council-tax-leaflet-2026-2027", "https://ribblevalley.moderngov.co.uk/documents/s10516/Minutes%2011112025%20Policy%20and%20Finance.pdf", "https://ribblevalley.moderngov.co.uk/documents/s10317/111125%20council%20taxbase.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Southampton", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/southampton", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists 8 for Southampton City Council (checked 6 Nov 2026) — a city-wide Houses in Multiple Occupation direction in force since 23 Mar 2012, plus seven conservation-area directions that remove householder permitted development rights (The Avenue, Cranbury Place, Carlton Crescent, Uplands Estate, Portswood Residents' Gardens, Ethelburt Avenue and Oakmount Triangle). None are about holiday lets. Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan includes the Core Strategy (partial review adopted 13 Mar 2015) and the City Centre Action Plan. The Core Strategy supports significant new hotel and leisure development as part of city-centre growth and the Major Development Quarter; it does not set a separate holiday-let or self-catering policy for residential areas.", ["https://www.southampton.gov.uk/planning-building-control/planning/planning-policy/current-development-plan/", "https://www.southampton.gov.uk/media/io4midh4/amended-core-strategy-inc-cspr-final-13-03-2015_tcm63-371354.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=318", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Southampton charges a 100% premium on second homes (substantially furnished dwellings that are not anyone's sole or main residence), so the bill doubles. The council's empty properties page says Full Council agreed it on 6 Mar 2024, and the 2025-26 council tax explanatory notes confirm the 100% premium from 1 Apr 2025. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Where the law provides an exception, the council says it will apply it; check the empty properties page for the latest exception wording. Empty and substantially unfurnished homes have paid a premium after 1 year since 1 Apr 2024: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). There is no empty or second-home discount on a furnished empty home before the premium applies — full council tax is due from the date it became empty. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.southampton.gov.uk/emptyproperties/", "https://www.southampton.gov.uk/media/e2jnifbr/council-tax-explanatory-notes-2024-25-27022025v2.pdf", "https://www.southampton.
