condary letting £450 (1 to 2 guests), £550 (3 to 6), £720 (7 to 12), £1,000 (12 to 14); home sharing or letting £325, £420, £595, £865; variation £50, transfer £120. We have not found a 2026/27 schedule, so confirm the current fee with stl@westlothian.gov.uk before you pay. The council says there are no discounts for multiple properties.", ["https://westlothian.gov.uk/media/6420/Schedule-of-Fees-Charges-and-Contributions-2025-26/pdf/Fees__Charges_2025-26.pdf", "https://www.westlothian.gov.uk/article/75805/Short-Term-Lets"]]]}, {"n": "Inverclyde", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/inverclyde", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Inverclyde Council has no online form: complete the application form and checklist from its short-term lets policy page, plus the Scottish Fire and Rescue and Police Scotland checklists, and email them with copies of your documents to licensing.section@inverclyde.gov.uk (or post them to the Licensing Section, Municipal Buildings, Greenock). The same form is used for a new licence, a renewal or a variation. Pay the fee by card over the phone or by bank transfer, quoting the let's address. Display a site notice at or near the property for 21 days from the day you apply, then send the council a certificate of compliance with a copy of the notice. Police Scotland and Scottish Fire and Rescue are consulted. Licences and renewals are normally granted for three years, and the council has 9 months to decide a complete application.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.inverclyde.gov.uk/law-and-licensing/licensing/taxi-and-civic-licensing/civic-licensing/short-term-lets/policy-for-licensing-short-term-lets", "https://www.inverclyde.gov.uk/publications/short-term-lets-policy-statement?chapter=7"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). But Inverclyde asks you to contact its planning service (dmplanning@inverclyde.gov.uk) before you apply, to confirm whether you need planning permission or a certificate of lawful use. Where planning permission is needed and has not been obtained, the council can reject the licence application within 14 days (\"preliminary refusal\") with no refund.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.inverclyde.gov.uk/law-and-licensing/licensing/taxi-and-civic-licensing/civic-licensing/short-term-lets/policy-for-licensing-short-term-lets", "https://www.inverclyde.gov.uk/publications/short-term-lets-policy-statement?chapter=7"]], ["Visitor levy", "No levy. In June 2026 the Policy and Resources Committee agreed to monitor the national rollout of visitor levies before making any decision for Inverclyde. A council report estimated up to 178 chargeable rooms, with a 2.5% levy raising about £300k a year, which set-up and running costs could cancel out; informal engagement found most local businesses against a levy. The council is more interested in a possible cruise ship levy, which would need new law. Any Scottish levy needs at least 18 months' notice. Separately, from 1 April 2024 second homes pay a 100% premium (double the normal council tax).", ["https://www.inverclyde.gov.uk/news/2026/jun/council-to-monitor-national-visitor-levy-rollout", "https://www.inverclyde.gov.uk/council-and-government/council-tax/second-homes-long-term-empty-homes"]], ["Fees and council tax", "Fees from 1 April 2026, by maximum occupancy (4 or under / 5 or more). New licence: secondary letting £508 / £621; home letting or home sharing (or both) £311 / £396. Renewal: secondary letting £451 / £564; home letting or sharing £254 / £339. Variation £85 for any type. These figures are in the council's 2026 short-term lets fee list and its 2026/27 fees and charges booklet. Its short-term lets policy web page still shows the older table (secondary £450 / £550 new, £400 / £500 renewal; variation £75), so if in doubt confirm with licensing.section@inverclyde.gov.uk before you pay.", ["https://www.inverclyde.gov.uk/assets/attach/15462/2026-short-term-lets-fee-list.pdf", "https://www.inverclyde.gov.uk/council-and-government/finance/inverclyde-council-fees-and-charges-2026-27?chapter=7", "https://www.inverclyde.gov.uk/law-and-licensing/licensing/taxi-and-civic-licensing/civic-licensing/short-term-lets/policy-for-licensing-short-term-lets"]]]}, {"n": "Renfrewshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/renfrewshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply and pay online through Renfrewshire Council's MyAccount (electronic signatures accepted). A new application needs a plan of the accommodation (not to scale, showing what the policy requires), buildings insurance and public liability insurance, plus proof of right to work and a criminal record check; a provisional licence is also available. Display the council's notice at or near the premises for 21 days from the day you apply (objections close 28 days after you apply), then return the notice and a signed certificate of compliance. Police Scotland, Scottish Fire and Rescue, the local councillor, the community council and the council's planning team are consulted. If there is an objection, the Regulatory Functions Board decides and you can appeal to the Sheriff within 28 days. The council aims to consider applications within 3 months and decide within 9. A licence lasts three years; apply to renew at least 6 weeks before it expires, or it stops being valid. To change licence type you need a new application, not a variation. Questions go to licensing.cs@renfrewshire.gov.uk.", ["https://www.gov.scot/publications/short-term-lets/", "https://www1.renfrewshire.gov.uk/article/12823/Short-term-let-licence-for-residential-accommodation"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). You may still need planning permission depending on the property; Renfrewshire's planning team checks every application for relevant planning consents.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www1.renfrewshire.gov.uk/article/12823/Short-term-let-licence-for-residential-accommodation"]], ["Visitor levy", "No levy yet. On 17 September 2025 the Leadership Board authorised officers to begin formal stakeholder consultation and develop a visitor levy proposition, after an estimate that a 5% levy could raise about £2m a year before costs. We found no published consultation or scheme since (searched 24 Oct 2026). Any Scottish levy needs at least 18 months' notice. Separately, second homes pay a 100% Second Home Levy (a 100% premium, so double council tax), with no second homes discount since 1 April 2024. Purpose-built holiday homes and homes left empty for work-related accommodation may get a 50% discount instead.", ["https://renfrewshire.cmis.uk.com/renfrewshire/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=%2FuulpaJRqM5LxhNAd1aZl1paYQ8x9JjyuAKRrAqOHxLDbakE%2FV%2Bh5g%3D%3D&d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3D&FgPlIEJYlotS%2BYGoBi5olA%3D%3D=NHdURQburHA%3D&kCx1AnS9%2FpWZQ40DXFvdEw%3D%3D=hFflUdN3100%3D&mCTIbCubSFfXsDGW9IXnlg%3D%3D=hFflUdN3100%3D&rUzwRPf%2BZ3zd4E7Ikn8Lyw%3D%3D=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2FLUQzgA2uL5jNRG4jdQ%3D%3D&uJovDxwdjMPoYv%2BAJvYtyA%3D%3D=ctNJFf55vVA%3D&WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3D&WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3D", "https://www.renfrewshire.gov.uk/council-tax/council-tax-discounts-and-exemptions-based-situation/council-tax-discount-or-exemption-unoccupied-property"]], ["Fees and council tax", "Application fees from 1 April 2026, by bedrooms let (1 / 2 / 3 / 4 or more). Home letting, home sharing or both: £291 / £407 / £407 / £407. Secondary letting: £927 / £1,043 / £1,159 / £1,274. Provisional licence: home £189 / £264 / £264 / £264, secondary £603 / £678 / £754 / £829; confirming it then costs home £213 / £254 / £254 / £254, secondary £435 / £476 / £516 / £557. Temporary exemption £117, variation £117, material change of circumstances £117, transfer £89, certified duplicate or true copy £48, inspection after a complaint £156.87 an hour. Fees are not refunded if you are refused or withdraw. check with council The council does not publish a separate renewal fee, so confirm what you will pay to renew with licensing.cs@renfrewshire.gov.uk.", ["https://www1.renfrewshire.gov.uk/article/12823/Short-term-let-licence-for-residential-accommodation"]]]}, {"n": "East Renfrewshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/east-renfrewshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online to East Renfrewshire Council (the Private Sector Housing team runs the scheme). Read the council's checklists first: the online form cannot be saved part-way, and it takes one upload per evidence item (send extras to STL@eastrenfrewshire.gov.uk with the address and applicant name). All owners, day-to-day managers and the applicant go on one form, and the council checks title deeds. You get a provisional licence number, usually within 5 working days; once all documents and the fee are in, the council aims to decide within 28 days (the legal maximum is 9 months). Display the council's public notice at or near the property for 21 days from the day you apply (objections can be made for 28 days), then send the certificate of compliance to STL@eastrenfrewshire.gov.uk. Licences last up to 3 years. The council adds its own conditions to every first licence, covering hot tubs (a separate legionella risk assessment), antisocial behaviour, waste, key boxes and, for some flats, floor coverings and no arrivals or departures between 11pm and 7am. The council says it is revising its policy and portal, so for a transfer or a provisional licence for a new build, contact STL@eastrenfrewshire.gov.uk or 0141 577 8362.", ["https://www.gov.scot/publications/short-term-lets/", "https://eastrenfrewshire.gov.uk/short-term-lets", "https://eastrenfrewshire.gov.uk/stl-application", "https://eastrenfrewshire.gov.uk/media/8254/Short-term-lets-FAQs/pdf/Frequently_Answered_Questions_FAQs.pdf?m=1745595120000", "https://eastrenfrewshire.gov.uk/article/5413/Short-term-lets-Additional-licence-conditions"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). East Renfrewshire says it does not intend to bring in a control area because short-term letting is estimated to be low, and it keeps this under review. Check with the council's planning service before you apply, telling them how often and for how long you will let: the council can refuse to consider a licence application if the let would breach planning control.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://eastrenfrewshire.gov.uk/short-term-lets"]], ["Visitor levy", "No levy, and no proposal found (searched 24 Oct 2026). East Renfrewshire is not on the national list of approved schemes and was not among the councils consulting on or considering a levy in a July 2026 Herald survey. Any Scottish levy needs at least 18 months' notice. Separately, second homes pay a 100% council tax premium (double council tax): the council's empty property page says a second home may pay a 100% premium on top of the normal charge, and the council told the Scottish Government in its 2026-27 return that the premium has applied since 1 October 2024. The 10% second homes discount has ended.", ["https://visitorlevy.scot/visitorlevy/pages/levy-scheme", "https://www.heraldscotland.com/news/26405278.scotland-priced-out-20-councils-line-tourist-taxes/", "https://www.eastrenfrewshire.gov.uk/empty-property", "https://www.gov.scot/binaries/content/documents/govscot/publications/statistics/2019/04/council-tax-datasets/documents/second-homes-and-long-term-empty-policies-and-discounts/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/govscot%3Adocument/CTAS%2B2026%2B-%2BCouncil%2BTax%2BAssumptions%2B-%2BSecond%2Bhome%2Band%2BLTE%2Bpolicies%2Band%2Bdiscounts%2B2026-27.xlsx"]], ["Fees and council tax", "From the council's fee table (read 24 Oct 2026; the page does not say which year it covers), by bedrooms, for a licence of up to 3 years. Secondary let: new £972 (up to 2 bedrooms), rising £53.50 per extra bedroom to £1,293 (8 or more); renewal £805 to £1,126. Home letting, or home letting and home sharing: new £661 to £982; renewal £549 to £870. Home sharing: new £377 (1 bedroom) to £483.40 (5 bedrooms); renewal £313 to £421. Provisional licence for a new build from £972, transfer £155; a material change of circumstances costs the same as a new application. The full fee is paid when you apply and is not refunded. check with council The table shows £962 (not £982) for an 8+ bedroom home letting and home sharing licence, so confirm that fee with STL@eastrenfrewshire.gov.uk.", ["https://eastrenfrewshire.gov.uk/article/5412/Short-term-lets-fees", "https://eastrenfrewshire.gov.uk/media/8254/Short-term-lets-FAQs/pdf/Frequently_Answered_Questions_FAQs.pdf?m=1745595120000"]]]}, {"n": "South Lanarkshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/south-lanarkshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through South Lanarkshire Council's licensing portal, with the application checklist, the Scottish Fire and Rescue Service fire safety checklist, a copy of your EPC (where needed) and, for a new licence, eight copies of a layout plan showing escape routes, alarms, rooms, beds and occupancy. Police Scotland, Scottish Fire and Rescue, planning, building control, environmental services and housing are consulted, and local councillors are told. Once the council confirms your application is valid it sends you a site notice: display it at or near the property for 21 days, then sign the confirmation and return the whole notice to the Licensing and Registration Section (licensing@southlanarkshire.gov.uk). Objections go to the Licensing Committee. Licences last up to 3 years; apply to renew before yours expires and it carries on until the council decides (within 9 months). The council does not grant temporary exemptions. You can appeal to the Sheriff Court within 28 days. Fees are not refunded if you withdraw or are refused.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.southlanarkshire.gov.uk/business-licences-1/short-term-lets-scotland-%E2%80%93-licensing-scheme", "https://www.southlanarkshire.gov.uk/business-licences-1/short-term-lets-scotland-%E2%80%93-licensing-scheme/2", "https://www.southlanarkshire.gov.uk/downloads/download/1123/short-term-lets-policy-2025"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). South Lanarkshire's policy confirms there are no control areas in the council area, kept under review. Outside a control area a short-term let can still be a material change of use needing planning permission, decided case by case: speak to the planning service before you apply. If planning permission or a certificate of lawfulness is needed, it must go in with your licence application.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.southlanarkshire.gov.uk/downloads/download/1123/short-term-lets-policy-2025"]], ["Visitor levy", "No levy yet. In October 2025 the Executive Committee agreed to research and informally consult on a possible visitor levy, after being told a 2.5% to 7.5% levy could raise £800,000 to £2.5 million a year. Researchers working for the council surveyed accommodation providers until 17 August 2026, and findings with a refreshed tourism strategy are due to go to councillors before any formal consultation. We found no formal consultation or decision (searched 24 Oct 2026). Any Scottish levy needs at least 18 months' notice. Separately, the council's council tax page says second homes pay a 100% surcharge (200% council tax) from 1 April 2024.", ["https://www.dailyrecord.co.uk/in-your-area/lanarkshire/south-lanarkshire-explore-visitor-levy-36003209", "https://www.heraldscotland.com/news/26405278.scotland-priced-out-20-councils-line-tourist-taxes/", "https://www.linkedin.com/posts/toposophy_toposophy-southlanarkshirecouncil-tourismstrategy-activity-7490409603088670721-EAab", "https://www.southlanarkshire.gov.uk/household-1/council-tax-exemptions-discounts-increases-unoccupied-properties/2"]], ["Fees and council tax", "Fees from 1 April 2026, by maximum occupancy (1 to 2 / 3 to 6 / 7 to 10 / 11 or more guests). The same fee applies to a new application, a temporary licence, a renewal or a variation. Secondary letting: £381.43 / £572.14 / £699.29 / £953.58. Home letting, home sharing, or both: £317.86 / £476.79 / £572.14 / £794.65. Provisional licence £200 (on confirmation you pay the full fee minus the £200), transfer £200, material change £50.85, duplicate licence £31.78, inspection fee to be agreed. Fees are non-refundable.", ["https://www.southlanarkshire.gov.uk/business-licences-1/short-term-lets-scotland-%E2%80%93-licensing-scheme/3", "https://www.southlanarkshire.gov.uk/business-licences-1/short-term-lets-scotland-%E2%80%93-licensing-scheme/2"]]]}, {"n": "North Lanarkshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/north-lanarkshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Download North Lanarkshire Council's application pack (application form and guidance notes updated July 2026, site notice, certificate of compliance, mandatory conditions, the Scottish Fire and Rescue Service fire safety checklist and a legionella self-assessment form). Email the completed form and documents to PrivateSector@northlan.gov.uk, or post them to the Enterprise and Communities Built Environment Team (Short Term Lets), Station House, 950 Old Edinburgh Road, Bellshill ML4 3FG; call 01236 632 377 for a paper form or to pay electronically. You need a copy of your EPC (for a dwellinghouse) and floor plans, and the council returns incomplete applications. Each premises needs its own application. Every applicant gets a fit and proper person check with Police Scotland. Objections must be in writing within 28 days. Licences last 3 years; apply to renew before yours expires. The council publishes a register of licensed short-term lets (last updated 7 October 2026). Unlicensed lets are enforced by Police Scotland.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.northlanarkshire.gov.uk/housing/private-housing/short-term-lets-2022", "https://www.northlanarkshire.gov.uk/sites/default/files/2026-07/Short%20Term%20Lets%20Guidance%20Notes%20July26.docx"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). North Lanarkshire says licensing and planning are separate: some properties may need planning permission for a change of use, decided by its Planning Service, so check with planning before you let.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.northlanarkshire.gov.uk/housing/private-housing/short-term-lets-2022"]], ["Visitor levy", "No levy yet. A council working group is looking at whether a visitor levy is feasible, and consultants appointed in July 2026 are preparing a visitor strategy for 2027 to 2037 and a draft levy scheme for councillors to consider. A business survey closed on 28 September 2026. The council says a report will go to a future council meeting, which will decide whether to start public consultation. We found no consultation or decision (searched 25 Oct 2026). Any Scottish levy needs at least 18 months' notice. Separately, from 1 April 2024 second homes pay an extra 100% council tax levy (a 100% premium, so double council tax), decided by the council on 15 February 2024.", ["https://www.heraldscotland.com/news/26619472.north-lanarkshire-urged-pause-visitor-levy-plans/", "https://www.linkedin.com/posts/toposophy_toposophy-northlanarkshirecouncil-visitorstrategy-activity-7480237791230976000-mzYE", "https://www.northlanarkshire.gov.uk/council-tax/council-tax-changes-second-homes"]], ["Fees and council tax", "One fee for every licence type (secondary letting, home letting, home sharing, or both): £315 for up to 4 guests, £472.50 for 5 or more guests, for a 3-year licence. This is in the council's July 2026 guidance notes and on its short-term lets page (updated 7 October 2026). check with council The council does not publish a separate renewal fee, so confirm what you will pay to renew with PrivateSector@northlan.gov.uk.", ["https://www.northlanarkshire.gov.uk/housing/private-housing/short-term-lets-2022", "https://www.northlanarkshire.gov.uk/sites/default/files/2026-07/Short%20Term%20Lets%20Guidance%20Notes%20July26.docx"]]]}, {"n": "East Dunbartonshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/east-dunbartonshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Email the application form, the checklist and copies of all evidence to STL@eastdunbarton.gov.uk, or post them to the Homelessness and Prevention Team, Kirkintilloch Community Hub, 2-4 West High Street, Kirkintilloch G66 1AD (the form, template site notice and certificate of compliance are in the appendices of the council's short-term lets policy; you can also ask for them on 0300 123 4510). Display the site notice at or near the property for 21 days from the day you apply, then send the certificate of compliance. Police Scotland and the Scottish Fire and Rescue Service are consulted and the council may visit; it may ask for a floor plan showing room sizes and escape routes. The council aims to decide within 21 days of the consultation period ending. Objections go to the Housing Appeals Board. Licences last up to 3 years, and a licence carries on while a renewal is decided. The council does not grant temporary exemptions or temporary licences. You can appeal a refusal within 28 days.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.eastdunbarton.gov.uk/services/a-z-of-services/housing-properties/short-term-lets-policy/"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Ordinary planning rules still apply: a short-term let can be a material change of use needing planning permission, so check with the council's planning service. If a licence is refused because you need planning permission, the council will not charge again for an application resubmitted within 28 days of planning permission being granted, provided you applied for planning without undue delay.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.eastdunbarton.gov.uk/services/a-z-of-services/housing-properties/short-term-lets-policy/"]], ["Visitor levy", "No levy. In summer 2026 councillors agreed unanimously, on the council leader's motion, not to bring in a visitor levy, before any formal consultation (reported 2 Jul 2026). A report had estimated a 5% levy could raise about £500,000 a year, or about £320,000 after running costs, and said local businesses who gave early feedback were opposed. Any future scheme would need consultation and at least 18 months' notice. Separately, from 1 October 2026 second homes may pay a 200% council tax premium (council tax tripled).", ["https://www.glasgowtimes.co.uk/news/26249383.east-dunbartonshire-council-vote-tourist-tax-levy/", "https://www.eastdunbarton.gov.uk/services/a-z-of-services/council-tax/premium-on-long-term-empty-homes-and-second-homes/", "https://www.gov.scot/binaries/content/documents/govscot/publications/statistics/2019/04/council-tax-datasets/documents/second-homes-and-long-term-empty-policies-and-discounts/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/govscot%3Adocument/CTAS%2B2026%2B-%2BCouncil%2BTax%2BAssumptions%2B-%2BSecond%2Bhome%2Band%2BLTE%2Bpolicies%2Band%2Bdiscounts%2B2026-27.xlsx"]], ["Fees and council tax", "One fee for a 3-year licence, the same for a new application or a renewal. Secondary letting £594 for up to 10 guests, plus £55 for every extra five guests (so £649 for 11 to 15). Home letting, or home letting and home sharing, £495 for up to 10 guests, plus £55 for every extra five. Home sharing £275 per room. Fees are not refunded if you are refused. The policy page does not say which year these fees apply from.", ["https://www.eastdunbarton.gov.uk/services/a-z-of-services/housing-properties/short-term-lets-policy/"]]]}, {"n": "Monmouthshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/monmouthshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. Part of the county is in Bannau Brycheiniog (Brecon Beacons) National Park, where the park authority handles planning.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, confirmed unchanged for 2026/27 at Full Council on 5 Mar 2026. It applies to furnished homes where nobody lives or the owner has a main home elsewhere. Useful for holiday lets: the council also made a local exception so a property moving from business rates to council tax is free of the second-home premium for 12 months (standard council tax is still payable). Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). In 2025/26, 387 homes were liable for the premium and 273 were billed after exceptions.", ["https://www.monmouthshire.gov.uk/council-tax-premiums-for-long-term-empty-properties-and-second-homes/", "https://democracy.monmouthshire.gov.uk/documents/s44679/3.%2020260305%20Council%20-%20Council%20Tax%20Resolution%20and%20Budget%20report%202026-27%20Final.pdf"]]]}, {"n": "Vale of Glamorgan", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/vale-of-glamorgan", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. The council's Nov 2025 housing market paper on second and holiday homes found their numbers low and did not propose a local planning policy for them.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, reaffirmed by Cabinet on 18 Dec 2025 and set by Council on 9 Mar 2026 for 2026/27. It applies to furnished homes that are not anyone's sole or main residence. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). The Vale also lists Class 7 (job-related homes). Apply for an exception through the council's online Council Tax Enquiry form and upload evidence. The council gives no discount on empty homes, and long-term empty homes pay a 100% to 200% premium depending on how long they have been empty.", ["https://www.valeofglamorgan.gov.uk/en/our_council/council_tax/Council-Tax.aspx", "https://www.valeofglamorgan.gov.uk/Documents/_Committee%20Reports/Cabinet/2025/25-12-18/Premiums-Long-Term-Empty-Properties-and-Second-Homes.pdf", "https://www.valeofglamorgan.gov.uk/Documents/Our%20Council/Council%20Tax%20&%20Benefits/2026-27/EN-Council-Tax-Explanatory-Notes-20262027.pdf", "https://valeofglamorgan.oc2.uk/docfiles/63/BP10C%20LHMA%20Second%20and%20Holiday%20Homes.pdf"]]]}, {"n": "Wrexham", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/wrexham", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 50% on top of the standard charge (so 150% in total), the rate Wrexham has charged since 1 Apr 2017 and still in its 2026/27 tax base. That is lower than most Welsh councils that charge a premium. Long-term empty homes pay far more: 200% premium (300% bill) from 1 Apr 2025, or 250% (350% bill) once empty for 4 years or more. A second home is a furnished home that is not anyone's sole or main residence. Exceptions include homes marketed for sale or let (one year only), annexes, armed forces homes, occupied caravan pitches and boat moorings, seasonal homes where year-round occupation is not allowed (for example by a planning condition), and job-related homes. The 2026/27 tax base counted 71 homes paying the second-home premium.", ["https://www.wrexham.gov.uk/service/empty-and-second-home-premium", "https://www.wrexham.gov.uk/sites/default/files/2025-12/cofi4525-setting-the-council-tax-base-2026-27.pdf"]]]}, {"n": "Flintshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/flintshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2023 (Council decision 13 Dec 2022), kept for 2026/27 when Council set the tax on 24 Feb 2026. It applies to substantially furnished homes that are not anyone's sole or main residence, and Flintshire gives no discount on second homes. Long-term empty homes pay a 100% premium after one year, rising from Apr 2026 to 150% after 3 years, 200% after 5 years and 300% after 10 years. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Class 7 (job-related homes) and Classes 1 to 4 (marketed for sale or let for up to a year, annexes, armed forces) also apply.", ["https://www.flintshire.gov.uk/en/Resident/Council-Tax-and-Benefits-and-Grants/Council-Tax.aspx", "https://committeemeetings.flintshire.gov.uk/ieDecisionDetails.aspx?AIId=32855&LLL=0", "https://committeemeetings.flintshire.gov.uk/ieDecisionDetails.aspx?AIId=26211&LLL=0"]]]}, {"n": "Bridgend", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/bridgend", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 200% on top of the standard charge (so a bill of 300%, triple the normal amount) from 1 Apr 2026. Council decided on 20 Sep 2023 to start a 100% premium on second homes from 1 Apr 2024 and raise it to 200% after two years, which makes Bridgend one of the highest-charging councils in Wales. It applies to substantially furnished homes that are not anyone's sole or main home. Long-term empty homes (empty and unfurnished for a year) have paid a premium since 1 Apr 2023, also rising after two years. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition prevents year-round or main-residence use, or limits the home to holiday letting) and Class 7 (job-related homes). Claim an exception by emailing premiums@bridgend.gov.uk. The council collected about £161,000 from the second-home premium in 2025/26. A 2022 planning report found no obvious local concentration of second homes or short-term lets, but noted the Porthcawl Waterfront redevelopment could justify limits later.", ["https://www.bridgend.gov.uk/residents/council-tax/council-tax-premiums-for-long-term-empty-properties-and-second-homes/", "https://democratic.bridgend.gov.uk/documents/s37465/COSC27Jan26ResponsestoRecommendationsandRequests.docx.pdf", "https://democratic.bridgend.gov.uk/documents/s29127/UCO%20GPDO%20report%20appxs.pdf"]]]}, {"n": "Newport", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/newport", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, still charged in 2026/27. The council says this can include short-term holiday lets that pay council tax rather than business rates. Long-term empty homes (empty and unfurnished for a year or more) have paid a 100% premium since 1 Apr 2024, and Newport gives no discount on empty unfurnished homes. Exceptions: Class 1 (marketed for sale, one year only), Class 2 (marketed for a let of at least 6 months, one year only; holiday lets and Airbnb short lets do not count), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition restricts occupancy for at least 28 days a year, limits the home to holiday letting, or prevents main-residence use) and Class 7 (job-related homes provided by an employer). Your bill shows if the premium applies.", ["https://www.newport.gov.uk/council-tax/council-tax-premiums", "https://www.newport.gov.uk/sites/default/files/media/media-documents/Council-tax-and-non-domestic-rates-2026-27.pdf"]]]}, {"n": "Neath Port Talbot", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/neath-port-talbot", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, still charged in 2026/27 (2026/27 tax base report). Long-term empty homes (empty and unfurnished for a year) pay the same 100% premium. Holiday-let owners should know about local exception D, added from 1 Apr 2026: if a self-catering property is moved off the business rates list onto council tax because it no longer meets the letting criteria, the council can waive the premium for 6 months from the date it was moved, giving time to appeal to the Valuation Office or decide what to do with the property (the move is usually backdated, which otherwise means a large backdated premium). Apply by calling the Council Tax Team on 01639 686188, option 2. Local exception C gives 6 months without the premium when a home is left empty after a parent or step-parent dies. National exceptions: Class 1 and 2 (marketed for sale, or for a let of at least 6 months, one year only; holiday lets and Airbnb short lets do not count), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition restricts occupancy for at least 28 days a year, limits the home to holiday letting, or prevents main-residence use) and Class 7 (job-related homes).", ["https://www.npt.gov.uk/council-tax/premiums-for-empty-properties-and-second-homes/", "https://democracy.npt.gov.uk/documents/s112460/SCMDPR190326-Council%20Tax%20Premium%20Exceptions%20NEW.pdf", "https://democracy.npt.gov.uk/documents/s109751/Urgent%20-%20Council%20Tax%20Base%202026-27.pdf"]]]}, {"n": "Rhondda Cynon Taf", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/rhondda-cynon-taf", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies. In a 2023 Freedom of Information reply the council said there are no specific local restrictions on short-term lets beyond the national rules.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets", "https://www.whatdotheyknow.com/request/planning_requirements_for_short_317"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, agreed by the council in January 2023 and still shown in the council's current council tax guide. It applies to homes that are not anyone's sole or main residence and are substantially furnished. Long-term empty homes (empty and unfurnished for a year) have paid a premium since 1 Apr 2023: from 1 Apr 2025 that is 100% after 1 to 3 years and 200% after more than 3 years. Exceptions: Class 1 and 2 (marketed for sale, or for a let of at least 6 months, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (a planning condition prevents year-round or main-residence use, or limits the home to holiday letting) and Class 7 (job-related homes). Apply for an exception through the council's premiums page. The council says the number of second homes paying the premium rose from 491 on 1 Apr 2023 to 647 by 31 Mar 2024.", ["https://www.rctcbc.gov.uk/EN/Resident/CouncilTax/CouncilTaxPremiums.aspx", "https://www.rctcbc.gov.uk/en/resident/counciltax/relateddocuments/counciltaxbooklet.pdf"]]]}, {"n": "Caerphilly", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/caerphilly", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control on second homes or short-term lets found (checked 25 Oct 2026). The council's three Article 4 directions (Bute Town and Rhymney Town in Rhymney, and Pontywaun Garden Suburbs in Crosskeys) protect the look of conservation areas, such as windows, roofs and front walls, and do not cover changes of use. Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets", "https://www.caerphilly.gov.uk/services/planning-and-building-control/conservation-of-the-built-environment/article-4-direction"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2025, agreed by Cabinet on 20 Mar 2024 and full Council on 27 Mar 2024, and still charged in 2026/27 (the council's 2026/27 return to the Welsh Government shows 175 second homes paying the 100% premium). It applies to homes that are not anyone's sole or main residence and are substantially furnished. Long-term empty homes (empty and unfurnished) pay nothing extra until they have been empty for 2 years: then 100%, rising to 200% after 3 years and 300% after 5 years. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (seasonal homes where year-round occupation is prohibited) and Class 7 (job-related homes). The council lists no local exception for holiday lets moving from business rates to council tax (checked 25 Oct 2026). To claim an exception, email premiums@caerphilly.gov.uk with evidence, such as an estate agent's agreement and listing link, or a planning reference number for annexes or homes with planning restrictions.", ["https://beta.caerphilly.gov.uk/council-tax-premiums", "https://www.southwalesargus.co.uk/news/24216271.caerphilly-council-order-tax-premiums-empty-properties/", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx"]]]}, {"n": "Torfaen", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/torfaen", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. No council tax second-home premium: Torfaen is one of only two Welsh councils not charging one in 2026/27 (Welsh Government council tax dwellings return: 0 homes on any premium in Torfaen), and it does not charge a long-term empty premium either. The council says it is considering premiums on second homes and long-term empty homes, is reviewing how many properties would be affected, and that any decision would need public consultation and councillors' approval. Its stated approach for now is to help owners bring empty homes back into use rather than charge a premium. A council's first decision to charge a second-home premium must be made at least a year before the financial year it starts, so check the council's page before buying. Second homes and empty homes get no council tax discount, so a furnished holiday let on council tax pays the standard bill (2026/27 bill notes).", ["https://www.torfaen.gov.uk/en/council-tax-benefits-and-money/council-tax/council-tax-premiums-for-long-term-empty-properties-and-second-homes", "https://www.torfaen.gov.uk/asset-library/en/council-tax/council-tax-explanatory-notes.pdf", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx", "https://www.whatdotheyknow.com/request/freedom_of_information_request_c_1809"]]]}, {"n": "Blaenau Gwent", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/blaenau-gwent", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: UNVERIFIED for 2026/27, because the sources disagree. The council's premiums page says a 100% second-home premium (so a double bill) starts on 1 Apr 2026 for homes that are nobody's sole or main residence and are substantially furnished. But the council's own 2026/27 return to the Welsh Government shows no second homes paying a premium, and GOV.WALES says only 20 of the 22 Welsh councils charge one in 2026/27. Ask the council (Premiums@blaenau-gwent.gov.uk, 01495 363900) which applies before you budget. Long-term empty homes (empty and unfurnished for over 12 months) have paid a premium since 1 Apr 2025: 100% after 1 to 2 years, 200% after 2 to 3 years and 300% after more than 3 years, ignoring any time empty before 1 Apr 2024. Exceptions: Class 1 and 2 (marketed for sale or let, one year only), Class 3 (annexes), Class 4 (armed forces), Class 5 (occupied caravan pitches and boat moorings), Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited) and Class 7 (job-related homes), plus local exceptions for long-term empty homes only (new buyers for up to 12 months, awaiting an empty-property grant or loan, complex legal issues, awaiting planning permission, and some mixed-use buildings). Apply with the council's premium exception form.", ["https://blaenau-gwent.gov.uk/en/resident/council-tax/council-tax-premium-for-long-term-empty-property", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx"]]]}, {"n": "Merthyr Tydfil", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/merthyr-tydfil", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 25 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) since 1 Apr 2024, kept for 2025/26 (full Council, 6 Nov 2024) and for 2026/27 (full Council, 11 Feb 2026, as reported by Nation.Cymru). The council's 2026/27 return to the Welsh Government shows 171 second homes paying the 100% premium. It applies to homes that are substantially furnished and are not the owner's or occupier's sole or main residence. Long-term empty homes: exempt for the first 6 months after becoming unfurnished, then the full charge, then a premium once empty for over a year: 100% (1 to 5 years), 150% (5 to 10 years) and 200% (over 10 years). Exceptions: Classes 1 to 7 (marketed for sale or let, one year only; annexes; armed forces; occupied caravan pitches and boat moorings; a planning condition stops year-round occupation or limits the home to holiday use; job-related homes), plus local Class 8 (new owners bringing a property back into use, and mixed-use buildings) and, from 1 Apr 2025, Class 9 (ongoing renovation, up to 6 months). Contact revenues@merthyr.gov.uk or 01685 725000. Band D for 2026/27 is £2,591.47 (£2,625.36 in Trelewis and Bedlinog).", ["https://www.merthyr.gov.uk/resident/council-tax/council-tax-premiums/", "https://nation.cymru/news/council-to-continue-charging-higher-council-tax-on-second-homes/", "https://gov.wales/sites/default/files/statistics-and-research/2026-01/council-tax-dwellings-april-2026-to-march-2027-864105.xlsx", "https://www.merthyr.gov.uk/resident/council-tax/council-tax-bands-and-charges/"]]]}, {"n": "Torridge", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/torridge", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Torridge has Article 4 directions in some conservation areas, but these control building alterations, not holiday-let use. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council agreed in principle on 5 Sep 2022 to charge a 100% second homes premium, and voted on 22 Jan 2024 to bring it in, so from 1 Apr 2025 homes that are substantially furnished and nobody's main home pay 200% council tax (no premium was charged before). The council updated its Empty Homes and Second Home Premium Policy in 2025 to follow the national exceptions. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Empty and unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If the use of your property changes, the council asks for evidence, and you must tell it about a change in circumstances within 21 days or risk a £70 penalty. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.torridge.gov.uk/article/19942/Empty-and-Exempt-Properties", "https://www.torridge.gov.uk/article/22102/Change-to-Council-Tax-Charge-for-Second-Homeowners-from-1st-April-2025", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Lindsey", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-lindsey", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. East Lindsey's Article 4 directions cover changes to the appearance of homes in conservation areas (windows, doors, porches, roofs), not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.e-lindsey.gov.uk/article/6141/Article-4-Directions-and-Local-Development-Orders"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Council approved a 100% premium on second homes and furnished homes not used as anyone's main home on 28 Feb 2024, so from 1 Apr 2025 the charge is 200%. The council published notice in the local press in Mar 2024 and wrote to owners it thought were affected in Nov and Dec 2024. The premium is added automatically to your bill, which you can still pay in 10 or 12 instalments. Permanent exceptions it lists: armed forces accommodation, annexes to a main home, job-related homes, caravan pitches and boat moorings, and homes where a planning restriction prevents occupation. Up to 12 months: marketed for sale, marketed for let, probate granted in the last 12 months, and major repairs or structural alterations. Claim using the council's second home/furnished property review form, with evidence. Empty and unfurnished homes pay a premium once empty for 2 years: 100% (2 years), 200% (5 years) and 300% (10 years). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.e-lindsey.gov.uk/article/27747/Council-Tax-Additional-Charges", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Cotswold", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cotswold", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 25 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. Cotswold has Article 4 directions in several villages (including Bibury, Bourton-on-the-Water, Chipping Campden, Mickleton and South Cerney) and on some individual sites. They remove permitted development rights for things like house alterations and some land uses, not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.cotswold.gov.uk/planning-and-building/planning-policy/article-3-and-4-directions/"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council voted unanimously on 20 Mar 2024 to charge an extra 100% premium on second homes (furnished, nobody's main home), so from 1 Apr 2025 the bill is 200% (the council gave the required one year's notice). The council says the exceptions are part of its adopted policy. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). A general second home that can be used all year round with no planning restriction pays the premium. The council's second homes page does not give a claim form for exceptions, so contact its council tax team with evidence. Empty and unfurnished homes have paid a premium since 1 Apr 2024 once empty for 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If you think your property is a holiday let rather than a second home, the council says you keep paying council tax until the Valuation Office Agency moves it to the business rates list. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.cotswold.gov.uk/council-tax-and-benefits/second-homes/", "https://news.cotswold.gov.uk/news/council-clamps-down-on-empty-and-second-homes-to-help-tackle-housing-crisis", "https://www.cotswold.gov.uk/council-tax-and-benefits/council-tax-discounts-and-exemptions/reductions-for-empty-properties/council-tax-on-long-term-empty-properties/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 25 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. The national planning data register lists no Article 4 directions for East Devon. In a June 2023 report on the government's short-let consultation, council officers said the council did not have robust evidence on where short-term lets cause problems, which an Article 4 direction would need.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://democracy.eastdevon.gov.uk/documents/s20327/Response%20to%20government%20consultation%20on%20Short%20Term%20Lets%20V4.pdf"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 21 Feb 2024 Full Council approved Cabinet's recommendation (31 Jan 2024) to charge a 100% premium on homes that are unoccupied but substantially furnished, so second and holiday homes pay 200% council tax from 1 Apr 2025. The council agreed to ringfence its share of the extra money for housing and to review this in 2029. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). For the 12-month sale and letting exceptions, the council uses the date the home was first marketed, not the latest. Apply online for a premium exception with evidence (for example the sale or letting listing and the date first marketed, proof that it is an annexe, or the planning reference for a planning restriction). The council may visit to check, and you must tell it about any change within 21 days. Empty and unfurnished homes have paid a premium since 1 Apr 2024 once empty for 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (more than 10 years). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://eastdevon.gov.uk/council-tax/council-tax-discounts-and-exemptions-information/secondholiday-homes/", "https://democracy.eastdevon.gov.uk/documents/g2215/Printed%20minutes%2021st-Feb-2024%2018.00%20Council.pdf?T=1", "https://eastdevon.gov.uk/council-tax/apply-for-or-cancel-a-premium-exception/", "https://eastdevon.gov.uk/council-tax/council-tax-discounts-and-exemptions-information/empty-property-discounts/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Torbay", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/torbay", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 26 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding. The national planning data register lists two Article 4 directions for Torbay, in the Churston (1998) and Polsham (2002) conservation areas. They cover building works in those areas, not holiday-let use.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=344"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council confirmed on 8 Dec 2022 that it intended to charge a premium on second homes, and on 5 Dec 2024 adopted a 100% premium from 1 Apr 2025, so homes that are furnished and nobody's main home pay 200%. The 2026/27 council tax base still includes the premium. Torbay has no extra local exceptions, only the national ones. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). For Class L the council asks for a copy of the planning condition or the planning reference. Instead of extra exceptions, the council can give a discretionary reduction for exceptional personal circumstances; a June 2026 review report said only a couple of people had applied and none had been granted, and recommended keeping the premiums as they are. Empty and unfurnished homes pay a 100% premium after 1 year (since 1 Apr 2024), 200% after 5 years and 300% after 10 years. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 month
