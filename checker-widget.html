ess rates, and you keep paying council tax as a second home until it does. If it moves, you need to arrange a trade waste collection. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.westmorlandandfurness.gov.uk/council-tax/second-homes-and-empty-homes/council-tax-second-homes", "https://www.westmorlandandfurness.gov.uk/news/2024/westmorland-and-furness-council-protects-front-line-services-tough-financial-times-0", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Cumberland", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cumberland", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found on the council site (checked 23 Oct 2026). Planning is decided case by case; inside the Lake District National Park, the park authority handles planning. Check before converting a home or outbuilding.", []], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 6 Mar 2024 the council adopted a 100% premium on furnished homes that are nobody's main home, so 200% council tax is payable from 1 Apr 2025 (before then, second homes paid 100%). Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). You must apply for an exception, and apply in the area where the second home is. For the marketing exception, the same owner can only use the sale exception once, and the letting exception again only after the home has been let for at least six months in a row. A job-related second home may get a 50% discount. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.cumberland.gov.uk/council-tax/empty-properties-and-second-homes/second-homes-and-how-apply-exception-council-tax-second-home-premium", "https://www.cumberland.gov.uk/news/2025/council-agrees-budget-investing-communities-and-services", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "North Norfolk", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/north-norfolk", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in the Broads, where the Broads Authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025, a 100% premium applies to second homes (furnished, nobody's main home), so owners pay double. The council decided this on 22 Nov 2023 and confirmed it at Full Council in Jan and Feb 2025. The council says holiday lets that are not on the business rates list (because they don't meet the holiday let criteria) pay council tax as a second home and may pay the premium; holiday lets on the business rates list do not. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.north-norfolk.gov.uk/tasks/council-tax/council-tax-premium-for-second-homes", "https://modgov.north-norfolk.gov.uk/mgAi.aspx?ID=13114", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Dorset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/dorset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Dorset Council agreed at its Feb 2024 budget meeting to charge a 100% premium on second homes (furnished, nobody's only or main home) from 1 Apr 2025, so 200% council tax. The premium applies from day one; there is no minimum period as a second home. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply for an exception with evidence to secondhomes@dorsetcouncil.gov.uk and keep paying your bill while it is considered. The council also considers hardship reductions under s13A. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.dorsetcouncil.gov.uk/w/council-tax/second-homes", "https://www.dorsetcouncil.gov.uk/w/your-bill-explained-2025-26", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "South Hams", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/south-hams", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Dartmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: a 100% premium is added automatically to second homes from 1 Apr 2025 (public notice given 2 Mar 2024), so 200% council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). South Hams also set local discretionary exceptions for 2025-26 (for example agricultural occupancy conditions, and staff accommodation used to run a business); apply with evidence through the council's online form. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.southhams.gov.uk/council-tax/empty-properties-and-second-homes", "https://www.southhams.gov.uk/sites/default/files/2025-02/SH%20Guidance%20on%20discretionary%20exceptions%20to%20Council%20Tax%20premiums.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "North Devon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/north-devon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in Exmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council decided on 17 Jan 2024 to charge a 100% second homes premium (twice the standard rate) from 1 Apr 2025, including furnished homes with a planning restriction on occupation unless an exception applies. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). You can apply for an exception online through the council. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.northdevon.gov.uk/council-tax/charges-for-second-homes-and-empty-properties", "https://www.northdevon.gov.uk/sites/default/files/2025-03/North%20Devon%20Council%20Tax%20empty%20homes%20and%20second%20homes%20premiums%20policy%202025.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Isle of Wight", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/isle-of-wight", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (checked 23 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: the council adopted the power in Feb 2024 and charges a 100% premium on furnished second homes from 1 Apr 2025 (200% in total). Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply using the council's Empty and Second Home Review Form, with the evidence it asks for (for example the planning condition for a holiday-only home). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.iow.gov.uk/article/1100/Second-home-premium", "https://www.iow.gov.uk/media/2786/Empty-and-second-home-review-form/pdf/5516CORP_Empty_and_second_homes_form_-_Feb_2025.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Denbighshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/denbighshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 150% on top of the standard charge (250% in total) since 1 Apr 2025 (100% from 1 Apr 2024). Full Council on 8 Jul 2025 agreed to keep 150% for second homes from 1 Apr 2026. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition).", ["https://www.denbighshire.gov.uk/en/council-tax/premium.aspx"]]]}, {"n": "Carmarthenshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/carmarthenshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) for all second homes from 1 Apr 2025 (50% from 1 Apr 2024, approved by Council on 8 Mar 2023). Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Ask about exceptions at counciltaxpremium@carmarthenshire.gov.uk.", ["https://www.carmarthenshire.gov.wales/council-services/council-tax/council-tax-premiums/"]]]}, {"n": "Swansea", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/swansea", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register · What the licensing Act will require.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://www.gov.wales/licensing-visitor-accommodation-wales", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double), in place since 1 Apr 2021. It applies to any home that is furnished and nobody's sole or main residence. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Swansea notes the marketed-for-let exception (Class 2) is for tenancies of at least 6 months, not holiday or Airbnb lets. Send evidence to council.tax@swansea.gov.uk.", ["https://www.swansea.gov.uk/counciltaxpremiums"]]]}, {"n": "Falkirk", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/falkirk", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Falkirk Council takes applications using its short-term let application pack (Licensing Board: licensing@falkirk.gov.uk, 01324 501575). The council publishes a public register of short-term let licences.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.falkirk.gov.uk/businesses-premises-venues-licenses/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Check whether your let needs planning permission anyway; Falkirk links to a separate short-term lets planning page from its licensing page.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.falkirk.gov.uk/businesses-premises-venues-licenses/short-term-lets"]], ["Visitor levy", "Not approved. Formal consultation on a draft scheme runs from 2 Sep to 25 Nov 2026: 5% of the cost of overnight accommodation only (not food, parking or other extras), with providers proposed to keep 2%. The council says it has not decided, and full Council is expected to consider it in January 2027 (the consultation page says early 2027). Any Scottish levy needs at least 18 months' notice before it starts. Separately, second homes pay a 100% levy (a 100% premium, so 200% council tax) from 1 January 2025, agreed by the Executive Committee on 22 August 2024.", ["https://www.falkirk.gov.uk/visitor-levy/the-levy", "https://fcwebsites.blob.core.windows.net/www/media/e2c569be-f9a8-4fb3-8090-b97aae41bafd/Frequently-Asked-Questions-FAQs-Falkirk-Council-Draft-Visitor-Levy-Scheme.pdf", "https://www.visitscotland.org/tourism-events-industry/visitor-levy", "https://www.falkirk.gov.uk/council-tax/council-tax-discount-exemptions-additional-charges"]], ["Fees and council tax", "From the council's published 2025/26 fee table (the latest short-term let table we found; check for a 2026/27 update). The same fee applies to new, renewal and temporary applications. Secondary letting: £315 (up to 4 guests) / £504 (5 or more). Home letting, home sharing, or both: £157.50 / £315. Paid as 20% at provisional grant and 80% at confirmation. Transfer £105.", ["https://www.falkirk.gov.uk/licensing-fees-and-charges/licensing-fees-and-charges/short-term-lets-licensing-scheme"]]]}, {"n": "Orkney Islands", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/orkney-islands", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through Orkney Islands Council: guidance notes, application form, floor and location plans, and a separate Scottish Fire and Rescue Service fire safety checklist. You display a notice at the property (28-day objection period) only when the council asks you to. The council publishes a register of licences.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.orkney.gov.uk/business-and-licensing/licensing-information-and-applications/short-term-lets-licensing"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. The council's Policy and Resources Committee decided on 23 Sep 2025 not to go ahead with an overnight visitor levy \"at this time\", after a feasibility study with Shetland and the Western Isles found strong local opposition, practical problems and marginal returns. The council prefers a cruise ship or point-of-entry levy, which the current law does not allow. Separately, from 1 April 2024 second homes pay a 100% council tax surcharge (shown on the bill as Second Home Premium). North Isles residents who need a second home on the Orkney mainland for work may get a 50% discount instead.", ["https://www.orkney.gov.uk/latest-news/orkney-islands-council-decides-against-overnight-visitor-levy", "https://www.orkney.gov.uk/benefits-council-tax-and-money/council-tax/empty-properties-and-second-homes", "https://www.gov.scot/binaries/content/documents/govscot/publications/statistics/2019/04/council-tax-datasets/documents/second-homes-and-long-term-empty-policies-and-discounts/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/govscot%3Adocument/CTAS%2B2026%2B-%2BCouncil%2BTax%2BAssumptions%2B-%2BSecond%2Bhome%2Band%2BLTE%2Bpolicies%2Band%2Bdiscounts%2B2026-27.xlsx"]], ["Fees and council tax", "3-year licence, 2026/27 fees (3.8% up on 2025/26). Secondary letting: £354 (up to 4 guests), £434 (5 to 9), £583 (10 or more). Home sharing and home letting: £275 / £343 / £457. Non-linked isles get 25% off: secondary £266 / £326 / £437, home sharing and letting £206 / £257 / £343. Temporary licence (up to 6 weeks) £275 (£206 non-linked isles), transfer £138 (£103). The first £275 of each application fee is non-refundable.", ["https://www.orkney.gov.uk/business-and-licensing/licensing-information-and-applications/short-term-lets-licensing"]]]}, {"n": "Shetland Islands", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/shetland-islands", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Shetland Islands Council's Environmental Health team runs the scheme: apply through the council's online portal, by email to stl@shetland.gov.uk, or by post to Environmental Health, Gutters' Hut, 7 North Ness, Lerwick ZE1 0LZ. Fees are non-refundable whether or not a licence is granted.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.shetland.gov.uk/stl", "https://www.shetland.gov.uk/downloads/file/6364/short-term-lets-licensing-policy"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. Councillors on the Policy and Resources Committee decided against an overnight visitor levy in September 2025 after a feasibility study said the risks outweighed the benefits. The council has been looking at a point-of-entry levy instead, which would need new law. Separately, from 1 April 2024 second homes pay a 100% supplement (a 100% premium, so 200% council tax) instead of the old 10% discount. A purpose-built holiday home that cannot be used all year may get a 50% discount.", ["https://www.bbc.com/news/articles/cj6xrkd3l9ro", "https://www.orkney.gov.uk/latest-news/orkney-islands-council-decides-against-overnight-visitor-levy", "https://www.shetland.gov.uk/council-tax/discounts-exemptions/2"]], ["Fees and council tax", "2026/27 fees, now set by guest numbers rather than bedrooms. Home sharing or home letting: £210 (1 to 6 guests) / £335 (7 or more). Secondary letting: £370 / £530. Admin fee £37. From the council's 2026-27 Environmental Health charges schedule (shetland.gov.uk blocked our direct check, so read via a search index of the official file on 24 Oct 2026).", ["https://www.shetland.gov.uk/downloads/file/7747/environmental-health-charges"]]]}, {"n": "Na h-Eileanan Siar (Western Isles)", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/na-h-eileanan-siar", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Comhairle nan Eilean Siar short-term lets pages: send the completed application and fee to stl@cne-siar.gov.uk, any Comhairle office, or by post to Stornoway. Submit renewals, with everything needed, about 3 months before your licence expires; if a complete renewal is not in before expiry you count as a new operator and cannot take bookings or guests until licensed.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.cne-siar.gov.uk/stl"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. The Comhairle has paused detailed work on an accommodation-based visitor levy, citing challenges for island businesses, and is looking at other options for funding tourism. It says any formal proposal would be consulted on before councillors consider it. Separately, the council's 2026-27 council tax leaflet says a second home pays an extra charge that doubles council tax (a 100% premium). On 24 February 2026 the Comhairle agreed in principle to increase the additional levy on second and long-term empty homes to 225%. UNVERIFIED We could not confirm when, or whether, the higher levy applies, so check your bill.", ["https://www.cne-siar.gov.uk/business/tourism/outer-hebrides-visitor-levy/latest-information", "https://www.cne-siar.gov.uk/business/tourism/outer-hebrides-visitor-levy/latest-information/next-steps-and-further-engagement", "https://www.cne-siar.gov.uk/sites/default/files/2026-03/Council_Tax_Leaflet_2026-27.pdf", "https://www.cne-siar.gov.uk/sites/default/files/imce/Committees/Comhairle/2026/April/A-1B-Minute-Comhairle-24-February-2026-at4.00pm.pdf"]], ["Fees and council tax", "3-year licence, 2026/27 fees: a base fee plus £21 per guest. First application: home sharing £189, secondary letting, home letting, or both home sharing and letting £294. Renewal: home sharing £84, the others £189. Example: a 6-guest secondary let costs £294 + 6 × £21 = £420. Temporary exemption (up to 6 weeks) £53, transfer £53, variation £53. No refunds once an application is processed.", ["https://www.cne-siar.gov.uk/stl/fees-and-how-pay", "https://www.cne-siar.gov.uk/business/fees-and-charges/fees-and-charges-licensing-and-miscellaneous/short-term-lets"]]]}, {"n": "South Ayrshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/south-ayrshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through South Ayrshire Council and pay at the end. Send everything on the council's checklist with the application (incomplete ones are rejected and the fee is not refunded): a scaled floor plan, a video of the property, the Scottish Fire and Rescue checklist, a legionella risk assessment and a planning operational statement. You then display a site notice at or near the property for 21 days from the date you applied and send a certificate of compliance. Renewals must go in before your licence expires.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/6936/South-Ayrshire-Council-Short-Term-Let-Licensing-Scheme/pdf/Short_Term_Let_Policy_revised_August_24.pdf?m=1725447111317"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). South Ayrshire asks every applicant for a planning operational statement, so its planning team can decide during the consultation whether your let needs planning permission.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire"]], ["Visitor levy", "No levy. A report to the council's Cabinet on 17 June 2025 recommended pausing all work on a visitor levy until August 2027, after a survey in which 79% of 502 responses opposed one. Even if it is revived then, the council would need to publish a scheme, consult on it and give at least 18 months' notice before charging. (We have seen the report's recommendation but not a record of the Cabinet vote, so treat the pause as reported, not confirmed.) Separately, from 1 April 2024 second homes pay an extra 100% council tax charge (double the standard rate), called the Second Home Premium. You can ask for it to be removed for a time in exceptional circumstances outside your control.", ["https://www.south-ayrshire.gov.uk/article/80918/Future-of-proposed-Visitor-Levy-in-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/15276/Visitor-Levy-Scheme/pdf/item_9a_20250617_C_Visitor_Levy_beyeswk2q9ik.pdf?m=1749210282673", "https://www.south-ayrshire.gov.uk/article/28133/Second-Homes-and-Empty-Property-Charges"]], ["Fees and council tax", "New licence: secondary letting £300 (up to 4 guests) / £480 (5 or more); home sharing or home letting (or both) £150 / £300. Renewal: secondary £240 / £420; home sharing or letting £90 / £240. Temporary licence £120, variation £90, replacement licence £60. Fees are non-refundable. These are the fees in the council's August 2024 policy and on its scheme page. The council consulted on a revised policy, including an updated fee structure, until 12 June 2026, so check for new fees before you apply. (south-ayrshire.gov.uk blocked our direct check; read via a search index of the official pages on 24 Oct 2026.)", ["https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/6936/South-Ayrshire-Council-Short-Term-Let-Licensing-Scheme/pdf/Short_Term_Let_Policy_revised_August_24.pdf?m=1725447111317"]]]}, {"n": "Angus", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/angus", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through Angus Council's short-term lets pages. A new licence lasts up to 3 years and a renewal up to 6 years. If you started letting after 1 Oct 2022 you cannot trade until licensed, and the council has 9 months to decide. A temporary licence lasts up to 6 weeks, and you can get up to three temporary exemptions totalling no more than 6 weeks in 12 months. The council keeps a public register of short-term lets.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1844", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1845"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Angus Council confirms there are currently no short-term let control areas in Angus, and says that could change.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1851"]], ["Visitor levy", "No levy. In June 2024 the Policy and Resources Committee said it was not making any decision to introduce a levy and asked officers to engage with stakeholders first. In October 2025 the council set aside £50,000 of UK Shared Prosperity funding for a tourism framework and early engagement on a possible levy. There is no published scheme or consultation yet, and any Scottish levy needs at least 18 months' notice. Separately, second homes are charged 200% council tax (double, a 100% premium). Some accommodation, including purpose-built holiday homes, is not liable for the 200% charge.", ["https://www.angus.gov.uk/sites/default/files/2024-05/Report%20170_24%20Consideration%20of%20the%20Introduction%20of%20a%20Local%20Visitor%20Levy.pdf", "https://www.angus.gov.uk/sites/default/files/2025-09/Report%20289_25_UK%20Shared%20Prosperity%20Fund%202025-26%20Funding%20Update%20and%20Allocations.pdf", "https://www.angus.gov.uk/council_tax/second_homes", "https://www.gov.scot/binaries/content/documents/govscot/publications/statistics/2019/04/council-tax-datasets/documents/second-homes-and-long-term-empty-policies-and-discounts/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/govscot%3Adocument/CTAS%2B2026%2B-%2BCouncil%2BTax%2BAssumptions%2B-%2BSecond%2Bhome%2Band%2BLTE%2Bpolicies%2Band%2Bdiscounts%2B2026-27.xlsx"]], ["Fees and council tax", "Same fee for all licence types, set by guest numbers: £349 (1 to 5 guests), £460 (6 to 20), £588 (more than 20) for a new 3-year licence or a 6-year renewal. Provisional licence 20% of the full fee (£69.80 / £92 / £117.60), confirmation 80% (£279.20 / £368 / £470.40). Temporary licence or temporary exemption £174.50, variation £75, transfer £75, duplicate £20. No refund if refused or granted for a shorter period. The April 2026 licensing fee rise did not cover short-term lets, so these still apply.", ["https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1846", "https://www.angus.gov.uk/sites/default/files/2026-03/Report%20107_26%20Review%20of%20Fees.pdf"]]]}, {"n": "North Ayrshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/north-ayrshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply to North Ayrshire Council's licensing team, using its STL licensing checklist to gather your supporting documents, and include the fee. A licence lasts 3 years from the date of issue and is normally renewed for a further 3 years. If you apply to renew before it expires, your licence carries on until the council decides. Processing can take up to 3 months. Where public notification is needed, a site notice is normally displayed for 21 days. This covers the mainland and the islands of Arran and Cumbrae.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.north-ayrshire.gov.uk/business-licensing/licensing/accommodation-licences", "https://www.north-ayrshire.gov.uk/documents/short-term-let-licensing-policy"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). North Ayrshire's licensing policy confirms the council does not currently have a short-term let control area and has not adopted an overprovision approach. You may still need planning permission, depending on the property.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.north-ayrshire.gov.uk/documents/short-term-let-licensing-policy"]], ["Visitor levy", "No levy yet. North Ayrshire's 2025 Visitor Management Plan says officers are looking at a possible visitor levy, including stakeholder pre-consultation and an options appraisal, with a report to Cabinet to follow. In January 2026 the Scottish Government said the council had not yet confirmed whether it will go ahead. There is no published scheme, and any Scottish levy needs at least 18 months' notice. Separately, second homes in North Ayrshire (including on Arran and Cumbrae) have paid a 100% council tax premium (double council tax) since 1 April 2025; a let that qualifies for business rates is not charged council tax.", ["https://north-ayrshire.cmis.uk.com/north-ayrshire/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=yjfa8npxsHO7tKbtvX6Ji80pJxePKDYY%2BU9pxstDRxUOF0P%2Bxu8%2BiQ%3D%3D", "https://www.gov.scot/publications/visitor-levy-amendment-scotland-bill-island-communities-impact-assessment-icia/", "https://www.north-ayrshire.gov.uk/Document-library/annual-accounts-2024-to-2025.pdf"]], ["Fees and council tax", "Fees from 1 April 2026, by maximum occupancy (up to 4 guests / 5 or more). New licence: secondary let £300 / £480; home sharing or home letting (or both) £150 / £300. Renewal: secondary let £240 / £420; home sharing or letting £135 / £240. Provisional licence: 25% of the new fee when you apply, 75% on confirmation. Temporary licence: 50% of the new fee. Amendment £75, variation £90, transfer £110, replacement licence £60. No refund if refused, withdrawn or granted for a shorter period.", ["https://www.north-ayrshire.gov.uk/business-licensing/licensing/accommodation-licences"]]]}, {"n": "East Suffolk", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-suffolk", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in the Broads, where the Broads Authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council approved in Feb 2024 a 100% premium on homes that are furnished and nobody's main home, so 200% council tax from 1 Apr 2025. Council tax is billed by Anglia Revenues Partnership for East Suffolk. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). East Suffolk goes further than the national rules: a home actively marketed for sale is excepted for up to 24 months (not 12), and the Section 151 Officer can waive the premium in exceptional cases such as vulnerability or hardship. Claim an exception through the online form, choosing the Long Term Empty and Second Homes option. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.angliarevenues.gov.uk/services/counciltax/reductions/empty-homes/es-second-home-premium.cfm", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Somerset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/somerset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Parts of Somerset are in Exmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 20 Dec 2023 Full Council reaffirmed its Nov 2022 decision to charge a 100% premium on second homes (furnished, nobody's sole or main home) from 1 Apr 2025, so 2 times the normal charge. The council says this includes furnished homes with a planning restriction on occupation. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Somerset also lists Class M (empty homes needing major repairs, 12 months). Where the council already knows an exception applies it is added automatically; otherwise contact the council with evidence. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.somerset.gov.uk/council-tax/council-tax-discounts-and-premiums/", "https://democracy.somerset.gov.uk/ieDecisionDetails.aspx?Id=608", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Ayrshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/east-ayrshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. East Ayrshire Council runs the scheme. Read its licensing policy statement and application guidance and complete the Scottish Fire and Rescue fire safety checklist first, then email your application form and checklist to licensing@east-ayrshire.gov.uk (the forms are PDFs on the council's short-term lets page). You must display a statutory site notice at or near the property for 21 days and return a certificate of compliance. The council also publishes spa pool (hot tub) guidance and records for holiday lets. If you are refused, you can appeal to the Sheriff Court within 28 days.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.east-ayrshire.gov.uk/LawAndLicensing/ApplyForALicence/AccommodationLicences/short-term-lets-licence.aspx", "https://www.east-ayrshire.gov.uk/Resources/PDF/S/short-term-lets-provisional-licence-guidance.pdf"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). For secondary letting you still need to show planning status: East Ayrshire's provisional licence guidance says a copy of the planning certificate must go with the application, and the planning service charges for it separately.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.east-ayrshire.gov.uk/Resources/PDF/S/short-term-lets-provisional-licence-guidance.pdf"]], ["Visitor levy", "No levy. On 1 Oct 2025 East Ayrshire Council decided not to introduce a visitor levy for now and paused further work until August 2027, saying set-up costs of at least £110k and running costs of at least £190k a year would leave little or no net income from its small accommodation sector. It is still discussing a possible regional scheme with neighbouring councils. Any Scottish levy needs at least 18 months' notice. Separately, second homes pay a premium that doubles council tax, from 1 July 2024.", ["https://newsroom.east-ayrshire.gov.uk/news/east-ayrshire-says-no-thanks-to-visitor-levy", "https://www.east-ayrshire.gov.uk/CouncilAndGovernment/CouncilTax/council-tax-premium.aspx"]], ["Fees and council tax", "Short-term let licence fees, by maximum occupancy (up to 4 guests / 5 or more). New licence: secondary let £250 / £400; home sharing, home letting or both £125 / £250. Renewal: secondary let £200 / £350; home sharing or letting £75 / £200. Provisional licence £100 when you apply, with the rest of the new-licence fee due on confirmation. Transfer £50, variation £75, replacement licence £50. Fees are non-refundable.", ["https://www.east-ayrshire.gov.uk/LawAndLicensing/ApplyForALicence/AccommodationLicences/short-term-lets-licence.aspx"]]]}, {"n": "Clackmannanshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/clackmannanshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through Clackmannanshire Council (a PDF form can be posted or handed in at Kilncraigs, Alloa, with the fee and supporting documents). The council points applicants to its Short Term Lets Policy, the fire safety checklist, the mandatory licence conditions and its public Short Term Lets Register. Questions go to licensing@clacks.gov.uk.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.clacks.gov.uk/regulation/licensing/business/shorttermlets/"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). You may still need planning permission, depending on the property, and secondary lets must show their planning status when applying.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy proposed. We found no published visitor levy consultation or scheme for Clackmannanshire (searched 24 Oct 2026), and it is not on the visitorlevy.scot list of councils with approved schemes. In a Scotsman survey of councils, Clackmannanshire said it had no plans to introduce one. Any Scottish levy needs at least 18 months' notice. Separately, from April 2024 second homes are charged 200% council tax (a 100% premium). A 50% discount may apply to job-related homes.", ["https://visitorlevy.scot/visitorlevy/pages/levy-scheme", "https://www.scotsman.com/news/politics/flawed-in-my-eyes-tourist-tax-will-put-off-visitors-from-travelling-to-rural-scotland-4991169", "https://www.clacks.gov.uk/council/counciltaxsecondhomes/"]], ["Fees and council tax", "Fees from the council's Register of Charges 2026/27, by occupancy (4 or under / 5 or above). New licence: secondary letting £514.30 / £628.70; home letting or home sharing (or both) £314.30 / £400. Renewal: secondary letting £457.20 / £571.50 (the register labels the lower band \"4 or above\", which looks like a typo for 4 or under); home letting or sharing £257.20 / £514.30. Variation £75. Fees are non-refundable.", ["https://www.clacks.gov.uk/document/7470.pdf", "https://www.clacks.gov.uk/regulation/licensing/business/shorttermlets/"]]]}, {"n": "Liverpool", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/liverpool", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety. Liverpool's selective landlord licensing scheme (designated wards covering about 80% of the city's private rented homes, 1 Apr 2022 to 31 Mar 2027) is for rented homes, not holiday lets: the national exemptions order exempts a tenancy or licence granted to someone for their occupancy of a home \"as a holiday home\". The council's own pages do not mention short lets specifically and point to the GOV.UK list of exemptions, so if a property is ever let to someone as their home (for example a longer let or a lodger arrangement) it may need a licence. Check with the council through its LAR portal or privatesector.housing@liverpool.gov.uk. HMO licensing (5 or more people from 2 or more households living there) is separate. The current scheme ends in March 2027. In a 10-week consultation that closed on 5 Oct 2026 the council asked for views on three options for a future scheme (citywide, 64 wards; 29 wards based on deprivation; or 26 wards based on poor property conditions), plus licence conditions, fees and discounts; no decision had been published when we checked on 28 Oct 2026 (council news, Liverpool Express).", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets", "https://liverpool.gov.uk/business/licences-and-permits/landlord-licensing/selective-licensing-scheme/", "https://liverpool.gov.uk/business/licences-and-permits/landlord-licensing/selective-licensing-scheme/fees-discounts-and-exemptions/", "https://www.legislation.gov.uk/uksi/2006/370/article/2/made", "https://liverpoolexpress.co.uk/liverpool-residents-invited-to-have-their-say-on-the-future-of-the-private-rented-sector/"]], ["Planning", "No short-let control area or Article 4 direction for short lets found (searched 24 Oct 2026), including in the city centre. Liverpool's Article 4 directions control converting homes into houses in multiple occupation (HMOs), not holiday lets: in the existing areas (the 11 Wards and The Dales directions) you need planning permission to turn a home into an HMO for 3 or more people. On 13 Oct 2026 Cabinet approved wider HMO directions (5 areas covering parts of 17 wards straight away, the rest of the city from Oct 2027), but the decision was called in on 20 Oct 2026 and is paused for now. A whole home let to one group of visitors is not an HMO, so these do not by themselves cover short lets. Whether letting a whole home short term is a material change of use is decided case by case. The council's draft new Local Plan (Regulation 18 draft, Sep to Nov 2025) included a planned short-term let policy (Policy TC7) on concentration, loss of family homes, noise, anti-social behaviour and waste; the Regulation 19 version (Submission Draft Local Plan 2043) was consulted on from 10 Aug to 30 Sep 2026 and keeps Policy TC7: the council would only support turning a home or other property into a short-term let where fewer than 10% of properties within 100m are HMOs, it would not cause an over-concentration of short-term lets, and amenity, regeneration and community balance are not harmed, with a management plan (layout, maximum occupancy, length and frequency of stays, a 24-hour contact and waste arrangements) required (checked 28 Oct 2026). It has not been examined or adopted, so until then the 2022 Local Plan applies.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations", "https://liverpool.gov.uk/planning-and-building-control/planning-permission/planning-permission-for-hmos/", "https://www.bbc.co.uk/news/articles/c6y93n47pzl9o", "https://liverpool.citizenspace.com/planning/draftlocalplan2025-2041/user_uploads/tc7--development-and-mangement-of-short--term-let-accomidation.pdf", "https://liverpool.citizenspace.com/planning/reg19localplan2025-2043/consult_view/", "https://liverpool.gov.uk/media/rdgp1ab4/1-local-plan.pdf"]], ["Visitor levy", "No statutory visitor levy yet. Separately, the city centre Liverpool Accommodation BID charges £2 per room or unit per night (since 1 Jun 2025), but only on hotel or serviced accommodation in the BID area with a rateable value of £45,000 or more, so a typical short let on council tax, or a small business-rated let, is not covered. The BID runs until Dec 2027. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors, including the Liverpool City Region Mayor, charge an Overnight Visitor Levy as a percentage of the accommodation price. The Mayor, Steve Rotheram, has campaigned for it and says it could raise up to £18m a year across the city region (which includes Liverpool, Sefton, Knowsley, St Helens, Wirral and Halton). The Bill still has to pass Parliament, and the government expects mayors to set out spending plans by early 2028, so nothing applies yet and no rate, start date or exemptions have been set. The government says hotels and other accommodation providers will pay the levy to the authority, and local leaders can offer exemptions (such as campsites); the Combined Authority has not published a local scheme or any exemptions yet (checked 5 Nov 2026).", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.liverpoolcityregion-ca.gov.uk/news/new-powers-for-mayor-to-introduce-overnight-visitor-levy", "https://liverpoolcityregion-ca.gov.uk/news/liverpool-city-region-mayor-welcomes-inclusion-of-overnight-visitor-levy-in-kings-speech", "https://liverpool.gov.uk/business/business-rates/bid-levy/", "https://liverpool.gov.uk/council/consultation-and-engagement/consultation-results/results-of-the-accommodation-bid-alteration-ballot-on-the-introduction-of-a-visitor-charge-in-liverpool/"]], ["Fees and council tax", "No short-let fees. Council tax: Liverpool charges twice the normal council tax on second homes (furnished, nobody's main home). The national power allows this from 1 Apr 2025 at the earliest; the council's page confirms the double charge but does not give the date it was decided (checked 28 Oct 2026). Empty and unfurnished homes pay full council tax for the first 12 months, then a premium: 200% of the normal bill after 1 year, 300% after 5 years and 400% after 10 years, even if the owner changes. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). To claim an exception, email Revenue.Service@liverpool.gov.uk with \"Empty properties and second home premium exception\" in the subject and your evidence (for example the estate agent listing). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://liverpool.gov.uk/council-tax/empty-properties-and-second-homes/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Sefton", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/sefton", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety. Sefton runs selective licensing in parts of Bootle and additional HMO licensing in parts of Seaforth, Waterloo, Brighton-le-Sands and Southport (both 1 Mar 2023 to 29 Feb 2028). These are for privately rented homes; the national exemptions order exempts a tenancy or licence granted to someone for their occupancy of a home \"as a holiday home\", so a genuine holiday let should not need a selective licence. Sefton's pages do not mention short lets specifically, so if you let rooms separately or let to people as their home, check with landlord.licensing@sefton.gov.uk.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets", "https://www.sefton.gov.uk/housing/private-sector-housing/landlord-licensing-and-accreditation/selective-licensing-2023-2028/", "https://www.sefton.gov.uk/housing/private-sector-housing/landlord-licensing-and-accreditation/additional-hmo-licensing-2023-2028/", "https://www.legislation.gov.uk/uksi/2006/370/article/2/made"]], ["Planning", "Planning guidance applies. Sefton adopted a Conversions to Short Term Holiday Lets Supplementary Planning Document on 5 Dec 2024 (in operation from 18 Dec 2024). It says a home let as a whole to one family-sized group, with no more occupants than would normally live there, is unlikely to need planning permission. Letting rooms separately to different groups, adding bedrooms, or letting to a group larger than a normal household (or a large all-adult group) is likely to be a material change of use that needs permission. Converting shops, offices, pubs and other non-residential buildings always needs permission. In Primarily Residential Areas the council will refuse a conversion if 5% of properties within 100 metres are already short-term lets, flats or HMOs, and expects no more than 2 people per room, no subdivided rooms, enough parking and bin space, and no hot tubs or outdoor bars that could disturb neighbours. Town, district and local centres are favoured. A let of more than 28 days at a time is treated as an ordinary home or HMO, not a holiday let. Separately, Article 4 directions now cover the whole borough for converting homes into small HMOs (most recently the rest of Sefton from 15 Oct 2025); these are about HMOs, not short lets.", ["https://www.sefton.gov.uk/media/pynlmwev/finaldraftshorttermletsspd.pdf", "https://www.sefton.gov.uk/media/zrfbiaro/shorttermletsspdadoptionstatement.pdf", "https://www.sefton.gov.uk/planning-building-control/planning-policy-including-local-plan-and-neighbourhood-planning/article-4-directions/article-4-direction-for-houses-in-multiple-occupation"]], ["Visitor levy", "No visitor levy yet. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors, including the Liverpool City Region Mayor, charge an Overnight Visitor Levy as a percentage of the accommodation price. The Mayor, Steve Rotheram, has campaigned for it and says it could raise up to £18m a year across the city region (which includes Sefton, so Southport, Formby and Crosby). The Bill still has to pass Parliament, and the government expects mayors to set out spending plans by early 2028, so nothing applies yet and no rate, start date or exemptions have been set. The government says hotels and other accommodation providers will pay the levy to the authority, and local leaders can offer exemptions (such as campsites); the Combined Authority has not published a local scheme or any exemptions yet (checked 5 Nov 2026).", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.liverpoolcityregion-ca.gov.uk/news/new-powers-for-mayor-to-introduce-overnight-visitor-levy", "https://liverpoolcityregion-ca.gov.uk/news/liverpool-city-region-mayor-welcomes-inclusion-of-overnight-visitor-levy-in-kings-speech"]], ["Fees and council tax", "No short-let fees. Council tax: on 18 Jan 2024 Full Council approved a 100% premium on homes that are substantially furnished with nobody living there, so second homes pay 200% council tax from 1 Apr 2025. Empty and unfurnished homes pay a premium after 1 year: 200% of the normal bill for 1 to 5 years, 300% for 5 to 10 years and 400% after 10 years, regardless of change of owner. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Sefton also lists Class M (empty homes needing major repairs, 12 months). To claim, email Council.Tax@sefton.gov.uk with your account number in the subject and the class you are claiming; for a home on the market, give the date marketing started and where it is advertised. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.sefton.gov.uk/council-tax/council-tax/discounts-and-exemptions/council-tax-premiums/", "https://modgov.sefton.gov.uk/documents/g11105/Printed%20minutes%2018th-Jan-2024%2018.30%20Council.pdf?T=1", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Midlothian", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/midlothian", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Midlothian Council asks you to pay online first; the payment receipt number and time then go on the main application form. Questions go to shorttermlet@midlothian.gov.uk. The council links its Short-term Lets Policy (2022), a fire safety checklist and a Legionnaires' disease risk assessment, and publishes a public licence register. Renew before your licence expires: if you do, you can keep operating until the old licence ends or the council decides, whichever is later. A late renewal is treated as a new application and you must stop taking bookings until it is granted; the council may accept one made within 28 days of expiry on good grounds, case by case. Operating without a licence can mean a fine of up to £2,500 and a one-year ban from applying.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.midlothian.gov.uk/info/200269/licences_and_permits/742/short-term_let_licence", "https://www.midlothian.gov.uk/downloads/file/4749/short_term_lets_policy_october_2022"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). You may still need planning permission depending on the property, and secondary lets must show their planning status when applying.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. Midlothian ran a visitor levy survey in 2024 (24 responses), which the council called inconclusive. Officers are monitoring Edinburgh, Argyll and Bute and Aberdeen and said Midlothian would reassess a levy in 2026; we found no 2026 decision yet (searched 24 Oct 2026). A 2023 council report estimated a levy might raise about £180k a year against running costs of £190k to £500k. Any Scottish levy needs at least 18 months' notice. Separately, since 1 April 2026 the council has charged graduated premiums on long-term empty homes (100% after 1 year, 300% after 2 years and 500% after 3 years, up to 600% council tax) and says similar premiums will normally be applied to second homes. Its 24 February 2026 report proposed 200% council tax on second homes for the first 2 years, 400% from 25 months and 600% from 37 months. The Scottish Government's 2026-27 return, however, lists a 100% second homes premium, with a 50% discount for purpose-built holiday homes and job-related homes. UNVERIFIED Ask the council which rate applies to your home.", ["https://midlothiancouncil.citizenspace.com/economic-development/the-visitor-levy-for-midlothian/", "https://www.edinburghnews.scotsman.com/news/politics/council/tourist-tax-midlothian-wont-follow-edinburgh-lead-as-report-warns-visitor-levy-may-cost-more-than-it-raises-4423759", "https://www.midlothian.gov.uk/info/606/council_tax/890/long_term_empty_property_and_second_home_premiums", "https://midlothian.cmis.uk.com/Live/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=NeNZ1CgyM98NIJd4eLH6L5dvkLw7pTjaQLmMgmh746QXlZ0GKvorTw%3d%3d&rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d", "https://www.gov.scot/binaries/content/documents/govscot/publications/statistics/2019/04/council-tax-datasets/documents/second-homes-and-long-term-empty-policies-and-discounts/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/second-homes-and-long-term-empty-policies-and-discounts-2026-27-data/govscot%3Adocument/CTAS%2B2026%2B-%2BCouncil%2BTax%2BAssumptions%2B-%2BSecond%2Bhome%2Band%2BLTE%2Bpolicies%2Band%2Bdiscounts%2B2026-27.xlsx"]], ["Fees and council tax", "Fees from 1 April 2026, the same for a new licence or a renewal. Secondary letting: up to 4 bedrooms / 8 guests £541; 5 to 8 bedrooms / 16 guests £609; 8 to 12 bedrooms / 16 to 24 guests £767; above that £61 per extra room or guest. Home sharing or home letting: 1 bedroom / 3 guests £247; 2 to 3 bedrooms / 9 guests £290; 4 bedrooms / 9 guests £383; above that £61 per extra room or guest. A material change or licence transfer costs £315 / £368 / £452 (secondary) or £116 / £152 / £221 (home), and a variation £89. Duplicate licence £37; a visit made necessary by the host's failure £127 an hour.", ["https://www.midlothian.gov.uk/info/200269/licences_and_permits/742/short-term_let_licence"]]]}, {"n": "West Lothian", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/west-lothian", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through West Lothian Council, then email your evidence to stl@westlothian.gov.uk. The council will not hold an incomplete application. Its list of required documents includes planning permission or a certificate of lawfulness (for every application, see below), a 1:50 floor plan showing room sizes, fire escapes, alarms and fire doors (not needed for an unchanged renewal), owner consent where you are not the owner, an EPC where one applies, a fire safety risk assessment, a gas safety certificate (where there is gas), an EICR and a PAT report. The council checks with Scottish Fire and Rescue, which may lead to an inspection.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.westlothian.gov.uk/article/75805/Short-Term-Lets", "https://www.westlothian.gov.uk/media/67906/Short-Term-Let-Policy-Oct-2025/pdf/2025_Short_Term_Let_Policy.pdf"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). But West Lothian says every short-term let licence application, of any type, must come with planning permission or a certificate of lawfulness for short-stay use (or one confirming the use is not a material change), and an application without one cannot be progressed. Contact the planning service directly, as the licensing team cannot advise on planning.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.westlothian.gov.uk/article/75805/Short-Term-Lets"]], ["Visitor levy", "No levy yet. In June 2025 the Council Executive agreed to start early engagement with tourism businesses on a possible levy (a report modelled 2% and 5% rates), and the council stressed no decision had been made. We found no formal consultation or scheme since (searched 24 Oct 2026). Any Scottish levy needs at least 18 months' notice. Separately, from 1 April 2024 a second home is charged twice the full council tax for its band (a 100% premium).", ["https://www.edinburghlive.co.uk/news/promise-west-lothian-tourist-tax-31984400", "https://theedinburghreporter.co.uk/2025/06/tourist-tax-could-generate-1m-income-in-west-lothian/", "https://www.westlothian.gov.uk/article/77582/Second-Homes"]], ["Fees and council tax", "check with council West Lothian publishes two different fee tables. The council's Schedule of Fees and Charges 2025/26 sets fees by bedrooms: secondary letting £500.86 (1 bedroom), £612.16 (2 to 3), £801.38 (4 to 6), £1,113.03 (7 or more); home sharing or letting £361.73, £467.47, £662.25, £962.77. Variation £166.95, temporary licence 50% of the full fee, temporary exemption £333.91, inspection and report £133.56. The short-term lets web page still shows the fees agreed in December 2022, set by guests: se
