g more than 28 days in a row (Class L). Apply using the council's Empty and Second Home Review Form, with the evidence it asks for (for example the planning condition for a holiday-only home). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.iow.gov.uk/news/introduction-of-the-second-homes-premium-what-you-need-to-know/", "https://digitalservices.iow.gov.uk/documents/download/empty-homes-and-second-homes-premium-policy1", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Denbighshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/denbighshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 150% on top of the standard charge (250% in total) since 1 Apr 2025 (100% from 1 Apr 2024). Full Council on 8 Jul 2025 agreed to keep 150% for second homes from 1 Apr 2026. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition).", ["https://www.denbighshire.gov.uk/en/council-tax/premium.aspx"]]]}, {"n": "Carmarthenshire", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/carmarthenshire", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double) for all second homes from 1 Apr 2025 (50% from 1 Apr 2024, approved by Council on 8 Mar 2023). Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Ask about exceptions at counciltaxpremium@carmarthenshire.gov.uk.", ["https://www.carmarthenshire.gov.wales/council-services/council-tax/council-tax-premiums/"]]]}, {"n": "Swansea", "nat": "Wales", "url": "https://ukshortletrules.co.uk/councils/swansea", "sec": [["Licensing or registration", "No council licence yet. Wales-wide: if you take bookings of 31 nights or fewer you must register with the Welsh Revenue Authority by 31 Mar 2027 (free, applies even with no council levy). A national licensing scheme is legislated but not in force (default commencement March 2030). Check if you must register.", ["https://www.gov.wales/registering-visitor-accommodation-overview", "https://industry.visitwales.com/about-us/tourism-policies-and-legislation"]], ["Planning", "No Article 4 direction or local short-let planning control found (checked 23 Oct 2026). Wales-wide, use classes C3 (main home), C5 (second home) and C6 (short-term let) exist since Oct 2022, and moving between them is permitted development unless an Article 4 direction applies.", ["https://www.legislation.gov.uk/wsi/2022/994/article/2/made", "https://www.gov.wales/written-statement-changes-planning-legislation-and-policy-second-homes-and-short-term-lets"]], ["Visitor levy", "No levy. GOV.WALES lists Cardiff as the only council that will charge the Visitor Levy and lists no councils consulting on it (checked 23 Oct 2026). Any Welsh levy needs a consultation, a full Council decision and 12 months' notice.", ["https://www.gov.wales/check-if-local-council-charges-visitor-levy-wales", "https://www.gov.wales/visitor-levy-for-visitor-accommodation-providers-overview"]], ["Fees and council tax", "WRA registration is free. Council tax second-home premium: 100% on top of the standard charge (so double), in place since 1 Apr 2021. It applies to any home that is furnished and nobody's sole or main residence. Exceptions include Class 5 (occupied caravan pitches and boat moorings) and Class 6 (seasonal homes or holiday lets where year-round occupation is prohibited, for example by a planning condition). Swansea notes the marketed-for-let exception (Class 2) is for tenancies of at least 6 months, not holiday or Airbnb lets. Send evidence to council.tax@swansea.gov.uk.", ["https://www.swansea.gov.uk/counciltaxpremiums"]]]}, {"n": "Falkirk", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/falkirk", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Falkirk Council takes applications using its short-term let application pack (Licensing Board: licensing@falkirk.gov.uk, 01324 501575). The council publishes a public register of short-term let licences.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.falkirk.gov.uk/businesses-premises-venues-licenses/short-term-lets"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Check whether your let needs planning permission anyway; Falkirk links to a separate short-term lets planning page from its licensing page.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.falkirk.gov.uk/businesses-premises-venues-licenses/short-term-lets"]], ["Visitor levy", "Not approved. Formal consultation on a draft scheme runs from 2 Sep to 25 Nov 2026: 5% of the cost of overnight accommodation only (not food, parking or other extras), with providers proposed to keep 2%. The council says it has not decided, and full Council is expected to consider it in January 2027 (the consultation page says early 2027). Any Scottish levy needs at least 18 months' notice before it starts.", ["https://www.falkirk.gov.uk/visitor-levy/the-levy", "https://fcwebsites.blob.core.windows.net/www/media/e2c569be-f9a8-4fb3-8090-b97aae41bafd/Frequently-Asked-Questions-FAQs-Falkirk-Council-Draft-Visitor-Levy-Scheme.pdf", "https://www.visitscotland.org/tourism-events-industry/visitor-levy"]], ["Fees and council tax", "From the council's published 2025/26 fee table (the latest short-term let table we found; check for a 2026/27 update). The same fee applies to new, renewal and temporary applications. Secondary letting: £315 (up to 4 guests) / £504 (5 or more). Home letting, home sharing, or both: £157.50 / £315. Paid as 20% at provisional grant and 80% at confirmation. Transfer £105.", ["https://www.falkirk.gov.uk/licensing-fees-and-charges/licensing-fees-and-charges/short-term-lets-licensing-scheme"]]]}, {"n": "Orkney Islands", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/orkney-islands", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through Orkney Islands Council: guidance notes, application form, floor and location plans, and a separate Scottish Fire and Rescue Service fire safety checklist. You display a notice at the property (28-day objection period) only when the council asks you to. The council publishes a register of licences.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.orkney.gov.uk/business-and-licensing/licensing-information-and-applications/short-term-lets-licensing"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. The council's Policy and Resources Committee decided on 23 Sep 2025 not to go ahead with an overnight visitor levy \"at this time\", after a feasibility study with Shetland and the Western Isles found strong local opposition, practical problems and marginal returns. The council prefers a cruise ship or point-of-entry levy, which the current law does not allow.", ["https://www.orkney.gov.uk/latest-news/orkney-islands-council-decides-against-overnight-visitor-levy"]], ["Fees and council tax", "3-year licence, 2026/27 fees (3.8% up on 2025/26). Secondary letting: £354 (up to 4 guests), £434 (5 to 9), £583 (10 or more). Home sharing and home letting: £275 / £343 / £457. Non-linked isles get 25% off: secondary £266 / £326 / £437, home sharing and letting £206 / £257 / £343. Temporary licence (up to 6 weeks) £275 (£206 non-linked isles), transfer £138 (£103). The first £275 of each application fee is non-refundable.", ["https://www.orkney.gov.uk/business-and-licensing/licensing-information-and-applications/short-term-lets-licensing", "https://www.orkney.gov.uk/media/s3xpbcdp/short_term_lets_licensing_application_fees.pdf"]]]}, {"n": "Shetland Islands", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/shetland-islands", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Shetland Islands Council's Environmental Health team runs the scheme: apply through the council's online portal, by email to stl@shetland.gov.uk, or by post to Environmental Health, Gutters' Hut, 7 North Ness, Lerwick ZE1 0LZ. Fees are non-refundable whether or not a licence is granted.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.shetland.gov.uk/stl", "https://www.shetland.gov.uk/downloads/file/6364/short-term-lets-licensing-policy"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. Councillors on the Policy and Resources Committee decided against an overnight visitor levy in September 2025 after a feasibility study said the risks outweighed the benefits. The council has been looking at a point-of-entry levy instead, which would need new law.", ["https://www.bbc.com/news/articles/cj6xrkd3l9ro", "https://www.orkney.gov.uk/latest-news/orkney-islands-council-decides-against-overnight-visitor-levy"]], ["Fees and council tax", "2026/27 fees, now set by guest numbers rather than bedrooms. Home sharing or home letting: £210 (1 to 6 guests) / £335 (7 or more). Secondary letting: £370 / £530. Admin fee £37. From the council's 2026-27 Environmental Health charges schedule (shetland.gov.uk blocked our direct check, so read via a search index of the official file on 24 Oct 2026).", ["https://www.shetland.gov.uk/downloads/file/7747/environmental-health-charges"]]]}, {"n": "Na h-Eileanan Siar (Western Isles)", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/na-h-eileanan-siar", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Comhairle nan Eilean Siar short-term lets pages: send the completed application and fee to stl@cne-siar.gov.uk, any Comhairle office, or by post to Stornoway. Submit renewals, with everything needed, about 3 months before your licence expires; if a complete renewal is not in before expiry you count as a new operator and cannot take bookings or guests until licensed.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.cne-siar.gov.uk/stl"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland).", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas"]], ["Visitor levy", "No levy. The Comhairle has paused detailed work on an accommodation-based visitor levy, citing challenges for island businesses, and is looking at other options for funding tourism. It says any formal proposal would be consulted on before councillors consider it.", ["https://www.cne-siar.gov.uk/business/tourism/outer-hebrides-visitor-levy/latest-information", "https://www.cne-siar.gov.uk/business/tourism/outer-hebrides-visitor-levy/latest-information/next-steps-and-further-engagement"]], ["Fees and council tax", "3-year licence, 2026/27 fees: a base fee plus £21 per guest. First application: home sharing £189, secondary letting, home letting, or both home sharing and letting £294. Renewal: home sharing £84, the others £189. Example: a 6-guest secondary let costs £294 + 6 × £21 = £420. Temporary exemption (up to 6 weeks) £53, transfer £53, variation £53. No refunds once an application is processed.", ["https://www.cne-siar.gov.uk/stl/fees-and-how-pay", "https://www.cne-siar.gov.uk/business/fees-and-charges/fees-and-charges-licensing-and-miscellaneous/short-term-lets"]]]}, {"n": "South Ayrshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/south-ayrshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply online through South Ayrshire Council and pay at the end. Send everything on the council's checklist with the application (incomplete ones are rejected and the fee is not refunded): a scaled floor plan, a video of the property, the Scottish Fire and Rescue checklist, a legionella risk assessment and a planning operational statement. You then display a site notice at or near the property for 21 days from the date you applied and send a certificate of compliance. Renewals must go in before your licence expires.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/6936/South-Ayrshire-Council-Short-Term-Let-Licensing-Scheme/pdf/Short_Term_Let_Policy_revised_August_24.pdf?m=1725447111317"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). South Ayrshire asks every applicant for a planning operational statement, so its planning team can decide during the consultation whether your let needs planning permission.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire"]], ["Visitor levy", "No levy. A report to the council's Cabinet on 17 June 2025 recommended pausing all work on a visitor levy until August 2027, after a survey in which 79% of 502 responses opposed one. Even if it is revived then, the council would need to publish a scheme, consult on it and give at least 18 months' notice before charging. (We have seen the report's recommendation but not a record of the Cabinet vote, so treat the pause as reported, not confirmed.)", ["https://www.south-ayrshire.gov.uk/article/80918/Future-of-proposed-Visitor-Levy-in-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/15276/Visitor-Levy-Scheme/pdf/item_9a_20250617_C_Visitor_Levy_beyeswk2q9ik.pdf?m=1749210282673"]], ["Fees and council tax", "New licence: secondary letting £300 (up to 4 guests) / £480 (5 or more); home sharing or home letting (or both) £150 / £300. Renewal: secondary £240 / £420; home sharing or letting £90 / £240. Temporary licence £120, variation £90, replacement licence £60. Fees are non-refundable. These are the fees in the council's August 2024 policy and on its scheme page. The council consulted on a revised policy, including an updated fee structure, until 12 June 2026, so check for new fees before you apply. (south-ayrshire.gov.uk blocked our direct check; read via a search index of the official pages on 24 Oct 2026.)", ["https://www.south-ayrshire.gov.uk/article/40559/Short-Term-Let-Licensing-Scheme-South-Ayrshire", "https://www.south-ayrshire.gov.uk/media/6936/South-Ayrshire-Council-Short-Term-Let-Licensing-Scheme/pdf/Short_Term_Let_Policy_revised_August_24.pdf?m=1725447111317"]]]}, {"n": "Angus", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/angus", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply through Angus Council's short-term lets pages. A new licence lasts up to 3 years and a renewal up to 6 years. If you started letting after 1 Oct 2022 you cannot trade until licensed, and the council has 9 months to decide. A temporary licence lasts up to 6 weeks, and you can get up to three temporary exemptions totalling no more than 6 weeks in 12 months. The council keeps a public register of short-term lets.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1844", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1845"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). Angus Council confirms there are currently no short-term let control areas in Angus, and says that could change.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1851"]], ["Visitor levy", "No levy. In June 2024 the Policy and Resources Committee said it was not making any decision to introduce a levy and asked officers to engage with stakeholders first. In October 2025 the council set aside £50,000 of UK Shared Prosperity funding for a tourism framework and early engagement on a possible levy. There is no published scheme or consultation yet, and any Scottish levy needs at least 18 months' notice.", ["https://www.angus.gov.uk/sites/default/files/2024-05/Report%20170_24%20Consideration%20of%20the%20Introduction%20of%20a%20Local%20Visitor%20Levy.pdf", "https://www.angus.gov.uk/sites/default/files/2025-09/Report%20289_25_UK%20Shared%20Prosperity%20Fund%202025-26%20Funding%20Update%20and%20Allocations.pdf"]], ["Fees and council tax", "Same fee for all licence types, set by guest numbers: £349 (1 to 5 guests), £460 (6 to 20), £588 (more than 20) for a new 3-year licence or a 6-year renewal. Provisional licence 20% of the full fee (£69.80 / £92 / £117.60), confirmation 80% (£279.20 / £368 / £470.40). Temporary licence or temporary exemption £174.50, variation £75, transfer £75, duplicate £20. No refund if refused or granted for a shorter period. The April 2026 licensing fee rise did not cover short-term lets, so these still apply.", ["https://www.angus.gov.uk/licences_and_permits/short_term_lets?page_id=1846", "https://www.angus.gov.uk/sites/default/files/2026-03/Report%20107_26%20Review%20of%20Fees.pdf"]]]}, {"n": "North Ayrshire", "nat": "Scotland", "url": "https://ukshortletrules.co.uk/councils/north-ayrshire", "sec": [["Licensing or registration", "Licence needed (Scotland-wide). All short-term lets (secondary letting, home letting, home sharing) need a licence from the council before taking bookings or guests. Step-by-step licence guide and checklist. Apply to North Ayrshire Council's licensing team, using its STL licensing checklist to gather your supporting documents, and include the fee. A licence lasts 3 years from the date of issue and is normally renewed for a further 3 years. If you apply to renew before it expires, your licence carries on until the council decides. Processing can take up to 3 months. Where public notification is needed, a site notice is normally displayed for 21 days. This covers the mainland and the islands of Arran and Cumbrae.", ["https://www.gov.scot/publications/short-term-lets/", "https://www.north-ayrshire.gov.uk/business-licensing/licensing/accommodation-licences", "https://www.north-ayrshire.gov.uk/documents/short-term-let-licensing-policy"]], ["Planning", "No control area. mygov.scot lists only two in Scotland (all of Edinburgh, and Badenoch & Strathspey in Highland). North Ayrshire's licensing policy confirms the council does not currently have a short-term let control area and has not adopted an overprovision approach. You may still need planning permission, depending on the property.", ["https://www.mygov.scot/short-term-let-licences/planning-permission-control-areas", "https://www.north-ayrshire.gov.uk/documents/short-term-let-licensing-policy"]], ["Visitor levy", "No levy yet. North Ayrshire's 2025 Visitor Management Plan says officers are looking at a possible visitor levy, including stakeholder pre-consultation and an options appraisal, with a report to Cabinet to follow. In January 2026 the Scottish Government said the council had not yet confirmed whether it will go ahead. There is no published scheme, and any Scottish levy needs at least 18 months' notice. Separately, second homes in North Ayrshire (including on Arran and Cumbrae) have paid a 100% council tax premium (double council tax) since 1 April 2025; a let that qualifies for business rates is not charged council tax.", ["https://north-ayrshire.cmis.uk.com/north-ayrshire/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=yjfa8npxsHO7tKbtvX6Ji80pJxePKDYY%2BU9pxstDRxUOF0P%2Bxu8%2BiQ%3D%3D", "https://www.gov.scot/publications/visitor-levy-amendment-scotland-bill-island-communities-impact-assessment-icia/", "https://www.north-ayrshire.gov.uk/news/council-tax-levy-to-be-implemented-on-second-homes"]], ["Fees and council tax", "Fees from 1 April 2026, by maximum occupancy (up to 4 guests / 5 or more). New licence: secondary let £300 / £480; home sharing or home letting (or both) £150 / £300. Renewal: secondary let £240 / £420; home sharing or letting £135 / £240. Provisional licence: 25% of the new fee when you apply, 75% on confirmation. Temporary licence: 50% of the new fee. Amendment £75, variation £90, transfer £110, replacement licence £60. No refund if refused, withdrawn or granted for a shorter period.", ["https://www.north-ayrshire.gov.uk/business-licensing/licensing/accommodation-licences"]]]}, {"n": "East Suffolk", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-suffolk", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Part of the district is in the Broads, where the Broads Authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Full Council approved in Feb 2024 a 100% premium on homes that are furnished and nobody's main home, so 200% council tax from 1 Apr 2025. Council tax is billed by Anglia Revenues Partnership for East Suffolk. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). East Suffolk goes further than the national rules: a home actively marketed for sale is excepted for up to 24 months (not 12), and the Section 151 Officer can waive the premium in exceptional cases such as vulnerability or hardship. Claim an exception through the online form, choosing the Long Term Empty and Second Homes option. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.angliarevenues.gov.uk/services/counciltax/reductions/empty-homes/es-second-home-premium.cfm", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Somerset", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/somerset", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction for holiday lets found (searched 24 Oct 2026). The C5 short-term let use class is still only a proposal in England, so whether letting a whole home is a material change of use is decided case by case by the planning authority. Parts of Somerset are in Exmoor National Park, where the park authority handles planning. Check before converting a home or outbuilding.", ["https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 10 Sep 2026 the government announced that mayors and Foundation Strategic Authority leaders in England will get the power to bring in an Overnight Visitor Levy, as a percentage of the accommodation price. A bill is still to come, so nothing applies yet.", ["https://www.gov.uk/government/news/local-leaders-handed-powers-to-drive-investment-in-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 20 Dec 2023 Full Council reaffirmed its Nov 2022 decision to charge a 100% premium on second homes (furnished, nobody's sole or main home) from 1 Apr 2025, so 2 times the normal charge. The council says this includes furnished homes with a planning restriction on occupation. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Somerset also lists Class M (empty homes needing major repairs, 12 months). Where the council already knows an exception applies it is added automatically; otherwise contact the council with evidence. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.somerset.gov.uk/council-tax/council-tax-discounts-and-premiums/", "https://democracy.somerset.gov.uk/ieDecisionDetails.aspx?Id=608", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}]},T=true,N=document.getElementById('ck-n'),Cs=document.getElementById('ck-c'),O=document.getElementById('ck-out');
