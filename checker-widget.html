 borough. The Great Yarmouth Local Plan 2024-2042, adopted on 24 September 2026, replaced the Core Strategy (2015) and the Local Plan Part 2 (2021), including Part 2's Policy L1 Holiday Accommodation Areas (council historic local plans page, read 5 Nov 2026). The council still resists losing holiday accommodation in the Great Yarmouth seafront area: a 2026 refusal cites new-plan policies URB13 and HOU7, which seek to encourage specialist and short-term holiday accommodation behind the seafront. New holiday accommodation is usually given conditions that it is for holidays only, is never anyone's sole or main home, and keeps a register of guests and their home addresses for the council to inspect; some holiday parks also have a seasonal closed period. Check the planning conditions on any holiday unit before you buy.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=152", "https://www.planning.data.gov.uk/entity/4221135", "https://gybc1-prd.gosshosted.com/article/2491/Historic-local-plans", "https://planning.great-yarmouth.gov.uk/OcellaWeb/planningConditions?reference=06%2F26%2F0076%2FCU", "https://planning.great-yarmouth.gov.uk/OcellaWeb/planningConditions?reference=06%2F25%2F0469%2FVCF", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: on 14 Dec 2023 the council resolved to charge an extra 100% premium on furnished homes with no resident from 1 Apr 2025, so a second home pays double council tax (200%). The council says there are more than 1,000 second homes in the borough, and that under an agreement with Norfolk County Council and the other districts, 25% of the money raised by the premium goes back to the districts whose communities are most affected by second homes. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If you think the premium should not apply, use the council's online occupation of a second home form, which lists the exceptions. The 12-month exception for a home marketed for sale runs from the first date it went on the market. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.great-yarmouth.gov.uk/article/5669/Do-I-have-to-pay-Council-Tax-on-an-empty-property-or-second-home", "https://www.great-yarmouth.gov.uk/article/13383/Second-homes-premium-frequently-asked-questions", "https://www.great-yarmouth.gov.uk/council-tax", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Wealden", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/wealden", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets (checked 3 Nov 2026). The national planning data register lists 87 Article 4 records for Wealden (some duplicated), almost all site-specific (farmland, woodland, plots and caravan sites, from 1959 onwards), plus one for the Rotherfield conservation area (2006); none is about holiday lets. Whether letting a whole home as a holiday let is a material change of use is decided case by case. Part of the district is in the South Downs National Park, where the National Park Authority handles planning under the South Downs Local Plan (adopted July 2019). Elsewhere the development plan is the Core Strategy Local Plan (February 2013), saved 1998 Local Plan policies, the Affordable Housing Delivery Local Plan (2016) and neighbourhood plans such as Herstmonceux (2019) and Hailsham (2021). A new Wealden Local Plan to 2042 is at its final stage: representations on the Proposed Submission version closed on 2 Nov 2026, the council intends to submit it for examination before the end of 2026, with examination expected in 2027 and adoption aimed for by the end of 2027. We have not yet checked the draft for holiday-let policies (unverified), and it is not in force.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=361", "https://wealdengov-b994c1bb48cf487f1616-endpoint.azureedge.net/blobwealdengov-staging/UploadedFiles/LDS-September-2026-with-addendum-September-2026-Final.pdf", "https://www.wealden.gov.uk/planning-and-building-control/planning-policy/new-local-plan/", "https://letstalk.wealden.gov.uk/proposed-submission-local-plan-regulation-19", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: Cabinet recommended the Empty Homes and Second Homes Premium Policy on 7 Feb 2024 and the council agreed it on 21 Feb 2024. Second homes (furnished homes that are nobody's sole or main residence) pay a 100% premium on top of the standard charge from 1 Apr 2025, so 200% council tax. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council lists the national exception classes and asks for evidence (for example an agent's letter and a live listing for a home marketed for sale or let); contact localtax@wealden.gov.uk. Empty and substantially unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (over 10 years); a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.wealden.gov.uk/council-tax/council-tax-discounts/second-home-and-long-term-empty-property-premiums/", "https://council.wealden.gov.uk/ieDecisionDetails.aspx?ID=2921", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Stratford-on-Avon", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/stratford-on-avon", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area or Article 4 direction aimed at holiday lets that we found (checked 3 Nov 2026); the national planning data register lists no Article 4 directions for Stratford-on-Avon District Council, so check the council's own records for a specific property. Whether letting a whole home as a holiday let is a material change of use is decided case by case. The development plan is the Core Strategy 2011 to 2031, adopted on 11 July 2016, plus neighbourhood plans. The council's April 2026 review found that in key respects, notably housing land supply, Core Strategy policies must be treated as out of date, while many other policies keep full weight. A new South Warwickshire Local Plan, prepared with Warwick District Council, is set to replace the Core Strategy's strategic policies: its final (Regulation 19) consultation ran from 21 July to 8 September 2026 and the next step is submission for independent examination. We have not checked that draft for holiday-let policies (unverified), and it is not in force.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=321", "https://www.stratford.gov.uk/planning-building/core-strategy.cfm", "https://www.stratford.gov.uk/planning-building/planning-policy.cfm", "https://southwarwickshire.oc2.uk/document/168", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: since 1 Apr 2013 second homes in the district get no discount, so they pay 100% council tax. The council has agreed a 100% second homes premium across the whole district from 1 Apr 2027, so a second home will then pay double council tax (200%). Cabinet and Council agreed it on 23 Feb 2026, after a consultation from 15 Dec 2025 to 2 Feb 2026 (589 online responses plus 8 paper ones), and the council said all second home owners would be written to before 31 Mar 2026; it counts 859 second homes in the district (over 1% of all homes). At the 19 Feb 2026 scrutiny meeting, members were told the council could still decide not to go ahead before the 2027/28 year, and the committee asked for more information, and a chance to comment later in the year, on exemptions and how the premium will be put in place. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.stratford.gov.uk/council-tax/council-tax-premiums-on-second-homes-consultation.cfm", "https://democracy.stratford.gov.uk/mgAi.aspx?ID=51450", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Oxford", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/oxford", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 3 Nov 2026). The national planning data register lists 4 Article 4 directions for Oxford: Jericho (2011), Osney Town (1993), Wolvercote Green (2007) and a city-wide direction for houses in multiple occupation (from 25 Feb 2012); none is about holiday lets. Under the Oxford Local Plan 2036 (adopted 8 June 2020), Policy V5 allows new holiday and other short stay accommodation only in the city centre, district centres, sites allocated for it and on the main arterial roads with frequent, direct public transport to the city centre, and only with no loss of a residential dwelling; Policy H5 refuses development that causes the net loss of a self-contained home, with narrow exceptions. In a decision of 11 Dec 2024 a planning inspector upheld the council's enforcement notice against a house in Headington run as short-term let accommodation, finding a material change of use from a C3 home that conflicted with Policies H5 and V5; the owner had 12 weeks to stop its primary use as a short-term let. The inspector made clear that occasional short-term letting of a house that stays mainly a home may not need permission: it is a question of fact and degree in each case. A new Oxford Local Plan 2045 was submitted for examination on 14 July 2026; stage 2 hearings run from 24 Nov to 11 Dec 2026 and the council expects to adopt it in May 2027. We have not checked its short stay policy wording (unverified), and it is not yet in force.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=251", "https://www.oxford.gov.uk/downloads/file/1637/adopted-oxford-local-plan-2036", "https://acp.planninginspectorate.gov.uk/ViewDocument.aspx?fileid=60271835", "https://www.oxford.gov.uk/oxford-local-plan-2045/oxford-local-plan-2045-examination", "https://www.oxford.gov.uk/oxford-local-plan-2045", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 a 100% premium applies to most second homes (furnished homes that are nobody's sole or main residence), so they pay double council tax (200%). Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). If one applies, use the council's online form to apply for an exception (you need your 9-digit council tax account number). Empty and unfurnished homes have paid premiums since 1 Apr 2024: 100% after 1 year, 200% after 5 years and 300% after 10 years, and a change of owner does not reset the clock. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.oxford.gov.uk/council-tax-discounts-exemptions/council-tax-empty-property-premium", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Cambridge", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/cambridge", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 4 Nov 2026). The national planning data register lists 19 Article 4 directions for Cambridge: 18 cover pubs or former pubs (2014) and one the Accordia estate (2014); none is about holiday lets. Whether letting a whole home as a short-term let is a material change of use is decided case by case. A council briefing note from March 2017 says short-term letting is not a material change of use while the home still meets the occupants' day-to-day residential needs, and that each complaint is judged as a matter of fact and degree: how many days a year it is let, how often guests change, its size, how many rooms are let, whether the host lives there and whether guests are one household. Enforcement officers had already served planning contravention notices, and in January 2018 planning officers recommended 13 enforcement notices against flats at Florian House and Roman House (Severn Place) used as commercial short-term visitor accommodation without permission. Under the Cambridge Local Plan 2018 (adopted October 2018), Policy 3 supports changing housing to other uses only in exceptional circumstances. The new Greater Cambridge Local Plan, prepared with South Cambridgeshire, goes further: draft Policy J/VA says that where planning permission is needed, converting homes to visitor accommodation in Cambridge will be allowed only in exceptional circumstances, and only if it does not harm residents' amenity and sense of security or the area's character; its supporting text names clusters of short lets near the railway station and at Trumpington Meadows. Its final consultation ran from 3 Aug to 25 Sep 2026; a joint Cabinet on 17 Nov and Cambridge's Full Council on 26 Nov 2026 will consider submitting it in December 2026, with examination expected from spring 2027. It is not yet in force.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=70", "https://democracy.cambridge.gov.uk/documents/s38249/Briefing%20Note%20on%20Short%20Term%20Lets%20FINAL%20060317.pdf", "https://democracy.cambridge.gov.uk/documents/s41213/EN008817%20and%20EN008717%20-%20Report.pdf", "https://www.greatercambridgeplanning.org/media/s4lbyx3z/local-plan-2018.pdf", "https://consultations.greatercambridgeplanning.org/proposed-submission-greater-cambridge-local-plan/jobs/policy-jva-visitor-accommodation-attractions", "https://www.greatercambridgeplanning.org/emerging-plans-and-guidance/greater-cambridge-local-plan", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: since 1 Apr 2025 a 100% premium applies to furnished second homes that are nobody's sole or main residence, so they pay double council tax (200%); the council says this includes holiday homes and homes used for short-term holiday rental. It was agreed at the council's Strategy and Resources committee on 25 Mar 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Homes empty and unfurnished for more than 12 months also pay a premium: 100% at first, rising to 200% after 5 years and 300% after 10 years, and a change of owner does not remove it. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.cambridge.gov.uk/council-tax-for-empty-and-second-homes", "https://www.cambridge.gov.uk/discounts-for-empty-homes-and-annexes", "https://www.cambridge.gov.uk/business-rates-for-self-catering-and-holiday-let-accommodation", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Bristol", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/bristol", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 4 Nov 2026). The national planning data register lists 16 Article 4 directions for Bristol: 7 remove the right to turn a family home into a small house in multiple occupation (areas and wards, 2011 to 2020) and the other 9 cover particular streets and areas (for example Royal York Crescent, Henbury and Henleaze); none is about holiday lets. Whether letting a whole home as a holiday let is a material change of use is decided case by case. The adopted development plan is the Core Strategy (June 2011), the Site Allocations and Development Management Policies (July 2014) and the Bristol Central Area Plan (2015); we found no policy aimed at short lets in the first two. A new Bristol Local Plan 2022 to 2040 was submitted for examination on 25 April 2024. Its publication version (November 2023) includes Policy H2, which refuses planning permission for the loss of an existing home (houses and flats) unless the site is unsuitable for housing, the loss is needed for essential infrastructure or community facilities, or the home is replaced. Main modifications were consulted on from 27 April to 12 June 2026, the inspectors are considering the responses, and the council expects to adopt the plan in late 2026. We have not checked whether the main modifications change Policy H2 (unverified), and the plan is not yet in force.", ["https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=66", "https://www.bristol.gov.uk/residents/planning-and-building-regulations/planning-policy-and-guidance/local-plan", "https://www.bristol.gov.uk/residents/planning-and-building-regulations/planning-policy-and-guidance/local-plan/local-plan-review/local-plan-examination", "https://www.bristol.gov.uk/files/documents/6894-bristol-local-plan-main-document-publication-version-nov-2023", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 a 100% premium applies to homes that are substantially furnished but nobody's only or main home, so they pay twice the normal charge (200%). Cabinet and Council decided this on 23 Jan and 28 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). To claim one, use the council's premium exception form and send the evidence it asks for; if an exception is granted, the standard charge is still payable. Homes empty and substantially unfurnished pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.bristol.gov.uk/residents/council-tax/empty-properties-and-council-tax", "https://www.bristol.gov.uk/files/documents/7397-council-tax-notice-2024-25/file", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Manchester", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/manchester", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 4 Nov 2026). Manchester's Article 4 directions cover turning a family home into a small house in multiple occupation (city-wide, so letting a house to 3 or more unrelated people who share facilities needs permission) and, in certain areas, changing offices or light industrial buildings to homes. A whole home let to one group of visitors is not an HMO. Whether letting a whole home as a short-term let is a material change of use is decided case by case. A council report to the Economy and Regeneration Scrutiny Committee (25 June 2024) says planning law does not currently require a change of use for a home to be used as a short-term let, so the council is usually unaware when one starts. It counted about 3,600 Airbnb listings in Manchester (AirDNA data, Q1 2024), including 2,118 entire homes, 997 of them in the city centre. It also notes that buyers of 300 new homes in the Brunswick regeneration scheme must sign a covenant banning short-term letting, and that more and more city centre apartment blocks restrict short lets in their leases, so check your lease. The adopted plan is the Core Strategy (2012) with the Greater Manchester Places for Everyone plan (2024). The new Manchester Local Plan has no short-let policy: its publication consultation ran from 17 Aug to 28 Sep 2026, and when people asked for one the council replied that short lets are difficult to control under current planning law, and that the national short-let use class the government has signalled would give councils more control. The council's timetable (subject to change) is submission in December 2026, examination from January to June 2027 and adoption by 31 July 2027.", ["https://www.manchester.gov.uk/planning-and-regeneration/guide-to-development/article-4-directions", "https://democracy.manchester.gov.uk/documents/s47622/Short-term%20lets%20in%20Manchester.pdf", "https://www.manchester.gov.uk/planning-and-regeneration/planning/local-plan/publication-draft", "https://democracy.manchester.gov.uk/documents/s64206/Consultation%20Statement%20August%202026.pdf", "https://democracy.manchester.gov.uk/documents/s64217/Consultation%20Statement%20August%202026%20Q30%20-%20Q39%20C1%20-%20C12.pdf", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No statutory visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet. Separately, the Manchester Accommodation BID adds a £1 City Visitor Charge per room or unit per night (plus VAT where applicable), in place since April 2023, but the council says it applies only to paid accommodation businesses in the BID zone with a rateable value of £75,000 or more, so a typical short let on council tax, or a small business-rated let, is not covered. The current BID term runs for five years from 1 Apr 2023.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities", "https://www.manchester.gov.uk/business-and-investment/invest-or-locate-in-manchester/supporting-business-through-our-partners/manchester-accommodation-business-improvement-district", "https://manchesterabid.com/"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Manchester charges a 100% premium on second homes (furnished, nobody's main home), so the bill doubles. The council says a home used by someone, but not as their main home, pays the premium from the day it became a second home; a furnished home that nobody lives in pays it after 12 months. The council's Executive agreed this on 17 Jan 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Homes empty and unfurnished pay full council tax for the first 12 months, then a premium: 100% for up to 5 years, 200% from 5 to 10 years and 300% after 10 years. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.manchester.gov.uk/council-tax/definitions-and-overview/what-you-have-to-pay-if-a-second-home-isnt-exempt-from-council-tax", "https://www.manchester.gov.uk/council-tax/definitions-and-overview/what-you-have-to-pay-if-your-empty-property-isnt-exempt-from-council-tax", "https://democracy.manchester.gov.uk/mgAi.aspx?ID=13526", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Blackpool", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/blackpool", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "Blackpool says most Airbnb-style holiday lets need planning permission. Its advice note on serviced holiday accommodation (page last updated April 2023) says self-contained holiday flats and houses with no on-site management, let to different visitors with cleaning and fresh linen between stays, are a sui generis use, different from both a home (class C3) and a hotel or guest house (class C1). So turning a home, or a hotel or guest house, into one needs planning permission, and no permitted development right allows it. It says a holiday home stays in class C3 only rarely, generally where it is the owner's own second or holiday home, or their own home let very occasionally while they are away. New holiday accommodation is supported in principle in the Town Centre, the Resort Core and the six Holiday Accommodation Areas (The Cliffs, North Town Centre, South Town Centre, Foxhall, South Beach and Pleasure Beach North); outside these, permission \"generally will not be granted\". Even inside them the council weighs the size of the property, its communal and outdoor space and the neighbours; holiday flat schemes should be no more than 30% one-bedroom units and meet residential space standards, and permissions are likely to carry conditions such as a maximum occupancy. The opposite change is also controlled: under Core Strategy Policy CS23 (2016) and the Holiday Accommodation SPD (November 2017), turning holiday accommodation into homes is resisted inside the main Holiday Accommodation Areas except in exceptional circumstances, but allowed outside them. No Article 4 direction aimed at holiday lets: the national planning data register lists 6 for Blackpool (small HMOs from 2022, locally listed buildings, the Stanley Park and Raikes Hall conservation areas, and the Promenade from 1949). The Local Plan Part 2 was adopted on 22 Feb 2023, and the council has started work on a new local plan to 2042.", ["https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-policy/Blackpool-local-plan/Supplementary-planning-documents-and-guidance/Serviced-holiday-accommodation-in-Blackpool-advice-note.aspx", "https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Documents/Adopted-holiday-accommodation-SPD.pdf", "https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-policy/Blackpool-local-plan/Site-allocations-and-development-management-policies.aspx", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=55", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Blackpool charges a 100% premium on homes that are substantially furnished and occupied only from time to time (second homes), so the bill doubles. The council says this can include holiday homes and short-term holiday lets where the guests' main home is elsewhere, and furnished rental homes that are empty between lets. Council agreed it on 21 Feb 2024 and gave notice on 14 Mar 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Exceptions are not automatic: apply to the council with evidence (for Class L it asks for a copy of the certificate of lawfulness). Homes empty and substantially unfurnished pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (over 10 years), with two local exceptions (a year after a sale, and 2 years after probate). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.blackpool.gov.uk/Residents/Council-tax/Council-Tax-premiums.aspx", "https://democracy.blackpool.gov.uk/documents/s97350/PH4%20Council%20Tax%20Base%2025-26%20Decision.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Lancaster", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/lancaster", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 5 Nov 2026). Lancaster's Article 4 directions cover changing a family home into a small house in multiple occupation (Use Class C4, 3 to 6 occupants) in the Lancaster wards of Bulk, Castle, John O'Gaunt, Marsh, Scotforth East, Scotforth West, Skerton East and Skerton West plus the village of Galgate (in force since 10 Nov 2021), and minor building works in several conservation areas (Bath Mill, Lancaster, Glasson Dock, Heysham, Westfield Memorial Village and Morecambe); none is about holiday-let use. The national planning data register lists 34 Article 4 direction areas for Lancaster City Council. Whether letting a whole home as a short-term let is a material change of use is decided case by case; the council's pre-application advice service is the place to check before converting a home or outbuilding.", ["https://www.lancaster.gov.uk/planning/planning-advice/designations-and-constraints?chapter=5", "https://www.lancaster.gov.uk/planning/planning-advice/pre-application-advice", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=190", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Lancaster charges a 100% premium on furnished second homes (nobody's sole or main residence), so the bill doubles (200%). The determination was published on 29 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Contact Revenue Services (01524 582900) if you think an exception applies; the council may ask for evidence. Homes empty and unfurnished pay full council tax after a one-month 100% discount, then a premium after 12 months (since 1 Apr 2024, decided 28 Feb 2023): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.lancaster.gov.uk/council-tax/council-tax-reductions?chapter=3", "https://www.lancaster.gov.uk/assets/attach/13002/Press-Notice-Council-Tax-Empty-2nd-home-Premium-LCC-.pdf", "https://lancaster.gov.uk/assets/attach/17775/LCC-Council-Tax-Leaflet-2026-27.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "High Peak", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/high-peak", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets (checked 5 Nov 2026). High Peak's Article 4 directions in some of its 32 conservation areas (outside the Peak District National Park) remove permitted development rights for minor works such as windows, doors and other alterations, not holiday-let use; the national planning data register lists none for High Peak Borough Council. Whether letting a whole home as a short-term let is a material change of use is decided case by case. Part of the borough is in the Peak District National Park, where the National Park Authority handles planning. Inside the National Park, Development Management Policy DMR3 (adopted May 2019) says that outside the settlements named in its Core Strategy, new self-catering accommodation, where acceptable, is restricted to holiday use; the Authority's planning reports describe this as holiday accommodation for no more than 28 days a year by any one person. The Authority's draft Local Plan (Preferred Approach, September 2025) proposes a primary residence clause on all new housing, including holiday accommodation converted to housing; it is not adopted and would not apply to existing homes.", ["https://www.highpeak.gov.uk/article/633/Conservation-areas", "https://democracy.peakdistrict.gov.uk/mgAi.aspx?ID=10805", "https://democracy.peakdistrict.gov.uk/documents/s48183/0522-0598_Hartington%20Cottages%20FJ.pdf", "https://democracy.peakdistrict.gov.uk/documents/s61882/Appendix%201%20-%20Local%20Plan%20Preferred%20Approach%20FINAL%2016%20Sept%202025.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=166", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=405", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 High Peak charges a 100% premium on second homes (substantially furnished and nobody's sole or main residence), so the bill doubles. The council's Second Home Premium page (last modified 6 Aug 2025) confirms it, and its Feb 2025 budget news said the decision was made the year before. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply on the council's empty property exemption form if you think an exception applies; the council may also waive an empty premium in severe financial hardship linked to serious illness, disability or vulnerability. Homes empty and substantially unfurnished pay a premium after 12 months (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and a change of owner does not remove it. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.highpeak.gov.uk/article/8415/Second-Home-Premium", "https://www.highpeak.gov.uk/article/8414/Long-Term-Empty-Property-Premium", "https://www.highpeak.gov.uk/article/8264/Council-sets-budget-for-delivering-essential-services", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Herefordshire", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/herefordshire", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Herefordshire Council (checked 5 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. New tourist accommodation is judged against Core Strategy Policy E4 (Tourism, 2015), which supports new accommodation across the county that extends the season and increases overnight stays, while saying significant new accommodation should be focused in Hereford and the market towns and only small-scale tourism development may suit rural areas. A big local factor is river pollution: the council says all planning applications in the River Lugg and River Clun catchments must show nutrient neutrality (no extra phosphate, and for the Clun nitrate too) before the Habitats Regulations Assessment can be signed off, using Natural England's nutrient budget calculator, with council phosphate credits available to some applicants in the Lugg catchment. Use the council's pre-application advice service before converting a building to holiday use.", ["https://councillors.herefordshire.gov.uk/documents/s50028641/cs_for_council.pdf", "https://herefordshire.gov.uk/planning-and-building-control/nutrient-management/nutrient-management-guidance-for-developers/", "https://herefordshire.gov.uk/planning-and-building-control/nutrient-management/nutrient-management-guidance-for-developers/development-in-the-river-lugg-catchment-area/", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=164", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Herefordshire charges an extra 100% premium on second homes (furnished and nobody's main or sole residence), so the bill is 200%. The council says this also applies to holiday lets that do not meet the government's business rates rules for self-catering, and to homes used for seasonal workers. Council decided it on 9 Feb 2024 and published the statutory notice on 29 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). To claim an exception, email counciltax@herefordshire.gov.uk with both addresses, your 8-digit council tax reference, the exception class and evidence (the council aims to reply within 4 weeks). There is no discount for empty homes; empty and unfurnished homes pay 200% council tax after 1 year, 300% after 5 years and 400% after 10 years. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.herefordshire.gov.uk/secondhome", "https://www.herefordshire.gov.uk/council-tax/council-tax-premiums-for-empty-properties-and-second-homes", "https://www.herefordshire.gov.uk/council-tax/council-tax-premiums-for-empty-properties-and-second-homes/exceptions-to-premiums-for-long-term-empty-properties-and-second-homes/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Shropshire", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/shropshire", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Shropshire Council (checked 5 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. New visitor accommodation is covered by Policy MD11 of the SAMDev Plan (adopted 17 Dec 2015): holiday let development that is not a caravan and not a conversion of an existing suitable rural building is resisted in the countryside, following the same approach as open-market homes there; proposals in or next to the Shropshire Hills AONB must pay particular regard to landscape impact; new visitor accommodation sites in the Severn Valley are resisted; and new planning permissions for visitor accommodation get conditions so it is not used as a permanent home. Turning a holiday let into a permanent home needs to show its loss will not significantly harm the visitor economy. The adopted Local Plan is the Core Strategy (2011) and SAMDev Plan (2015). Council agreed on 17 Jul 2025 to withdraw the draft Local Plan (2016-2038) from examination; the new plan's timetable (September 2026) expects submission in August 2028 and adoption around March 2029.", ["https://www.shropshire.gov.uk/media/8503/samdev-adopted-plan.pdf", "https://next.shropshire.gov.uk/planning-policy/adopted-local-plan/", "https://shropshire.gov.uk/committee-services/ieListDocuments.aspx?MeetingId=5219", "https://next.shropshire.gov.uk/media/idtnwyrg/plan-making-timetable-september-2026-v2.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=297", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Shropshire charges a 100% premium on second homes (substantially furnished and nobody's main residence), so the bill doubles. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The exceptions only remove the premium; the standard council tax is still payable. Homes empty and substantially unfurnished get a 100% discount for the first month, then full council tax, then a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (over 10 years). A change of owner does not remove it; furnishing or occupying the home for 6 weeks in a row does. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://next.shropshire.gov.uk/council-tax/council-tax-liability-and-empty-property-charges/council-tax-on-empty-property/", "https://next.shropshire.gov.uk/media/npgjenxz/council-tax-leaflet-202526.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Forest of Dean", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/forest-of-dean", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists two for Forest of Dean District Council, covering Newnham conservation area (2007) and land at English Bicknor (2011), neither about holiday lets (checked 5 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Core Strategy (adopted 23 Feb 2012), the Allocations Plan (adopted June 2018, which sets settlement boundaries and makes several tourism allocations) and the Cinderford Northern Quarter Area Action Plan. Full Council voted on 30 Jun 2026 to withdraw the emerging Local Plan; the council has started a new plan under the 2026 plan-making system, with its timetable (amended draft October 2026) showing a scoping consultation from 14 Jan to 28 Feb 2027, submission for examination on 2 Jan 2029 and adoption on 1 Sep 2029.", ["https://www.fdean.gov.uk/planning-and-building/planning-policy/adopted-core-strategy-cnqaap-and-allocations-plan/", "https://www.fdean.gov.uk/media/5icnycdx/core-strategy-adoption-statement.pdf", "https://fdean.gov.uk/planning-and-building/planning-policy/local-plan-archive/draft-local-plan-2041/", "https://www.fdean.gov.uk/fdlptimetable", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=139", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 the Forest of Dean charges an additional 100% premium on second homes (furnished and not anyone's main home), so the bill doubles. Full Council decided it on 14 Sep 2023. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council says a home it treats as a second home stays on council tax at the normal rate until the Valuation Office Agency moves it to business rates. Empty and substantially unfurnished homes get a 25% discount for up to 6 months, then no discount, and from 1 Apr 2025 pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.fdean.gov.uk/council-tax-and-benefits/second-homes/", "https://www.fdean.gov.uk/council-tax-and-benefits/council-tax-discounts-and-exemptions/reductions-for-empty-properties/council-tax-on-long-term-empty-properties/", "https://www.fdean.gov.uk/council-tax-and-benefits/council-tax-discounts-and-exemptions/reductions-for-empty-properties/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "East Riding of Yorkshire", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/east-riding-of-yorkshire", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists 11 for East Riding of Yorkshire Council, all from 1995 on named properties in Atwick (checked 5 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. New tourism accommodation is covered by Policy EC2 of the Local Plan Update (Strategy Document Update, adopted 2 Apr 2025): tourism accommodation is encouraged, especially year-round and all-weather offers; in the countryside it is supported where scale, design and cumulative impact suit the location and it re-uses existing buildings, is a camping or caravan site, is farm diversification, supports an existing attraction or has a functional need to be there; and seafront tourism is supported in the Seafront Areas of Bridlington, Hornsea and Withernsea. Tourism accommodation in the countryside gets holiday occupancy conditions, and the council's holiday accommodation guidance says its model conditions (used since 2005) mean holiday use only, never anyone's sole or main home, with the operator keeping a register of occupants' main addresses; it takes enforcement action on breaches. Coastal proposals must also meet Policy ENV6 (flood risk and the Coastal Change Management Area). The council completed Gateway 1 for a new East Riding Local Plan on 30 Oct 2026, which will replace the 2025 plan.", ["https://www.eastriding.gov.uk/planning-permission-and-building-control/planning-policy-and-the-local-plan/east-riding-local-plan-update/local-plan-strategy/local-plan-strategy-item/?entry=developing_and_diversifying_the_visitor_economy_6_a_prosperous_economy", "https://www.eastriding.gov.uk/planning-permission-and-building-control/planning-policy-and-the-local-plan/east-riding-local-plan-update/", "https://www.eastriding.gov.uk/planning-permission-and-building-control/planning-enforcement-and-legislation/planning-enforcement-and-breaches-of-planning-control/holiday-accommodation-guidance/", "https://www.eastriding.gov.uk/news/article/?entry=preparation_of_the_east_riding_local_plan_reaches_key_milestone", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=131", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from April 2025 the East Riding charges a 100% second home premium on homes that are substantially furnished and usually unoccupied, not anyone's main home, so most second home owners pay double. It does not apply where an exception or an unoccupied property exemption applies, or where you let the property commercially and pay business rates instead. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). To ask for an exception, or if you think your home is not a second home, email council.tax@eastriding.gov.uk with your account reference, the address, the exception and evidence; you can also apply for a discretionary reduction for hardship. Homes empty and substantially unfurnished pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more), and a change of owner does not reset it. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.eastriding.gov.uk/housing/council-tax/second-homes-and-empty-properties/second-homes/", "https://www.eastriding.gov.uk/housing/council-tax/second-homes-and-empty-properties/long-term-empty-homes/", "https://www.eastriding.gov.uk/housing/council-tax/second-homes-and-empty-properties/exceptions-to-additional-charges/", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Birmingham", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/birmingham", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists 12 for Birmingham City Council, covering named conservation areas (Old Yardley, Bournville Village, High Street Sutton Coldfield, Austin Village, Edgbaston, Moor Pool, Moseley, Greenfield Road Harborne, St Agnes Moseley, Selly Park Avenues and Selly Park) and a city-wide Houses in Multiple Occupation direction in force since 8 Jun 2020, none about holiday lets (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Birmingham Development Plan 2031 (adopted 10 Jan 2017).", ["https://www.birmingham.gov.uk/info/20054/local_plan_documents/78/birmingham_development_plan", "https://www.birmingham.gov.uk/info/20054/local_plan_documents/1933/city-wide_article_4_direction_for_houses_in_multiple_occupation", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=44", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Birmingham charges a 100% premium on second homes (substantially furnished dwellings with no permanent resident, not anyone's sole or main residence), so the bill doubles. The council's second homes page and its 2026-27 council tax help booklet both say so. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council also lists Class E (armed forces accommodation) with the shared empty/second-home exceptions, and Class M (empty homes needing major repairs, up to 12 months). If your property qualifies for an exception you still pay the standard council tax. For a job-related second home that is part of your employment contract you can get a 50% discount (not the premium exception alone): apply with the council's other council tax enquiry form; the council may send a questionnaire and aims to reply in at least 2 weeks. Empty and substantially unfurnished homes have paid a premium since 1 Apr 2024 after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more); the premium stays with the property when it is sold. If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.birmingham.gov.uk/info/20144/apply_for_a_council_tax_discount_or_exemption/806/information_about_council_tax_on_second_homes", "https://www.birmingham.gov.uk/info/20005/council_tax/3040/premium_charges", "https://www.birmingham.gov.uk/info/20005/council_tax/3040/premium_charges/2", "https://www.birmingham.gov.uk/download/downloads/id/18855/budget_for_birmingham_council_tax_help_and_information_booklet_2026_to_2027.pdf", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Plymouth", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/plymouth", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists one for Plymouth City Council, an HMO direction for Mutley, Greenbank, the city centre and surrounding areas (2012), not holiday lets (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Plymouth and South West Devon Joint Local Plan (adopted by Plymouth City Council on 26 Mar 2019, five-year review 2024), shared with South Hams and West Devon. Policy PLY21 supports visitor accommodation, including self-catering, on appropriate sites in the city's core tourism area (the waterfront from Sutton Harbour / The Barbican to Royal William Yard, including the Hoe, Millbay and the City Centre), and resists losing important visitor facilities unless there are over-riding sustainability or regeneration benefits or the use is shown to be unviable. After a Joint Local Plan Partnership Board decision in January 2025, Plymouth has started a new Local Plan for the city alone; the council's Local Plan page says the Joint Local Plan stays in force until the new plan is adopted, which it expects in spring 2029. Plymouth is not in Dartmoor National Park.", ["https://www.plymouth.gov.uk/adopted-plymouth-and-south-west-devon-joint-local-plan", "https://www.plymouth.gov.uk/plymouth-and-south-west-devon-joint-local-plan", "https://www.plymouth.gov.uk/local-plan", "https://www.plymouth.gov.uk/planning-permission-and-houses-multiple-occupation-hmo", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=253", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Plymouth charges a 100% premium on dwellings that are substantially furnished and not occupied as anyone's sole or main residence, so second homes pay double. Cabinet reconfirmed this on 8 Jan 2024 after the Levelling-up and Regeneration Act's delay, moving the start from the earlier 2024 plan to 1 Apr 2025. The council's premiums page (checked 6 Nov 2026) says all such furnished properties are subject to full charge plus 100%. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). Apply for an exception online with the council's premium exception form. Empty and substantially unfurnished homes pay a premium after 1 year: 100% (1 to 5 years), 200% (5 to 10 years) and 300% (10 years or more); a change of owner does not remove it. Empty-home exceptions also include major repairs or structural alterations (12 months). If your holiday let meets the business rates test (available at least 140 nights and actually let at least 70 nights in the last 12 months, and you plan to offer 140 nights in the next 12), it is valued for business rates instead of council tax, so the premium does not apply. A single let with a rateable value under £15,000 may get small business rate relief.", ["https://www.plymouth.gov.uk/council-tax-premiums", "https://democracy.plymouth.gov.uk/ieDecisionDetails.aspx?Id=4354", "https://www.gov.uk/introduction-to-business-rates/self-catering-and-holiday-let-accommodation"]]]}, {"n": "Staffordshire Moorlands", "nat": "England", "url": "https://ukshortletrules.co.uk/councils/staffordshire-moorlands", "sec": [["Licensing or registration", "No licensing or local registration scheme. A national short-term let register for England is coming under the Levelling-up and Regeneration Act 2023; GOV.UK (updated 2 Oct 2026) says it is expected to begin in March 2027. Until then, the main local rules are council tax or business rates, planning, and fire safety.", ["https://www.gov.uk/guidance/delivering-a-registration-scheme-for-short-term-lets"]], ["Planning", "No short-let control area, and no Article 4 direction aimed at holiday lets: the national planning data register lists none for Staffordshire Moorlands District Council (checked 6 Nov 2026). Whether letting a whole home as a short-term let is a material change of use is decided case by case. The adopted Local Plan is the Staffordshire Moorlands Local Plan 2014-2033 (adopted 9 Sep 2020). Policy E4 supports tourism and visitor accommodation that complements the district's character; Policy SS11 (Churnet Valley Strategy) supports overnight visitor accommodation and tourist facilities there. Part of the district is in the Peak District National Park, where the National Park Authority handles planning. Inside the National Park, Development Management Policy DMR3 (adopted May 2019) says that outside the settlements named in its Core Strategy, new self-catering accommodation, where acceptable, is restricted to holiday use; the Authority's planning reports describe this as holiday accommodation for no more than 28 days a year by any one person. The Authority's draft Local Plan (Preferred Approach, September 2025) proposes a primary residence clause on all new housing, including holiday accommodation converted to housing; it is not adopted and would not apply to existing homes.", ["https://www.staffsmoorlands.gov.uk/article/771/Planning-Policy", "https://democracy.staffsmoorlands.gov.uk/documents/s18381/Adoption%20of%20the%20Staffordshire%20Moorlands%20Local%20Plan.pdf", "https://democracy.peakdistrict.gov.uk/mgAi.aspx?ID=10805", "https://democracy.peakdistrict.gov.uk/documents/s48183/0522-0598_Hartington%20Cottages%20FJ.pdf", "https://democracy.peakdistrict.gov.uk/documents/s61882/Appendix%201%20-%20Local%20Plan%20Preferred%20Approach%20FINAL%2016%20Sept%202025.pdf", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=317", "https://www.planning.data.gov.uk/entity/?dataset=article-4-direction&organisation_entity=405", "https://www.gov.uk/guidance/letting-out-a-self-catering-holiday-home-in-england-rules-and-regulations"]], ["Visitor levy", "No visitor levy. On 4 Nov 2026 the government introduced the Visitor Levy Bill, which would let mayors and Foundation Strategic Authority leaders charge an Overnight Visitor Levy as a percentage of the accommodation price. The Bill still has to pass Parliament, so nothing applies yet.", ["https://www.gov.uk/government/news/new-visitor-levy-powers-to-put-money-back-into-local-communities"]], ["Fees and council tax", "No short-let fees. Council tax: from 1 Apr 2025 Staffordshire Moorlands charges a 100% premium on second homes (furnished properties that are nobody's sole or main residence), so the bill doubles. The council's Empty property premium page confirms it, and a January 2025 Full Council report said the decision was approved on 28 Feb 2024. Exceptions (national rules from 1 Apr 2025) include: annexes treated as part of the main home (Class F); homes actively marketed for sale or let (Classes G and H, 12 months); probate (Class I, 12 months); job-related homes (Class J); occupied caravan pitches and boat moorings (Class K); and seasonal homes where year-round living is banned, or a planning condition limits use to holiday accommodation or stops anyone staying more than 28 days in a row (Class L). The council's page also lists those exceptions (armed forces, annexes, marketed for sale or let for up to 12 months, probate for 12 months, caravan pitches and boat moorings, planning restrictions that stop year-round occupation, and job-related homes). Email evidence if your bill shows a premium and you think an exception applies; the council may also waive an empty premium in severe financial hardship linked to serious illness, disability or vulnerability. Homes empty and substantially unfurnished pay a premium after 12 months (since 1 Apr 2024): 100% (1 to 5 years), 200% (5 to 10 years) a
